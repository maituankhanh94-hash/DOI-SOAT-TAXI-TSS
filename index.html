    function restoreDeletedTrips() {
      if (!lastDeletedTripBackup || lastDeletedTripBackup.length === 0) { alert("Không có đơn hàng nào để khôi phục!"); return; }
      let updates = {};
      lastDeletedTripBackup.forEach(trip => {
        if (!trip.dateKey) trip.dateKey = tripDateKey(trip) || fallbackDateKey(trip);
        updates[`trips/${trip.id}`] = trip;
        if (trip.createdBy) {
          updates[`users_trips/${trip.createdBy}/${trip.id}`] = trip;
        }
      });
      const restored = lastDeletedTripBackup;
      dbRoot().update(updates).then(() => {
        logTrips('restore', restored, () => 'Bấm "Khôi phục đơn vừa xóa"');
        alert("Đã khôi phục đơn hàng thành công!");
        lastDeletedTripBackup = null;
        const container = document.getElementById('floating-undo-container');
        if (container) container.remove();
      });
    }

    function handleSmartTicketFocus(currentIndex) {
      const currentInput = document.getElementById(`t-${currentIndex}`);
      if (currentInput && !currentInput.value.trim() && currentIndex > 0) {
        for (let j = currentIndex - 1; j >= 0; j--) {
          const prevInput = document.getElementById(`t-${j}`);
          if (prevInput && prevInput.value.trim()) {
            const prevVal = prevInput.value.trim();
            const match = prevVal.match(/^(.*?)(\d+)$/);
            if (match) {
              const prefix = match[1];
              const numStr = match[2];
              const numLength = numStr.length;
              const nextNum = parseInt(numStr, 10) + (currentIndex - j);
              const formattedNum = String(nextNum).padStart(numLength, '0');
              currentInput.value = prefix + formattedNum;
            }
            break;
          }
        }
      }
    }

    // Team Kế hoạch: biển số KHÔNG bắt buộc (10/11). Các phân vùng khác vẫn bắt buộc.
    function plateOptional(role) { return isPlanRole(role); }
    async function submitBatch(role) {
      if (!loggedInUser) return;
      const plateOpt = plateOptional(loggedInUser.role);
      // Quy ước: địa chỉ nội thành bắt buộc ghi Quận (Bán vé + Kế hoạch). Có dòng thiếu -> chưa lưu dòng nào, để sửa lại.
      if (usesPriceList()) {
        const noDistrict = [];   // chỉ số dòng thiếu Quận
        for (let i = 0; i < 20; i++) {
          const dEl = document.getElementById(`d-${i}`);
          const dest = dEl ? dEl.value.trim() : '';
          const filled = document.getElementById(`staff-${i}`).value.trim() && document.getElementById(`t-${i}`).value.trim() && (plateOpt || document.getElementById(`p-${i}`).value.trim()) && dest;
          if (!filled) continue;
          const it = rowPriceItem(i);
          if (!destHasDistrict(dest, it && it.id, (document.getElementById(`m-${i}`) || {}).value)) { noDistrict.push(i); dEl.classList.add('ring-2', 'ring-red-500'); }
          else dEl.classList.remove('ring-2', 'ring-red-500');
        }
        if (noDistrict.length) {
          showDestFixModal(noDistrict.map(i => ({ label: `dòng ${i+1}`, dest: document.getElementById(`d-${i}`).value.trim() })));
          return;
        }
      }
      // Đơn nhập cho ngày cũ hơn khoảng đã tải: tải thêm đơn của đúng ngày đó để kiểm tra trùng
      let dupPool = personalTrips;
      if (staffMode === 'window' && staffWinFrom) {
        const oldKeys = new Set();
        for (let i = 0; i < 20; i++) {
          const el = document.getElementById(`date-${i}`);
          const dk = el ? tripDateKey({ dateStr: el.value }) : '';
          if (dk && dk < staffWinFrom && document.getElementById(`t-${i}`).value.trim()) oldKeys.add(dk);
        }
        for (const dk of oldKeys) {
          try {
            const snap = await dbRef(`users_trips/${loggedInUser.user}`).orderByChild('dateKey').equalTo(dk).once('value');
            dupPool = dupPool.concat(Object.values(snap.val() || {}));
          } catch (e) {}
        }
      }
      const savedDests = [];
      const timeStr = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
      let count = 0;
      let updates = {};
      let duplicateDetails = [];
      let lastFormattedDate = '';

      // Mảng lưu trữ các đơn chuẩn bị đưa lên để check trùng ngay trong nội bộ lô nhập hàng loạt này
      let batchEntriesToCheck = [];
      let invalidDateRows = [];
      let overDiscountRows = [];

      for (let i = 0; i < 20; i++) {
        let rawDate = document.getElementById(`date-${i}`).value.trim();
        let formattedDate = normalizeDateInput(rawDate);
        if (formattedDate) lastFormattedDate = formattedDate;

        const rawStaff = document.getElementById(`staff-${i}`).value.trim();
        const ticket = document.getElementById(`t-${i}`).value.trim();
        const plate = document.getElementById(`p-${i}`).value.trim().toUpperCase();
        const dest = document.getElementById(`d-${i}`).value.trim();
        const totalFare = parseFloat(document.getElementById(`f-${i}`).value.replace(/[^0-9]/g, '')) || 0;
        const carType = document.getElementById(`c-${i}`).value;
        const source = document.getElementById(`src-${i}`).value;
        const pickup = document.getElementById(`pick-${i}`).value;
        const pay = document.getElementById(`m-${i}`).value;
        const note = document.getElementById(`note-${i}`).value.trim();

        if (rawStaff && ticket && (plate || plateOpt) && dest && !isValidDateStr(formattedDate)) {
          invalidDateRows.push(`Dòng ${i+1} ("${rawDate}")`);
          continue;
        }

        // Bảng giá (Bán vé + Kế hoạch): lưu giá bảng theo điểm đến + loại xe. Giảm quá mức VẪN CHO LƯU, Quản lý lọc ra xem.
        let priceFields = {};
        if (rawStaff && ticket && (plate || plateOpt) && dest && usesPriceList()) {
          const it = rowPriceItem(i);
          const list = priceForItem(it, carType);
          if (it && list) {
            priceFields = { priceId: it.id, priceLabel: it.label, listPrice: list, priceZone: it.zone, priceSet: activePriceSet };
            const di = discountInfo({ role: loggedInUser.role, listPrice: list, totalFare, priceZone: it.zone, paymentMethod: pay, source });
            if (di && di.over) overDiscountRows.push(`Dòng ${i+1}: ${discountText(di)}`);
          }
        }

        if (rawStaff && ticket && (plate || plateOpt) && dest) {
          const cleanTicket = ticket.trim().toUpperCase();
          const cleanPlate = plate.trim().toUpperCase();

          // 1. Kiểm tra trùng ngay trong nội bộ các dòng đang nhập hàng loạt
          const isDuplicateInBatch = batchEntriesToCheck.some(item => 
            item.ticket === cleanTicket && item.plate === cleanPlate && item.date === formattedDate
          );

          // 2. Kiểm tra trùng với lịch sử đã lưu trước đó trên Cloud của tài khoản này
          const isDuplicateInCloud = dupPool.some(t => {
            const existingTicket = (t.originalTicket || t.ticketNumber || '').trim().toUpperCase();
            const existingPlate = (t.plateNumber || '').trim().toUpperCase();
            const existingDate = normalizeDateInput(t.dateStr);
            return existingTicket === cleanTicket && existingPlate === cleanPlate && existingDate === formattedDate;
          });

          if (isDuplicateInBatch || isDuplicateInCloud) {
            duplicateDetails.push(`Dòng ${i+1} (Phiếu: ${ticket} - Biển số: ${plate})`);
            continue;
          }

          // Đưa vào mảng kiểm tra nội bộ tiếp theo
          batchEntriesToCheck.push({ ticket: cleanTicket, plate: cleanPlate, date: formattedDate });
          savedDests.push(dest);

          const baseTimestamp = Date.now() + i;

          const staffNames = rawStaff.split(/[+,]+/).map(s => s.trim()).filter(Boolean);
          const splitCount = staffNames.length > 1 ? staffNames.length : 1;
          const splitFare = Math.round(totalFare / splitCount);

          staffNames.forEach((staffName, sIdx) => {
            const subId = 'X' + baseTimestamp + '_' + sIdx;
            const subTicket = splitCount > 1 ? `${ticket}-${sIdx + 1}/${splitCount}` : ticket;

            const tripData = {
              id: subId, dateStr: formattedDate, timeStr, ticketNumber: subTicket, originalTicket: ticket, plateNumber: plate,
              carType, source, pickup, destination: dest, totalFare: splitFare, originalTotalFare: totalFare, paymentMethod: pay,
              note: note, staff: staffName, role: loggedInUser.role, createdBy: loggedInUser.user, timestamp: baseTimestamp + sIdx,
              dateKey: tripDateKey({ dateStr: formattedDate })
            };
            Object.assign(tripData, priceFields);

            updates[`users_trips/${loggedInUser.user}/${subId}`] = tripData;
            updates[`trips/${subId}`] = tripData;
          });
          count++;
        }
      }

      if (invalidDateRows.length > 0) {
        alert(`Ngày tháng không đúng dạng ngày/tháng/năm (vd 07/11/2026) ở: ${invalidDateRows.join(', ')}.\nCác dòng này CHƯA được lưu, vui lòng sửa lại ngày.`);
      }

      if (duplicateDetails.length > 0) {
        showFloatingWarning(`Đã chặn ${duplicateDetails.length} đơn trùng lặp (trùng trong danh sách nhập hoặc đã có trên Cloud): ${duplicateDetails.join(', ')}`);
      }

      if (count > 0) {
        dbRoot().update(updates).then(() => {
          recordPlaces(savedDests);
          logTrips('create', Object.keys(updates).filter(k => k.startsWith('trips/')).map(k => updates[k]), () => 'Nhập đơn mới');
          alert(`Đã lưu thành công và phân tách hoa hồng cho ${count} đơn!` + (overDiscountRows.length && !SILENT_DISCOUNT_WATCH ? `\n\n⚠️ Có ${overDiscountRows.length} đơn GIẢM GIÁ VƯỢT MỨC cho phép (${pctText(DISCOUNT_LIMIT.noi)} nội thành, ${pctText(DISCOUNT_LIMIT.ngoai)} ngoại thành) — Quản lý sẽ kiểm tra:\n${overDiscountRows.join('\n')}` : ''));
          renderBatchRows(role);
          const histInput = document.getElementById('filter-history-date');
          if (histInput && lastFormattedDate) {
            const parts = formatDateForInput(lastFormattedDate);
            if (parts) histInput.value = parts;
            renderActiveWorksheetTrips(role);
          }
        }).catch(err => {
          alert("Lỗi lưu dữ liệu: " + err.message);
        });
      } else if (duplicateDetails.length === 0 && invalidDateRows.length === 0) {
        alert("Vui lòng điền đầy đủ Tên Nhân Sự, Số Phiếu, Biển Số và Điểm Đến!");
      }
    }

      const p = dateStr.split('/');
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return '';

    // Hình thức thanh toán Team Kế Hoạch ('plan', settings/planPayments) và Team Kế Hoạch 2 ('plan2', settings/plan2Payments)
    function planPayCfg(role) {
      return role === 'plan2'
        ? { key: 'plan2Payments', get: () => plan2PaymentOptions, pre: 'plan2payment', tag: 'bg-pink-50 text-pink-900 border-pink-200' }
        : { key: 'planPayments', get: () => planPaymentOptions, pre: 'planpayment', tag: 'bg-purple-50 text-purple-900 border-purple-200' };
    }
    function renderPlanPaymentsTable(role) {
      if (role === undefined) renderPlanPaymentsTable('plan2');
      const c = planPayCfg(role);
      const container = document.getElementById(`${c.pre}-tag-list`);
      if (!container) return;
      container.innerHTML = c.get().map((pt, idx) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-xs border ${c.tag}">
          💳 ${escHtml(pt)}
          <button onclick="deletePlanPayment(${idx}, '${role === 'plan2' ? 'plan2' : 'plan'}')" class="text-rose-500 hover:text-rose-700 font-extrabold ml-1">×</button>
        </span>
      `).join('');
    }

    function addNewPlanPayment(role) {
      const c = planPayCfg(role), list = c.get();
      const input = document.getElementById(`new-${c.pre}-name`);
      const val = input ? input.value.trim() : '';
      if (!val) { alert("Vui lòng nhập hình thức thanh toán!"); return; }
      if (list.includes(val)) { alert("Hình thức này đã tồn tại!"); return; }
      list.push(val);
      dbRef('settings/' + c.key).set(list).then(() => { input.value = ''; renderPlanPaymentsTable(role); });
    }

    function addBulkPlanPayment(role) {
      const c = planPayCfg(role), list = c.get();
      const textarea = document.getElementById(`bulk-${c.pre}-text`);
      const raw = textarea ? textarea.value.trim() : '';
      if (!raw) { alert("Vui lòng dán danh sách vào ô!"); return; }
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      let added = 0;
      lines.forEach(pt => {
        if (!list.includes(pt)) { list.push(pt); added++; }
      });
      dbRef('settings/' + c.key).set(list).then(() => {
        textarea.value = '';
        renderPlanPaymentsTable(role);
        alert(`Đã thêm thành công ${added} hình thức mới!`);
      });
    }

    function deletePlanPayment(idx, role) {
      const c = planPayCfg(role), list = c.get();
      if (list.length <= 1) { alert("Cần giữ lại ít nhất 1 hình thức thanh toán!"); return; }
      if (confirm(`Bạn có chắc muốn xóa hình thức "${list[idx]}" không?`)) {
        list.splice(idx, 1);
        dbRef('settings/' + c.key).set(list).then(() => { renderPlanPaymentsTable(role); });
      }
    }

    function updateManagerRevenueSummary() {
      const revContainer = document.getElementById('revenue-cards-container');
      if (!revContainer) return;
      refreshManagerWindow();
      const revDateInp = document.getElementById('revenue-date-picker');
      const dayKey = revDateInp && revDateInp.value ? revDateInp.value : '';
      const dayTrips = allCompanyTrips.filter(t => !dayKey || tripDateKey(t) === dayKey);
      // Doanh thu = đơn của Bán vé + Kế hoạch. Đơn Chủ xe chỉ để đối chiếu, KHÔNG cộng vào (tránh tính 2 lần)
      const posTrips = dayTrips.filter(t => t.role !== 'driver');
      const drvTrips = dayTrips.filter(t => t.role === 'driver');
      const sum = arr => arr.reduce((acc, t) => acc + (Number(t.totalFare) || 0), 0);
      const totalSum = sum(posTrips);

      const methodSums = {};
      posTrips.forEach(t => {
        const m = t.paymentMethod || '(Chưa ghi)';
        methodSums[m] = (methodSums[m] || 0) + (Number(t.totalFare) || 0);
      });
      const order = [...paymentOptions, ...[...planPaymentOptions, ...plan2PaymentOptions].filter((p, i, a) => !paymentOptions.includes(p) && a.indexOf(p) === i)];
      const methods = [...order.filter(m => methodSums[m] !== undefined || paymentOptions.includes(m)), ...Object.keys(methodSums).filter(m => !order.includes(m))];

      let cardsHtml = `
        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl shadow-sm sm:col-span-1">
          <div class="text-[10px] font-bold uppercase text-emerald-600">Tổng Doanh Thu Ngày (Bán Vé + Kế Hoạch)</div>
          <div class="text-lg sm:text-xl font-extrabold text-emerald-800 mt-1">${totalSum.toLocaleString('vi-VN')} ₫</div>
          <div class="text-[11px] text-slate-500 mt-0.5">${billCountText(posTrips)} bán • Chủ xe báo: ${countBills(drvTrips)} đơn / ${sum(drvTrips).toLocaleString('vi-VN')} ₫</div>
        </div>
      `;
      const colors = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-indigo-50 border-indigo-200 text-indigo-800', 'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800', 'bg-rose-50 border-rose-200 text-rose-800', 'bg-teal-50 border-teal-200 text-teal-800'];
      methods.forEach((opt, idx) => {
        cardsHtml += `
          <div class="${colors[idx % colors.length]} border p-3.5 rounded-2xl shadow-sm">
            <div class="text-[10px] font-bold uppercase opacity-80">${escHtml(opt)}</div>
            <div class="text-base font-extrabold mt-1">${(methodSums[opt] || 0).toLocaleString('vi-VN')} ₫</div>
          </div>
        `;
      });
      revContainer.innerHTML = cardsHtml;
    }

    // Xác nhận xóa đơn bằng chính mật khẩu của quản lý đang đăng nhập
    function verifyAndDelete(callback) {
      closeLoginModals();
      const body = `
        <p class="text-xs text-slate-500 text-center">Nhập mật khẩu tài khoản quản lý của bạn để xóa:</p>
        <input type="password" id="custom-pwd-input" autocomplete="current-password" placeholder="Mật khẩu..." class="${inputCls} text-center" onkeydown="if(event.key==='Enter') submitCustomPwd()">`;
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('custom-pwd-modal', 'bg-rose-600', '🔒', 'Xác Nhận Xóa Đơn Hàng', body, 'Xác Nhận Xóa', 'submitCustomPwd()', 'bg-rose-600 hover:bg-rose-700'));
      setTimeout(() => { const inp = document.getElementById('custom-pwd-input'); if (inp) inp.focus(); }, 100);

      window.submitCustomPwd = async function() {
        const inp = document.getElementById('custom-pwd-input');
        const val = inp ? inp.value.trim() : '';
        if (!val) { setModalBusy('custom-pwd-modal', false, 'Vui lòng nhập mật khẩu!'); return; }
        setModalBusy('custom-pwd-modal', true, 'Đang kiểm tra...');
        try {
          const cu = fbAuth.currentUser;
          await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, authPassword(val)));
          closeLoginModals();
          callback();
        } catch (e) {
          setModalBusy('custom-pwd-modal', false, (e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials')) ? 'Mật khẩu không chính xác! Hủy thao tác xóa.' : authErrorText(e));
        }
      };
    }

    function deleteSelectedManagerTrips() {
      const checkboxes = document.querySelectorAll('.manager-trip-checkbox:checked');
      if (checkboxes.length === 0) { alert("Vui lòng tích chọn ít nhất một đơn hàng để xóa!"); return; }

      verifyAndDelete(() => {
        let deletedList = [];
        checkboxes.forEach(cb => {
          const trip = allCompanyTrips.find(x => x.id === cb.value);
          if (trip) deletedList.push(trip);
        });

        deleteTripsSafe(deletedList).then(() => {

    function adminDeleteTrip(id, createdBy) {
      verifyAndDelete(() => {

    // Số phiếu gốc dùng để ghép cặp: bỏ đuôi tách nhân sự "-1/2" (hoặc "-1-2" do bản cũ đổi dấu)
    function baseTicketOf(ticket) {
      return String(ticket || '').trim().replace(/-\d+[\/-]\d+$/, '');
    }

    // Sửa nhanh 1 ô: chỉ lưu khi giá trị thật sự thay đổi, và chỉ ghi đúng ô đó (không ghi đè cả đơn)
    function updateInlineTripField(tripId, field, value) {
      const trip = allCompanyTrips.find(x => x.id === tripId);
      if (!trip) return;
      if (field === 'totalFare') value = parseFloat(String(value).replace(/[^0-9]/g, '')) || 0;
      else if (field === 'plateNumber') value = String(value).trim().toUpperCase();
      else if (field === 'dateStr') {
        // Sửa ngày (10/11): tự sửa dạng gõ thiếu (vd 9/11 -> 09/11/2026), ngày sai thì chặn
        const raw = String(value).trim();
        value = normalizeDateInput(/^\d{1,2}\/\d{1,2}$/.test(raw) ? `${raw}/${new Date().getFullYear()}` : raw);   // "1/11" -> 01/11/năm nay
        if (!raw || !isValidDateStr(value)) {
          alert(`Ngày "${raw}" không đúng dạng ngày/tháng/năm (vd 09/11/2026).`);
          updateManagerAuditTable();
          return;
        }
      }
      else value = String(value).trim();
      const oldVal = field === 'totalFare' ? Number(trip[field] || 0) : String(trip[field] == null ? '' : trip[field]);
      if (value === oldVal) return;
      if ((field === 'ticketNumber' || (field === 'plateNumber' && !plateOptional(trip.role))) && !value) {
        alert('Số phiếu và biển số không được để trống!');
        updateManagerAuditTable();
        return;
      }
      const changes = { [field]: value };
      if (field === 'ticketNumber') changes.originalTicket = baseTicketOf(value);
      if (field === 'dateStr') changes.dateKey = tripDateKey({ dateStr: value });
      const updates = {};
      Object.keys(changes).forEach(k => {
        updates[`trips/${tripId}/${k}`] = changes[k];
        if (trip.createdBy) updates[`users_trips/${trip.createdBy}/${tripId}/${k}`] = changes[k];
      });
      const before = Object.assign({}, trip);
      Object.assign(trip, changes);
      dbRoot().update(updates).then(() => {
        logTrips('edit', [trip], () => changeText(before, changes) || `${field}: ${oldVal} → ${value}`);
        updateManagerRevenueSummary();
        if (field === 'dateStr') updateManagerAuditTable();   // đổi ngày -> nhóm đối soát thay đổi
      }).catch(err => {
        alert("Lỗi cập nhật: " + err.message);
      });
    }

    // Nút "Sửa ngày theo bên bán" (nhóm Khớp – Lệch ngày): đổi ngày các đơn TÀI XẾ trong nhóm về ngày bên bán ghi
    function fixDateOffGroup(idsCsv, sellDateKey) {
      const trips = String(idsCsv || '').split(',').map(id => allCompanyTrips.find(x => x.id === id)).filter(Boolean);
      if (!trips.length || !sellDateKey) return;
      const newStr = fmtDateKeyVN(sellDateKey);
      if (!confirm(`Đổi ngày ${trips.length} đơn của tài xế (${[...new Set(trips.map(t => t.staff || t.createdBy))].join(', ')}) từ ${trips[0].dateStr} thành ${newStr}?`)) return;
      const updates = {};
      trips.forEach(t => {
        updates[`trips/${t.id}/dateStr`] = newStr;
        updates[`trips/${t.id}/dateKey`] = sellDateKey;
        if (t.createdBy) {
          updates[`users_trips/${t.createdBy}/${t.id}/dateStr`] = newStr;
          updates[`users_trips/${t.createdBy}/${t.id}/dateKey`] = sellDateKey;
        }
      });
      dbRoot().update(updates).then(() => {
        logTrips('edit', trips, t => `Sửa ngày theo bên bán: ${t.dateStr} → ${newStr}`);
        trips.forEach(t => { t.dateStr = newStr; t.dateKey = sellDateKey; });
        updateManagerAuditTable();
        updateManagerRevenueSummary();
      }).catch(err => alert('Lỗi cập nhật: ' + err.message));
    }

    // ===== ĐỐI SOÁT: một hàm dùng chung cho màn hình và file Excel (để 2 nơi luôn ra cùng kết quả) =====
    const AUDIT_STATUS = {
      match: { label: '🟢 Trùng Khớp', text: 'Trùng Khớp' },
      dateoff: { label: '🔵 Khớp – Lệch Ngày', text: 'Khớp – Lệch ngày' },
      mismatch: { label: '🔴 Đơn Lệch', text: 'Đơn Lệch' },
      unmatched: { label: '⏳ Đơn Chưa Khớp (Thiếu 1 bên)', text: 'Chưa Khớp (Thiếu 1 bên)' }
    };
    const PARTNER_KEYWORDS = ['kế hoạch', 'sq', 'g1', 'vto', 'công nợ', 'sanna', 'stella', 'jovia', 'vdt', 'monica', 'november', 'thanhlong', 'fast track'];

    // "2026-11-10" + n ngày -> "2026-11-11" (tính theo lịch, không lệch múi giờ)
    function shiftDateKey(k, n) {
      const p = String(k || '').split('-').map(Number);
      if (p.length !== 3 || !p[0]) return k;
      const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
      return d.toISOString().slice(0, 10);
    }
    // Lệch ngày (11/11): "Bán vé ghi 10/11, Tài xế ghi 11/11"
    function dateOffText(g) {
      if (!g || !g.dateOff) return '';
      return `Lệch ngày: ${g.dateOff.sellLabel} ghi ${ddmm(g.dateOff.sell)}, Tài xế ghi ${ddmm(g.dateOff.drv)}`;
    }
    function tripDateKey(t) {
      // dd/mm/yyyy -> yyyy-mm-dd (để so sánh / sắp xếp); '' nếu ngày không hợp lệ
      const p = normalizeDateInput(t.dateStr).split('/');
      return (p.length === 3 && p[2].length === 4) ? `${p[2]}-${p[1]}-${p[0]}` : '';
    }

    // Hạn báo cáo của đơn ngày D = ngày D+1 lúc lockHourSetting giờ (giống giờ khóa đơn)
    function reportDeadline(dateKey) {
      if (!dateKey) return null;
      const p = dateKey.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2] + 1, lockHourSetting, 0, 0);
    }
    // Thông tin chi tiết: bên nào còn thiếu, đã quá hạn chưa
    function auditDetail(trips, status, dateKey) {
      if (status !== 'unmatched') return { missing: null, overdue: false };
      const hasPos = trips.some(t => isSellRole(t.role));
      const missing = hasPos ? 'driver' : 'pos';
      const dl = reportDeadline(dateKey);
      return { missing, overdue: !!(dl && Date.now() >= dl.getTime()) };
    }
    function auditStatusText(g) {
      if (g.status === 'mismatch') return `Đơn Lệch (${[getMismatchReason(g.trips), dateOffText(g)].filter(Boolean).join('; ')})`;
      if (g.status === 'dateoff') return `Khớp – ${dateOffText(g)}`;
      if (g.status !== 'unmatched') return AUDIT_STATUS[g.status].text;
      const who = g.missing === 'driver' ? 'Tài xế' : 'Bán vé/KH';
      return g.overdue ? `Quá hạn: ${who} chưa báo` : `Chờ ${who} báo`;
    }

    // "50E-123.27", "50e 12327" -> "50E12327" (để 2 bên gõ khác kiểu vẫn ghép được)
    function normalizePlate(p) { return String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    // Quy đổi hình thức thanh toán về 1 nhóm để so 2 bên:
    //  FREE = Free nội bộ (khớp với mọi hình thức), NVQ = Nhân viên quầy thu, THE = Thẻ, TXT = Tài xế thu, KH = Kế hoạch / Công nợ / đối tác.
    //  Đơn của Team Kế Hoạch luôn là KH. Đơn cũ không ghi thanh toán -> lấy theo nguồn đơn (đối tác = KH), nếu không thì là "chưa ghi".
    function paymentCategory(t) {
      if (isPlanRole(t.role)) return 'KH';
      const raw = String(t.paymentMethod || '').trim().toLowerCase();
      if (!raw) {
        const src = String(t.source || '').toLowerCase();
        return PARTNER_KEYWORDS.some(k => src.includes(k)) ? 'KH' : 'CHUA_GHI';
      }
      if (/free|miễn phí|mien phi/.test(raw)) return 'FREE';
      if (/nhân viên quầy|^nvq/.test(raw)) return 'NVQ';
      if (/^thẻ|^the\b|quẹt|card|pos/.test(raw)) return 'THE';
      if (/tài xế thu|^txt\b/.test(raw)) return 'TXT';
      if (/kế hoạch|công nợ|chuyển khoản/.test(raw) || PARTNER_KEYWORDS.some(k => raw.includes(k))) return 'KH';
      return raw;
    }
    const PAY_CAT_LABEL = { FREE: 'Free Nội Bộ', NVQ: 'Nhân Viên Quầy Thu', THE: 'Thẻ', TXT: 'Tài Xế Thu', KH: 'Kế Hoạch', CHUA_GHI: '(chưa ghi)' };

    // Trả về '' nếu khớp, ngược lại là lý do lệch (để hiện cho người xem)
    function getMismatchReason(group) {
      const posTrips = group.filter(x => isSellRole(x.role));
      const driverTrips = group.filter(x => x.role === 'driver');
      const sumPos = posTrips.reduce((acc, x) => acc + Number(x.totalFare || 0), 0);
      const sumDriver = driverTrips.reduce((acc, x) => acc + Number(x.totalFare || 0), 0);
      const reasons = [];
      if (Math.abs(sumPos - sumDriver) >= 1000) reasons.push(`Lệch tiền ${Math.abs(sumPos - sumDriver).toLocaleString('vi-VN')} ₫`);
      const catsPos = [...new Set(posTrips.map(paymentCategory))];
      const catsDrv = [...new Set(driverTrips.map(paymentCategory))];
      // "Free nội bộ" ở bất kỳ bên nào: khớp với mọi hình thức thanh toán (vẫn so tiền)
      const hasFree = catsPos.includes('FREE') || catsDrv.includes('FREE');
      // Nhưng đã chọn Free thì tiền phải là 0đ
      const freeWithMoney = group.filter(t => paymentCategory(t) === 'FREE' && Number(t.totalFare || 0) > 0);
      if (freeWithMoney.length) {
        const who = [...new Set(freeWithMoney.map(t => t.role === 'driver' ? 'Tài xế' : (t.role === 'plan2' ? 'Kế hoạch 2' : (t.role === 'plan' ? 'Kế hoạch' : 'Bán vé'))))].join(', ');
        reasons.push(`${who} chọn Free nhưng có nhập tiền`);
      }
      if (!hasFree && !(catsPos.length === 1 && catsDrv.length === 1 && catsPos[0] === catsDrv[0])) {
        const lb = trips => [...new Set(trips.map(t => isPlanRole(t.role) && !t.paymentMethod ? 'Kế Hoạch' : (t.paymentMethod || '(chưa ghi)')))].join('/');
        reasons.push(`Khác thanh toán: ${lb(posTrips)} ≠ ${lb(driverTrips)}`);
      }
      return reasons.join('; ');
    }

    function getAuditStatus(group) {
      const hasPos = group.some(x => isSellRole(x.role));
      const hasDrv = group.some(x => x.role === 'driver');
      if (!hasPos || !hasDrv) return 'unmatched';
      return getMismatchReason(group) ? 'mismatch' : 'match';
    }

    function getAuditFilters() {
      const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      return {
        startDateVal: val('audit-start-date') || '',
        endDateVal: val('audit-end-date') || '',
        roleFilter: val('audit-role-filter') || 'all',
        matchStatusFilter: val('audit-match-status-filter') || 'all',
        keyword: (val('audit-search-input') || '').trim().toLowerCase()
      };
    }

    // Trả về danh sách nhóm [{trips, status, dateKey}] đã lọc theo bộ lọc trên màn hình
    function computeAuditGroups(f) {
      const pairMap = {}, noPlate = [];
      // Lấy thêm 1 ngày trước/sau khoảng đang xem để ghép đơn tài xế ghi lệch ngày; nhóm nằm hẳn ngoài khoảng sẽ bị bỏ ở cuối
      const inRange = t => {
        const k = tripDateKey(t);
        if (!k) return true;
        if (f.startDateVal && k < f.startDateVal) return false;
        if (f.endDateVal && k > f.endDateVal) return false;
        return true;
      };
      const exFrom = f.startDateVal ? shiftDateKey(f.startDateVal, -1) : '', exTo = f.endDateVal ? shiftDateKey(f.endDateVal, 1) : '';
      allCompanyTrips.forEach(t => {
        if (f.roleFilter !== 'all' && t.role !== f.roleFilter) return;
        if (exFrom || exTo) {
          const k = tripDateKey(t);
          if (k) {
            if (exFrom && k < exFrom) return;
            if (exTo && k > exTo) return;
          }
        }
        const ticketKey = (t.originalTicket || baseTicketOf(t.ticketNumber)).replace(/\s+/g, '').toUpperCase();
        const plate = normalizePlate(t.plateNumber);
        if (ticketKey && plate) {
          const baseTicket = ticketKey;
          // Gom chung một nhóm theo Số phiếu + Biển số + Ngày
          const key = `${baseTicket}_${plate}_${normalizeDateInput(t.dateStr)}`;
          if (!pairMap[key]) pairMap[key] = [];
          pairMap[key].push(t);
        } else if (ticketKey) {
          noPlate.push({ t, ticketKey });   // vd đơn Team Kế hoạch không ghi biển số -> ghép sau theo Số phiếu + Ngày
        } else {
          pairMap['single_' + t.id] = [t];
        }
      });
      noPlate.forEach(({ t, ticketKey }) => {
        const d = normalizeDateInput(t.dateStr);
        const hits = Object.keys(pairMap).filter(k => !k.startsWith('single_') && k.startsWith(ticketKey + '_') && k.endsWith('_' + d) && k.split('_').length === 3);
        const key = hits.length === 1 ? hits[0] : `${ticketKey}__${d}`;
        (pairMap[key] = pairMap[key] || []).push(t);
      });

      // GHÉP LỆCH NGÀY (11/11): số phiếu không bao giờ trùng -> nhóm chỉ có bên Bán vé/KH và nhóm chỉ có bên Tài xế,
      // cùng số phiếu + biển số (hoặc bên bán không ghi biển số), ngày cách nhau đúng 1 ngày, và chỉ có đúng 1 cặp như vậy -> ghép lại.
      // KHÔNG sửa dữ liệu; quản lý bấm nút "Sửa ngày theo bên bán" nếu muốn sửa.
      const isSell = t => isSellRole(t.role);
      const entries = Object.entries(pairMap).filter(([k]) => !k.startsWith('single_')).map(([k, trips]) => {
        const sides = new Set(trips.map(t => isSell(t) ? 'S' : 'D'));
        const dk = tripDateKey(trips[0]);
        if (sides.size !== 1 || !dk) return null;
        const t0 = trips[0];
        return { k, side: [...sides][0], dk,
          ticket: (t0.originalTicket || baseTicketOf(t0.ticketNumber)).replace(/\s+/g, '').toUpperCase(),
          plate: normalizePlate(t0.plateNumber) };
      }).filter(Boolean);
      const sells = entries.filter(e => e.side === 'S'), drvs = entries.filter(e => e.side === 'D');
      const near = (a, b) => b.dk === shiftDateKey(a.dk, 1) || b.dk === shiftDateKey(a.dk, -1);
      const cand = new Map();
      sells.forEach(sg => {
        const hits = drvs.filter(dg => dg.ticket === sg.ticket && (!sg.plate || dg.plate === sg.plate) && near(sg, dg));
        if (hits.length === 1) cand.set(sg.k, hits[0]);
      });
      const usedDrv = {};
      cand.forEach(dg => { usedDrv[dg.k] = (usedDrv[dg.k] || 0) + 1; });
      const dateOffOf = {};
      cand.forEach((dg, sk) => {
        if (usedDrv[dg.k] !== 1) return;   // 1 nhóm tài xế khớp nhiều nhóm bán -> không chắc, để nguyên
        const sg = sells.find(e => e.k === sk);
        const sellTrips = pairMap[sk];
        pairMap[sk] = sellTrips.concat(pairMap[dg.k]);
        delete pairMap[dg.k];
        dateOffOf[sk] = { sell: sg.dk, drv: dg.dk, sellLabel: sellTrips.some(t => t.role === 'pos') ? 'Bán vé' : (sellTrips.some(t => t.role === 'plan2') ? 'Kế hoạch 2' : 'Kế hoạch') };
      });

      const defaultPay = paymentOptions[0] || 'Nhân Viên Quầy Thu';
      const groups = [];
      Object.entries(pairMap).forEach(([gKey, trips]) => {
        // Nhóm chỉ thuộc ngày lấy thêm -> bỏ. Nhóm lệch ngày tính theo NGÀY BÊN BÁN (để xuất Excel/MISA từng ngày không bị trùng doanh thu)
        if ((f.startDateVal || f.endDateVal) && (dateOffOf[gKey] ? !inRange(trips.find(isSell)) : !trips.some(inRange))) return;
        trips.sort((a, b) => (isSellRole(a.role) ? 0 : 1) - (isSellRole(b.role) ? 0 : 1) || (a.timestamp || 0) - (b.timestamp || 0));
        const dateOff = dateOffOf[gKey] || null;
        let status = getAuditStatus(trips);
        if (dateOff && status === 'match') status = 'dateoff';
        const dateKey = tripDateKey(trips[0]);
        const det = auditDetail(trips, status, dateKey);
        const sf = f.matchStatusFilter;
        if (sf === 'overdiscount') {
          if (!trips.some(t => { const d = discountInfo(t); return d && d.over; })) return;
        } else if (sf.startsWith('overdue')) {
          if (!det.overdue) return;
          if (sf === 'overdue_driver' && det.missing !== 'driver') return;
          if (sf === 'overdue_pos' && det.missing !== 'pos') return;
        } else if (sf === 'dateoff') {
          if (!dateOff) return;
        } else if (sf !== 'all' && status !== sf) return;
        const kw = f.keyword;
        if (kw) {
          let pass;
          if (kw === 'khớp' || kw === 'trùng khớp') pass = status === 'match' || status === 'dateoff';
          else if (kw === 'lệch ngày' || kw === 'sai ngày') pass = !!dateOff;
          else if (kw === 'lệch' || kw === 'đơn lệch') pass = status === 'mismatch';
          else if (kw === 'chưa khớp' || kw === 'đơn lẻ' || kw === 'thiếu') pass = status === 'unmatched';
          else if (kw === 'chưa báo' || kw === 'quá hạn') pass = det.overdue;
          else if (kw === 'giảm giá' || kw === 'vượt mức') pass = trips.some(t => { const d = discountInfo(t); return d && d.over; });
          else pass = trips.some(t => `${t.dateStr} ${t.timeStr} ${t.role} ${t.staff} ${t.ticketNumber} ${t.plateNumber} ${t.carType || ''} ${t.source || ''} ${t.destination} ${t.paymentMethod || defaultPay} ${t.note || ''} ${t.totalFare}`.toLowerCase().includes(kw));
          if (!pass) return;
        }
        groups.push({ trips, status, dateKey, dateOff, missing: det.missing, overdue: det.overdue, ts: Math.min(...trips.map(t => t.timestamp || 0)) });
      });
      return groups;
    }

    // Ghi chú dưới ô Tổng Tiền: giá bảng & mức giảm (đỏ nếu vượt mức)
    function priceNoteHtml(t) {
      const d = discountInfo(t);
      if (!d) return '';
      const title = escHtml(d.label || t.priceLabel || '');
      if (d.over) return `<div class="mt-1 px-1.5 py-0.5 bg-rose-600 text-white rounded text-[10px] font-extrabold leading-tight" title="${title}">💸 ${escHtml(discountText(d))}</div>`;
      return `<div class="mt-1 text-[10px] ${d.pct > 0 ? 'text-amber-700' : 'text-slate-400'} leading-tight" title="${title}">${escHtml(discountText(d))}</div>`;
    }

    function updateManagerAuditTable() {
      const tb = document.getElementById('tbody-mgr');
      if (!tb) return;
      refreshManagerWindow();
      if (allCompanyTrips.length === 0) {
        tb.innerHTML = `<tr><td colspan="15" class="p-4 text-center text-slate-400">Chưa có dữ liệu đơn hàng.</td></tr>`;
        return;
      }
      renderReminderBox();
      const groupList = computeAuditGroups(getAuditFilters());
      if (groupList.length === 0) {
        tb.innerHTML = `<tr><td colspan="15" class="p-4 text-center text-slate-400">Không tìm thấy dữ liệu đối soát phù hợp.</td></tr>`;
        return;
      }
      // Màn hình: ngày mới nhất lên trên
      groupList.sort((a, b) => (b.dateKey || '').localeCompare(a.dateKey || '') || b.ts - a.ts);

      const statusBadge = {
        unmatched: '<span class="px-2 py-1 bg-amber-100 text-amber-800 font-bold rounded-lg text-[10px]">⏳ Đơn Chưa Khớp (Thiếu 1 bên)</span>',
        match: '<span class="px-2 py-1 bg-emerald-100 text-emerald-800 font-extrabold rounded-lg text-[10px]">🟢 Trùng Khớp</span>',
        dateoff: '<span class="px-2 py-1 bg-blue-600 text-white font-extrabold rounded-lg text-[10px] inline-block">🔵 Khớp – Lệch Ngày</span>',
        mismatch: '<span class="px-2 py-1 bg-rose-100 text-rose-800 font-extrabold rounded-lg animate-pulse text-[10px]">🔴 Đơn Lệch</span>'
      };

      let rowsHtml = '';
      groupList.forEach(g => {
        const group = g.trips, status = g.status;
        let statusHtml = statusBadge[status];
        if (status === 'mismatch') statusHtml += `<div class="text-[10px] font-bold text-rose-700 mt-1">${escHtml(getMismatchReason(group))}</div>`;
        if (g.dateOff) {
          const drvIds = group.filter(t => t.role === 'driver').map(t => t.id).join(',');
          statusHtml += `<div class="text-[10px] font-bold text-blue-800 mt-1">${escHtml(dateOffText(g))}</div>` +
            `<button onclick="fixDateOffGroup('${drvIds}', '${g.dateOff.sell}')" class="mt-1 px-2 py-1 bg-blue-50 hover:bg-blue-100 border border-blue-300 text-blue-700 font-extrabold rounded-lg text-[10px]">📅 Sửa ngày theo ${escHtml(g.dateOff.sellLabel.toLowerCase())}</button>`;
        }
        if (status === 'unmatched') {
          statusHtml = g.overdue
            ? `<span class="px-2 py-1 bg-orange-600 text-white font-extrabold rounded-lg text-[10px] inline-block">⏰ Quá hạn: ${g.missing === 'driver' ? '🚗 Tài xế' : '🚖 Bán vé/KH'} chưa báo</span>`
            : `<span class="px-2 py-1 bg-amber-100 text-amber-800 font-bold rounded-lg text-[10px] inline-block">⏳ Chờ ${g.missing === 'driver' ? 'Tài xế' : 'Bán vé/KH'} báo</span>`;
        }
        group.forEach((t, idx) => {
          const isPos = t.role === 'pos';
          const isPlan = isPlanRole(t.role);
          const roleBadge = t.role === 'plan2'
            ? `<span class="px-2 py-0.5 bg-pink-100 text-pink-800 rounded-md font-extrabold text-[10px]">📋 Kế Hoạch 2</span>`
            : isPlan
            ? `<span class="px-2 py-0.5 bg-purple-100 text-purple-800 rounded-md font-extrabold text-[10px]">📋 Kế Hoạch</span>`
            : (isPos 
              ? `<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-md font-extrabold text-[10px]">🚖 Bán Vé</span>` 
              : `<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-md font-extrabold text-[10px]">🚗 Tài Xế</span>`);
          
          const rowBg = t.role === 'plan2' ? 'bg-pink-50/30' : isPlan ? 'bg-purple-50/30' : (isPos ? 'bg-blue-50/30' : 'bg-amber-50/30');

          const checkboxHtml = `<input type="checkbox" class="manager-trip-checkbox" value="${t.id}">`;
          const deleteBtn = `<button onclick="adminDeleteTrip('${t.id}', '${escHtml(t.createdBy)}')" class="px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-md text-[10px]">🗑️ Xóa</button>`;
          const auditCell = (idx === 0) ? `<td class="p-3 text-center align-middle" rowspan="${group.length}">${statusHtml}</td>` : '';
          const borderClass = (idx === group.length - 1) ? 'border-b-2 border-slate-300' : 'border-b';

          const basePayList = payListFor(t.role);
          const currentPaymentsList = (t.paymentMethod && !basePayList.includes(t.paymentMethod)) ? [t.paymentMethod, ...basePayList] : basePayList;
          const payOptionsHtml = (t.paymentMethod ? '' : `<option value="" selected>⚠️ Chưa ghi</option>`) +
            currentPaymentsList.map(opt => `<option value="${escHtml(opt)}" ${escHtml(t.paymentMethod === opt ? 'selected' : '')}>${escHtml(opt)}</option>`).join('');

          rowsHtml += `
            <tr class="${rowBg} hover:bg-slate-100/80 transition-all ${borderClass}">
              <td class="p-2.5 text-center align-middle">${checkboxHtml}</td>
              <td class="p-2.5"><input type="text" value="${escHtml(t.dateStr || '')}" placeholder="dd/mm/yyyy" class="inline-edit-input w-24" onblur="updateInlineTripField('${t.id}', 'dateStr', this.value)"></td>
              <td class="p-2.5 font-mono font-bold text-slate-600">${escHtml(t.timeStr || '--')}</td>
              <td class="p-2.5">${roleBadge}</td>
              <td class="p-2.5 font-extrabold text-slate-800">${escHtml(t.staff || 'N/A')}</td>
              <td class="p-2.5"><input type="text" value="${escHtml(t.ticketNumber || '')}" class="inline-edit-input w-24 text-blue-600" onblur="updateInlineTripField('${t.id}', 'ticketNumber', this.value)"></td>
              <td class="p-2.5"><input type="text" value="${escHtml(t.plateNumber || '')}" class="inline-edit-input w-28 uppercase" onblur="updateInlineTripField('${t.id}', 'plateNumber', this.value)"></td>
              ${auditCell}
              <td class="p-2.5">
                <select class="inline-edit-input w-28" onchange="updateInlineTripField('${t.id}', 'carType', this.value)">
                  ${carTypeOptions.map(ct => `<option value="${escHtml(ct)}" ${escHtml(t.carType === ct ? 'selected' : '')}>${escHtml(ct)}</option>`).join('')}
                </select>
              </td>
              <td class="p-2.5">
                <select class="inline-edit-input w-28" onchange="updateInlineTripField('${t.id}', 'source', this.value)">
                  ${sourceOptions.map(s => `<option value="${escHtml(s)}" ${escHtml(t.source === s ? 'selected' : '')}>${escHtml(s)}</option>`).join('')}
                </select>
              </td>
              <td class="p-2.5"><input type="text" value="${escHtml(t.destination || '')}" class="inline-edit-input w-36" onblur="updateInlineTripField('${t.id}', 'destination', this.value)"></td>
              <td class="p-2.5">
                <select class="inline-edit-input w-32 font-bold" onchange="updateInlineTripField('${t.id}', 'paymentMethod', this.value)">
                  ${payOptionsHtml}
                </select>
              </td>
              <td class="p-2.5"><input type="text" value="${escHtml(t.note || '')}" class="inline-edit-input w-32" onblur="updateInlineTripField('${t.id}', 'note', this.value)"></td>
              <td class="p-2.5 text-right"><input type="text" value="${Number(t.totalFare || 0).toLocaleString('vi-VN')}" class="inline-edit-input w-28 text-right font-extrabold text-emerald-700" onblur="updateInlineTripField('${t.id}', 'totalFare', this.value)">${priceNoteHtml(t)}</td>
              <td class="p-2.5 text-center align-middle">${deleteBtn}</td>
            </tr>
          `;
        });
      });

      tb.innerHTML = rowsHtml;
    }

    // Khung NHẮC BÁO CÁO (bảng riêng): chọn Từ ngày – Đến ngày; liệt kê xe chưa báo, phiếu bán vé chưa nhập, đơn giảm giá vượt mức
    function localDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    let remindFrom = localDateKey(new Date()), remindTo = localDateKey(new Date());
    function setRemindRange(from, to) {
      remindFrom = from || localDateKey(new Date());
      remindTo = to || remindFrom;
      if (remindTo < remindFrom) { const x = remindFrom; remindFrom = remindTo; remindTo = x; }
      refreshManagerWindow();
      renderReminderBox();
    }
    function remindQuick(kind) {
      const d = new Date(), t = localDateKey(d);
      if (kind === 'today') return setRemindRange(t, t);
      if (kind === 'yesterday') { d.setDate(d.getDate() - 1); const y = localDateKey(d); return setRemindRange(y, y); }
      if (kind === '7') { d.setDate(d.getDate() - 6); return setRemindRange(localDateKey(d), t); }
      if (kind === 'month') { return setRemindRange(t.slice(0, 8) + '01', t); }
    }
    function ddmm(k) { return k ? `${k.slice(8, 10)}/${k.slice(5, 7)}` : ''; }
    function renderReminderBox() {
      const box = document.getElementById('overdue-box');
      if (!box) return;
      const one = remindFrom === remindTo;
      const gs = computeAuditGroups({ startDateVal: remindFrom, endDateVal: remindTo, roleFilter: 'all', matchStatusFilter: 'unmatched', keyword: '' });
      const drv = gs.filter(g => g.missing === 'driver'), pos = gs.filter(g => g.missing === 'pos');
      const nLate = gs.filter(g => g.overdue).length;
      const dl = reportDeadline(remindTo);
      const pad = n => String(n).padStart(2, '0');
      const dlTxt = dl ? `${pad(dl.getHours())}:${pad(dl.getMinutes())} ngày ${pad(dl.getDate())}/${pad(dl.getMonth() + 1)}` : '';
      const late = dl && Date.now() >= dl.getTime();
      // Tài xế chưa báo -> theo biển số xe. Bán vé chưa nhập -> theo số phiếu (kèm xe / tài xế đã báo)
      // (11/11) Tài xế chưa báo: mỗi phiếu 1 dòng, xếp liền theo xe; bấm vào -> Bảng Đối Soát lọc đúng phiếu đó
      const byPlate = {};
      drv.forEach(g => { const k = normalizePlate(g.trips[0].plateNumber) || '?'; (byPlate[k] = byPlate[k] || []).push(g); });
      const tk = g => String(g.trips[0].originalTicket || baseTicketOf(g.trips[0].ticketNumber) || '');
      const fare = g => g.trips.reduce((a, t) => a + Number(t.totalFare || 0), 0).toLocaleString('vi-VN') + 'đ';
      const lineCls = 'block w-full text-left bg-white border border-slate-300 hover:border-blue-500 hover:bg-blue-50 rounded-lg px-2 py-1 mb-1 cursor-pointer';
      const jump = g => `onclick="jumpToAuditTicket('${escHtml(tk(g))}')" title="Bấm để xem phiếu này ở Bảng Đối Soát"`;
      const plateChips = Object.values(byPlate)
        .sort((a, b) => b.length - a.length || String(a[0].trips[0].plateNumber || '').localeCompare(String(b[0].trips[0].plateNumber || '')))
        .map(list => {
          list.sort((a, b) => (a.dateKey || '').localeCompare(b.dateKey || '') || tk(a).localeCompare(tk(b)));
          const plate = list[0].trips[0].plateNumber || '';
          const rows = list.map(g => {
            const t = g.trips[0];
            const who = t.role === 'plan2' ? 'kế hoạch 2' : (t.role === 'plan' ? 'kế hoạch' : 'bán vé');
            return `<button type="button" ${jump(g)} class="${lineCls}">🚗 <b>${plate ? 'Xe ' + escHtml(plate) : '(chưa ghi biển số)'} – Phiếu ${escHtml(tk(g))}</b>${one ? '' : ` <span class="text-slate-500">(${ddmm(g.dateKey)})</span>`}`
              + ` <span class="text-slate-600">– ${escHtml(fullStaffName(g.trips))} (${who}) đã nhập${t.destination ? ', đi ' + escHtml(t.destination) : ''}, ${fare(g)}</span></button>`;
          }).join('');
          return list.length > 1 ? `<div class="border-l-4 border-amber-400 pl-1.5 mb-1.5">${rows}</div>` : rows;
        }).join('');
      const posChips = pos.map(g => {
        const t = g.trips[0];
        return `<button type="button" ${jump(g)} class="${lineCls}"><b>Phiếu ${escHtml(t.originalTicket || t.ticketNumber)}</b>${one ? '' : ` <span class="text-slate-500">(${ddmm(g.dateKey)})</span>`} <span class="text-slate-500">– xe ${escHtml(t.plateNumber || '?')}, ${escHtml(t.staff || '')} đã báo, ${fare(g)}</span></button>`;
      }).join('');
      const head = one
        ? (late ? `<span class="px-2 py-0.5 bg-rose-600 text-white rounded-lg">⏰ Đã quá hạn (${dlTxt})</span>` : `<span class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded-lg">Hạn báo cáo: ${dlTxt}</span>`)
        : (nLate ? `<span class="px-2 py-0.5 bg-rose-600 text-white rounded-lg">⏰ ${nLate} phiếu đã quá hạn</span>` : '');
      const ok = drv.length === 0 && pos.length === 0;
      const btn = (k, label) => `<button onclick="remindQuick('${k}')" class="px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 rounded-lg font-bold">${label}</button>`;
      box.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 text-xs font-bold text-slate-700 border-b pb-3">
          <span>Từ:</span>
          <input type="date" value="${remindFrom}" class="px-2 py-1 bg-slate-50 border rounded-lg font-mono font-bold" onchange="setRemindRange(this.value, remindTo)">
          <span>Đến:</span>
          <input type="date" value="${remindTo}" class="px-2 py-1 bg-slate-50 border rounded-lg font-mono font-bold" onchange="setRemindRange(remindFrom, this.value)">
          ${btn('today', 'Hôm nay')} ${btn('yesterday', 'Hôm qua')} ${btn('7', '7 ngày')} ${btn('month', 'Tháng này')}
          ${head}
          <button id="btn-remind-excel" onclick="exportReminderExcel()" class="ml-auto px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold shadow-sm">📥 Xuất Excel Mục Này</button>
        </div>
        <div class="${ok ? 'bg-emerald-50 border-emerald-300' : 'bg-orange-50 border-orange-300'} border-2 rounded-2xl p-3 space-y-2 text-xs">
          ${ok ? `<div class="font-bold text-emerald-700">✅ Tất cả đơn ${one ? 'ngày này' : 'trong khoảng này'} đã đủ 2 bên báo cáo.</div>` : `
          <div class="flex justify-end"><button onclick="showReminderDetail()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold">Xem chi tiết ở Bảng Đối Soát ↓</button></div>
          <div><div class="font-extrabold text-amber-800 mb-1">🚗 Tài xế chưa báo: ${Object.keys(byPlate).length} xe (${drv.length} phiếu)</div>${plateChips || '<span class="text-emerald-700 font-bold">Không có</span>'}</div>
          <div><div class="font-extrabold text-blue-800 mb-1">🚖 Bán vé / Kế hoạch chưa nhập: ${pos.length} phiếu</div>${posChips || '<span class="text-emerald-700 font-bold">Không có</span>'}</div>`}
        </div>
        ${overDiscountHtml(remindFrom, remindTo)}`;
    }
    // Bấm 1 phiếu trong khung nhắc -> Bảng Đối Soát lọc đúng phiếu đó (trong khoảng ngày đang nhắc)
    function jumpToAuditTicket(ticket) {
      const s = document.getElementById('audit-start-date'), e = document.getElementById('audit-end-date');
      if (s) s.value = remindFrom;
      if (e) e.value = remindTo;
      const st = document.getElementById('audit-match-status-filter');
      if (st) st.value = 'all';
      const kw = document.getElementById('audit-search-input');
      if (kw) kw.value = ticket;
      updateManagerAuditTable();
      const tb = document.getElementById('tbody-mgr'); if (tb) tb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function showReminderDetail() {
      const s = document.getElementById('audit-start-date'), e = document.getElementById('audit-end-date');
      if (s) s.value = remindFrom;
      if (e) e.value = remindTo;
      const st = document.getElementById('audit-match-status-filter');
      if (st) st.value = 'unmatched';
      const kw = document.getElementById('audit-search-input');
      if (kw) kw.value = '';
      updateManagerAuditTable();
      const tb = document.getElementById('tbody-mgr'); if (tb) tb.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    // Tên đầy đủ người làm đơn: tên nhân sự ghi trên đơn (vd "Nguyễn Hoàng Minh Phương") + tài khoản trong ngoặc
    function fullStaffName(trips) {
      const names = [...new Set(trips.map(t => String(t.staff || '').trim()).filter(Boolean))];
      const acc = [...new Set(trips.map(t => t.createdBy).filter(Boolean))].join(', ');
      return (names.length ? names.join(' + ') : acc) + (acc ? ` (TK ${acc})` : '');
    }
    // Đơn giảm giá vượt mức trong khoảng ngày (theo từng bill, đơn chia tiền tính 1)

    // Ghi 1 bảng có định dạng: dòng tiêu đề tối màu, kẻ ô, tô màu theo hàm rowFill
    function xlTable(ws, startRow, cols, rows, rowFill) {
      ws.columns = cols.map(c => ({ width: c.w }));
      const hr = ws.getRow(startRow);
      cols.forEach((c, i) => {
        const cell = hr.getCell(i + 1);
        cell.value = c.h;
        xlFill(cell, 'FF0F172A');
        xlFont(cell, { bold: true, color: { argb: 'FFFFFFFF' } });
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.border = XL.border;
      });
      hr.height = 30;
      let r = startRow + 1;
      if (!rows.length) {
        ws.mergeCells(r, 1, r, cols.length);
        const c = ws.getCell(r, 1);
        c.value = '✅ Không có dữ liệu trong khoảng ngày này';
        xlFont(c, { italic: true, color: { argb: 'FF15803D' } });
        c.alignment = { horizontal: 'center' };
        return r + 1;
      }
      rows.forEach((vals, idx) => {
        const row = ws.getRow(r);
        const fill = rowFill ? rowFill(idx) : null;
        vals.forEach((v, i) => {
          const c = row.getCell(i + 1);
          c.value = v;
          c.border = XL.border;
          xlFont(c, {});
          c.alignment = { vertical: 'middle', wrapText: !!cols[i].wrap, horizontal: cols[i].align || (typeof v === 'number' ? 'right' : 'left') };
          if (cols[i].fmt) c.numFmt = cols[i].fmt;
          if (fill) xlFill(c, fill);
        });
        r++;
      });
      ws.autoFilter = { from: { row: startRow, column: 1 }, to: { row: startRow, column: cols.length } };
      ws.views = [{ state: 'frozen', ySplit: startRow, showGridLines: false }];
      return r;
    }

    let excelJsPromise = null;
    // (11/11) Bỏ mọi icon/emoji (và dấu × xóa dính vào tên) trong file Excel báo cáo — chạy ngay trước khi ghi file.
    const XL_ICON_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2300}-\u{23FF}\u{25A0}-\u{25FF}\u{1F1E6}-\u{1F1FF}\u{FE0E}\u{FE0F}\u{200D}\u{20E3}\u{E0020}-\u{E007F}\u{00D7}]/gu;
    function stripIcons(str) {
      return String(str).replace(XL_ICON_RE, '').replace(/[ \t]{2,}/g, ' ').replace(/^\s*[|•]\s*|\s*[|•]\s*$/g, '').trim();
    }
    function xlStripIcons(wb) {
      wb.eachSheet(ws => {
        ws.eachRow({ includeEmpty: false }, row => {
          row.eachCell({ includeEmpty: false }, cell => {
            if (cell.isMerged && cell.master !== cell) return;
            const v = cell.value;
            if (typeof v === 'string') { const c = stripIcons(v); if (v.replace(XL_ICON_RE, '') !== v) cell.value = c; }
            else if (v && Array.isArray(v.richText)) cell.value = { richText: v.richText.map(r => Object.assign({}, r, { text: String(r.text || '').replace(XL_ICON_RE, '') })) };
          });
        });
      });
    }
    function loadExcelJS() {
      if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
      if (excelJsPromise) return excelJsPromise;
      const urls = [
        'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
        'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
      ];
      excelJsPromise = new Promise((resolve, reject) => {
        const tryLoad = i => {
          if (i >= urls.length) { excelJsPromise = null; reject(new Error('Không tải được thư viện Excel. Kiểm tra mạng rồi thử lại.')); return; }
          const s = document.createElement('script');
          s.src = urls[i];
          s.onload = () => window.ExcelJS ? resolve(window.ExcelJS) : tryLoad(i + 1);
          s.onerror = () => { s.remove(); tryLoad(i + 1); };
          document.head.appendChild(s);
        };
        tryLoad(0);
      });
      return excelJsPromise;
    }

    function sideSums(trips) {

      });
      // Số đơn = số bill (đơn chia tiền nhiều dòng vẫn tính 1)
      return { pos, drv, posN: countBills(trips.filter(t => t.role !== 'driver')), drvN: countBills(trips.filter(t => t.role === 'driver')) };
    }
    function xlTitle(ws, lastCol, f, title) {

      ws.mergeCells(4, 1, 4, lastCol);
