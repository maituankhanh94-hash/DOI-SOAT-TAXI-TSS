          : `<button onclick="openResetPasswordModal('${ue}')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold">🔑 Đặt Lại MK</button>
             <button onclick="toggleAccountActive('${ue}')" class="px-2.5 py-1 ${a.active === false ? 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700' : 'bg-amber-50 hover:bg-amber-100 text-amber-700'} rounded-lg font-bold">${a.active === false ? '🔓 Mở Khóa' : '⛔ Khóa'}</button>
             <button onclick="deleteAccount('${ue}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg font-bold">🗑️ Xóa</button>`;
        return `
          <tr>
            <td class="p-3 font-mono font-bold text-blue-700">${ue}${isMe ? ' <span class="text-[10px] text-slate-400">(bạn)</span>' : ''}</td>
            <td class="p-3 font-mono font-bold text-slate-400">●●●●●●</td>
            <td class="p-3">${roleSel}</td>
            <td class="p-3">${status}</td>
            <td class="p-3 text-center space-x-1 whitespace-nowrap">${actions}</td>
          </tr>`;
      }).join('');
    }

    function pendingLegacyAccounts() {
      return legacyAccounts.filter(a => a && a.user && !accountsMap[String(a.user).trim().toUpperCase()]);
    }

    function renderLegacyMigrateBox() {
      const box = document.getElementById('legacy-migrate-box');
      if (!box) return;
      const pending = pendingLegacyAccounts();
      if (pending.length === 0) {
        box.innerHTML = '';
        // Tất cả tài khoản cũ đã chuyển xong mà vẫn còn mật khẩu dạng chữ (vd do máy còn mở bản app cũ ghi lại) -> xóa đi
        if (accountsLoaded && legacyAccounts.length > 0 && isManager()) dbRef('settings/accounts').set(null).catch(() => {});
        return;
      }
      box.innerHTML = `
        <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="text-xs text-amber-900">
            <div class="font-extrabold">⚠️ Còn ${pending.length} tài khoản cũ chưa chuyển sang hệ thống bảo mật mới</div>
            <div class="mt-0.5">${pending.map(a => escHtml(String(a.user).toUpperCase())).join(', ')} — nhân viên giữ nguyên tài khoản & mật khẩu cũ.</div>
          </div>
          <button id="btn-migrate" onclick="migrateLegacyAccounts()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 rounded-xl text-xs font-extrabold shadow whitespace-nowrap">🔄 Chuyển Đổi Tài Khoản Cũ</button>
        </div>`;
    }

    async function writeAccount(u, uid, ver, role, active, oldUid) {
      const updates = {};
      if (oldUid && oldUid !== uid) updates[`roles/${oldUid}`] = null;
      updates[`roles/${uid}`] = { user: u, role, active: active !== false };
      updates[`accounts/${u}`] = { role, active: active !== false, uid, ver, updatedAt: Date.now() };
      updates[`login_index/${u}`] = { ver };
      await dbRoot().update(updates);
    }

    async function migrateLegacyAccounts() {
      const pending = pendingLegacyAccounts();
      if (pending.length === 0) return;
      if (!confirm(`Chuyển ${pending.length} tài khoản cũ sang hệ thống bảo mật mới?\nNhân viên vẫn đăng nhập bằng tài khoản & mật khẩu cũ.`)) return;
      const btn = document.getElementById('btn-migrate');
      if (btn) { btn.disabled = true; btn.innerText = '⏳ Đang chuyển...'; }
      const ok = [], fail = [];
      for (const a of pending) {
        const u = String(a.user).trim().toUpperCase();
        const p = String(a.pass == null ? '' : a.pass).trim();
        const role = ['pos', 'driver', 'plan', 'manager'].includes(a.role) ? a.role : 'pos';
        try {
          if (!p) throw new Error('không có mật khẩu');
          if (accountsMap[u]) { ok.push(u); continue; }
          const { uid, ver } = await createAuthUserFor(u, p, 0);
          await writeAccount(u, uid, ver, role, true, null);
          accountsMap[u] = { role, active: true, uid, ver };
          ok.push(u);
        } catch (e) {
          fail.push({ a, u, why: authErrorText(e) });
        }
      }
      // Xóa mật khẩu dạng chữ của các tài khoản đã chuyển xong; chỉ giữ lại tài khoản bị lỗi
      try {
        await dbRef('settings/accounts').set(fail.length ? fail.map(f => f.a) : null);
      } catch (e) {}
      renderAccountsTable();
      alert(`Đã chuyển xong ${ok.length} tài khoản.` + (fail.length ? `\nLỗi ${fail.length} tài khoản:\n` + fail.map(f => `- ${f.u}: ${f.why}`).join('\n') : ''));
    }

    async function saveAccount() {
      const u = document.getElementById('new-user').value.trim().toUpperCase();
      const p = document.getElementById('new-pass').value.trim();
      const r = document.getElementById('new-role').value;
      if (!USER_RE.test(u)) { alert("Tên tài khoản chỉ gồm chữ không dấu, số, dấu . _ - (2-30 ký tự)!"); return; }
      if (p.length < 6) { alert("Mật khẩu phải có ít nhất 6 ký tự!"); return; }
      if (accountsMap[u] || pendingLegacyAccounts().some(a => String(a.user).toUpperCase() === u)) {
        alert("Tài khoản này đã tồn tại trong hệ thống!");
        return;
      }
      const btn = document.getElementById('btn-save-acc');
      btn.disabled = true; btn.innerText = '⏳ Đang tạo...';
      try {
        const { uid, ver } = await createAuthUserFor(u, p, 0);
        await writeAccount(u, uid, ver, r, true, null);
        document.getElementById('new-user').value = '';
        document.getElementById('new-pass').value = '';
        alert(`Đã tạo tài khoản ${u} (${ROLE_LABELS[r]}). Nhân viên đăng nhập được ngay!`);
      } catch (e) {
        alert("Không tạo được tài khoản: " + authErrorText(e));
      } finally {
        btn.disabled = false; btn.innerText = '+ Thêm Tài Khoản';
      }
    }

    function openResetPasswordModal(u) {
      closeLoginModals();
      const body = `
        <input type="text" id="reset-pass" autocomplete="off" placeholder="Mật khẩu mới (ít nhất 6 ký tự)..." class="${inputCls}" onkeydown="if(event.key==='Enter') executeResetPassword('${escHtml(u)}')">
        <p class="text-[11px] text-slate-500">Nhân viên đăng nhập bằng tài khoản <b>${escHtml(u)}</b> với mật khẩu mới. Đơn hàng cũ giữ nguyên.</p>`;
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('reset-modal', 'bg-blue-600', '🔑', `Đặt Lại Mật Khẩu: ${escHtml(u)}`, body, 'Lưu Mật Khẩu Mới', `executeResetPassword('${escHtml(u)}')`));
      setTimeout(() => { const i = document.getElementById('reset-pass'); if (i) i.focus(); }, 50);
    }

    // Firebase không cho đổi mật khẩu người khác từ trình duyệt -> tạo tài khoản đăng nhập phiên bản mới, giữ nguyên tên tài khoản
    async function executeResetPassword(u) {
      const a = accountsMap[u];
      const p = document.getElementById('reset-pass').value.trim();
      if (!a) return;
      if (p.length < 6) { setModalBusy('reset-modal', false, 'Mật khẩu phải có ít nhất 6 ký tự!'); return; }
      setModalBusy('reset-modal', true, 'Đang lưu...');
      try {
        const { uid, ver } = await createAuthUserFor(u, p, (a.ver || 0) + 1);
        await writeAccount(u, uid, ver, a.role, a.active !== false, a.uid);
        closeLoginModals();
        alert(`Đã đặt lại mật khẩu cho ${u}!`);
      } catch (e) {
        setModalBusy('reset-modal', false, authErrorText(e));
      }
    }

    function activeManagerCount() {
      return Object.values(accountsMap).filter(a => a && a.role === 'manager' && a.active !== false).length;
    }

    async function toggleAccountActive(u) {
      const a = accountsMap[u];
      if (!a || !a.uid) return;
      const newActive = a.active === false;
      if (!newActive && a.role === 'manager' && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý hoạt động!"); return; }
      if (!newActive && !confirm(`Khóa tài khoản ${u}? Người này sẽ bị đăng xuất ngay.`)) return;
      const updates = {};
      updates[`roles/${a.uid}/active`] = newActive;
      updates[`accounts/${u}/active`] = newActive;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); }
    }

    async function changeAccountRole(u, role) {
      const a = accountsMap[u];
      if (!a || !a.uid) return;
      if (a.role === 'manager' && role !== 'manager' && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý!"); renderAccountsTable(); return; }
      const updates = {};
      updates[`roles/${a.uid}/role`] = role;
      updates[`accounts/${u}/role`] = role;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); renderAccountsTable(); }
    }

    async function deleteAccount(u) {
      const a = accountsMap[u];
      if (!a) return;
      if (a.role === 'manager' && a.active !== false && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý!"); return; }
      if (!confirm(`Bạn có chắc chắn muốn xóa tài khoản ${u} không?\n(Đơn hàng đã nhập của tài khoản này vẫn được giữ lại)`)) return;
      const updates = {};
      if (a.uid) updates[`roles/${a.uid}`] = null;
      updates[`accounts/${u}`] = null;
      updates[`login_index/${u}`] = null;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); }
    }

    // CHỈ DÙNG Ở BẢN THỬ: chép danh mục + đơn hàng từ dữ liệu thật sang vùng thử (chỉ ĐỌC dữ liệu thật)
    async function copyRealDataToTest() {
      if (!IS_TEST_ENV || !DB_PREFIX) return;
      if (!confirm('Chép danh mục, tài khoản cũ và toàn bộ đơn hàng từ DỮ LIỆU THẬT sang BẢN THỬ?\n(Dữ liệu thật chỉ được đọc, không bị thay đổi. Đơn trong bản thử sẽ bị thay bằng bản chép.)')) return;
      try {
        const [st, tr, ut] = await Promise.all(['settings', 'trips', 'users_trips'].map(p => rtdb.ref(p).once('value')));
        const updates = {};
        const s = st.val() || {};
        Object.keys(s).forEach(k => { updates['settings/' + k] = s[k]; });
        const trips = tr.val() || {}, uTrips = ut.val() || {};
        Object.keys(trips).forEach(id => { updates['trips/' + id] = trips[id]; });
        Object.keys(uTrips).forEach(u => { updates['users_trips/' + u] = uTrips[u]; });
        await dbRoot().update(updates);
        alert(`Đã chép ${Object.keys(tr.val() || {}).length} đơn hàng và danh mục vào bản thử!`);
      } catch (e) {
        alert('Không chép được: ' + authErrorText(e));
      }
    }
  </script>
</body>
</html>
