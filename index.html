<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS POS - Hệ Thống Điều Xe Sân Bay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: pan-x pan-y; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .local-dropdown { position: absolute; z-index: 999999; background: white; border: 2px solid #2563eb; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto; width: 100%; margin-top: 4px; left: 0; }
    .local-item { padding: 8px 12px; font-size: 11px; font-weight: 700; color: #1e293b; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .local-item:hover { background: #eff6ff; color: #1d4ed8; }
    .inline-edit-input { background: #fff; border: 1px solid #3b82f6; border-radius: 6px; padding: 2px 6px; font-size: 11px; width: 100%; font-weight: 700; }
    
    @keyframes rainbow-border {
      0% { border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
      33% { border-color: #3b82f6; box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
      66% { border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
      100% { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    .popup-vinh-danh {
      animation: rainbow-border 3s infinite alternate, bounce-gentle 2s infinite ease-in-out;
      border: 3px solid #3b82f6;
    }
  </style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white px-4 py-3 flex items-center justify-between shadow-md flex-none z-30">
    <div class="flex items-center space-x-3">
      <span class="font-extrabold text-sm">✈️ TSS POS</span>
      <span id="test-env-badge" class="hidden text-[10px] bg-amber-400 text-slate-900 px-2 py-1 rounded-lg font-extrabold" title="Dữ liệu ở vùng thử nghiệm riêng, không ảnh hưởng dữ liệu thật">🧪 BẢN THỬ</span>
      <span id="header-status" class="text-xs bg-blue-700 px-2.5 py-1 rounded-lg">Màn hình đăng nhập</span>
      <div id="firebase-status-badge" class="px-2.5 py-1 bg-emerald-500 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 transition-all">
        <span id="firebase-dot" class="w-2 h-2 rounded-full bg-white animate-ping"></span>
        <span id="firebase-status-text">🟢 Cloud Đang Kết Nối</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="logoutSession()" id="btn-logout" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold hidden">Đăng Xuất</button>
      <button onclick="openChangeOwnPasswordModal()" id="btn-change-pass" class="px-2.5 py-1.5 bg-blue-500 hover:bg-blue-700 text-white rounded-lg text-xs font-bold hidden">🔑 Đổi Mật Khẩu</button>
      <button onclick="logoutSession()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg text-xs font-bold">Thoát App</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="main-container" class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full flex flex-col">
    <!-- Nội dung render động -->
  </main>

  <!-- FLOATING WARNING NOTIFICATION BANNER -->
  <div id="floating-warning-banner" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-amber-500 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-extrabold flex items-center space-x-3 hidden transition-all duration-300">
    <span id="floating-warning-text">⚠️ Cảnh báo trùng lặp đơn hàng!</span>
    <button onclick="document.getElementById('floating-warning-banner').classList.add('hidden')" class="bg-amber-600 hover:bg-amber-700 text-white px-2 py-1 rounded-xl text-[10px]">Đóng</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB9rTrGArG5WUfUMfznab5YjblCv4Amg4M",
      authDomain: "taxi-tss-df1a5.firebaseapp.com",
      databaseURL: "https://taxi-tss-df1a5-default-rtdb.firebaseio.com",
      projectId: "taxi-tss-df1a5",
      storageBucket: "taxi-tss-df1a5.firebasestorage.app",
      messagingSenderId: "487347280845",
      appId: "1:487347280845:web:90ee3c994ae250918ec284"
    };
    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();
    const fbAuth = firebase.auth();

    // ===== MÔI TRƯỜNG: BẢN THỬ dùng vùng dữ liệu riêng "test_env/", BẢN CHÍNH dùng gốc =====
    // Trên nhánh thử nghiệm đặt FORCE_TEST_ENV = true. Trước khi đưa lên bản chính (main) đặt lại = false.
    const FORCE_TEST_ENV = false;
    const IS_TEST_ENV = FORCE_TEST_ENV || /-git-|localhost|127\.0\.0\.1/.test(location.hostname) || location.protocol === 'file:';
    const DB_PREFIX = IS_TEST_ENV ? 'test_env' : '';
    const EMAIL_DOMAIN = IS_TEST_ENV ? 'test.taxi-tss.local' : 'taxi-tss.local';
    function dbRef(path) { return DB_PREFIX ? rtdb.ref(DB_PREFIX + '/' + path) : rtdb.ref(path); }
    function dbRoot() { return DB_PREFIX ? rtdb.ref(DB_PREFIX) : rtdb.ref(); }

    // Tài khoản app (vd TSS01) <-> tài khoản đăng nhập Firebase (email nội bộ, không phải email thật)
    function accountEmail(user, ver) { return `${String(user).toLowerCase()}${ver ? '.v' + ver : ''}@${EMAIL_DOMAIN}`; }
    // Firebase yêu cầu mật khẩu >= 6 ký tự, nên thêm tiền tố cố định để mật khẩu cũ ngắn (vd "123") vẫn dùng được
    function authPassword(pass) { return 'tss-pw:' + pass; }
    function escHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // Tạo tài khoản Firebase mới mà KHÔNG làm người đang đăng nhập (quản lý) bị đăng xuất
    let secondaryApp = null;
    async function createAuthUserFor(user, pass, startVer) {
      if (!secondaryApp) secondaryApp = firebase.initializeApp(firebaseConfig, 'tao-tai-khoan');
      const secAuth = secondaryApp.auth();
      if (secAuth.setPersistence) { try { await secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {} }
      let ver = startVer || 0;
      for (let tries = 0; tries < 30; tries++, ver++) {
        try {
          const cred = await secAuth.createUserWithEmailAndPassword(accountEmail(user, ver), authPassword(pass));
          const uid = cred.user.uid;
          await secAuth.signOut();
          return { uid, ver };
        } catch (e) {
          if (e && e.code === 'auth/email-already-in-use') continue;
          throw e;
        }
      }
      throw new Error('Không tạo được tài khoản (quá nhiều phiên bản).');
    }

    function authErrorText(e) {
      const c = (e && e.code) || '';
      if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'Tài khoản hoặc mật khẩu không đúng!';
      if (c === 'auth/too-many-requests') return 'Nhập sai quá nhiều lần. Vui lòng đợi vài phút rồi thử lại!';
      if (c === 'auth/network-request-failed') return 'Mất kết nối mạng. Vui lòng kiểm tra Internet!';
      if (c === 'auth/operation-not-allowed') return 'Firebase chưa bật đăng nhập Email/Password. Báo quản trị viên bật trong Firebase > Authentication.';
      if (c === 'auth/weak-password') return 'Mật khẩu quá yếu!';
      if (c === 'PERMISSION_DENIED' || /permission/i.test((e && e.message) || '')) return 'Không có quyền thực hiện thao tác này.';
      return 'Lỗi: ' + ((e && e.message) || e);
    }

    let loggedInUser = null;
    let myUid = null;
    let accountsMap = {};       // accounts/<USER> = {role, active, uid, ver}
    let accountsLoaded = false;
    let legacyAccounts = [];    // settings/accounts cũ (mật khẩu dạng chữ) - chỉ dùng để chuyển đổi 1 lần
    let personalTrips = []; 
    let allCompanyTrips = []; 
    let lastDeletedTripBackup = null;
    let celebratedStaffToday = {}; // Lưu lại nhân viên đã được chúc mừng trong ngày để chỉ hiện 1 lần/ngày
    
    let sourceOptions = ["SQ", "G1", "VTO", "Khách Quầy", "City Tour", "ThanhLong", "JOVIA", "VDT", "MONICA", "NOVEMBER", "STELLAR", "SANNA", "LA SIESTA"];
    let staffOptions = ["Mai Tuấn Khanh", "Nguyễn Văn An", "Trần Thị Tâm", "Lê Văn Liên", "Hoàng Đức Tài", "Lê Chí Bình", "Mẫn"];
    let carTypeOptions = ["Xe 4 Chỗ", "Xe 7 Chỗ", "Xe 16 Chỗ"];
    let paymentOptions = ["Nhân Viên Quầy Thu", "Thẻ", "Kế Hoạch", "Tài Xế Thu"];
    let planPaymentOptions = ["Chuyển Khoản", "Công Nợ", "Tiền Mặt"];
    let plan2PaymentOptions = ["Chuyển Khoản", "Công Nợ", "Tiền Mặt"];   // Team Kế Hoạch 2 (13/11): danh sách thanh toán riêng
    // Team Kế Hoạch 2 ('plan2') chạy giống Team Kế Hoạch ('plan'): bên bán khi đối soát, biển số không bắt buộc, thanh toán nhóm KH
    function isPlanRole(r) { return r === 'plan' || r === 'plan2'; }
    function isSellRole(r) { return r === 'pos' || r === 'plan' || r === 'plan2'; }
    function payListFor(role) { return role === 'plan2' ? plan2PaymentOptions : (role === 'plan' ? planPaymentOptions : paymentOptions); }
    
    let lockHourSetting = 8; 
    const TERMINAL_OPTIONS = ["T2", "T1", "T3"];
    const ROLE_LABELS = { 'pos': 'Bán Vé (Quầy)', 'driver': 'Cổng Chủ Xe', 'plan': 'Team Kế Hoạch', 'plan2': 'Team Kế Hoạch 2', 'manager': 'Quản Lý' };

    window.addEventListener('DOMContentLoaded', async () => {
      initCloudStatusMonitor();
      if (IS_TEST_ENV) {
        const b = document.getElementById('test-env-badge');
        if (b) b.classList.remove('hidden');
      }
      try { await fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch (e) {}
      let firstCheck = true;
      fbAuth.onAuthStateChanged(async (u) => {
        if (!firstCheck) return;
        firstCheck = false;
        if (u) {
          // Tải lại trang (F5) trong cùng tab: giữ phiên đăng nhập
          try { await enterSessionForUid(u.uid, null); return; } catch (e) { try { await fbAuth.signOut(); } catch (e2) {} }
        }
        renderHomeSelection();
      });
    });

    function isManager() { return !!(loggedInUser && loggedInUser.role === 'manager'); }

    // Sau khi đăng nhập Firebase: kiểm tra quyền trong roles/<uid>, rồi mở đúng màn hình
    async function enterSessionForUid(uid, expectedRole) {
      const snap = await dbRef('roles/' + uid).once('value');
      const r = snap.val();
      if (!r || r.active !== true) throw { code: 'app/inactive' };
      if (expectedRole && r.role !== expectedRole) throw { code: 'app/wrong-role' };
      myUid = uid;
      loggedInUser = { user: r.user, role: r.role };
      // Bị quản lý khóa/xóa tài khoản trong lúc đang dùng -> tự đăng xuất
      dbRef('roles/' + uid).on('value', s => {
        const v = s.val();
        if (loggedInUser && (!v || v.active !== true)) {
          alert('Tài khoản của bạn đã bị khóa hoặc thay đổi. Vui lòng đăng nhập lại!');
          logoutSession();
        }
      }, () => {});
      document.getElementById('btn-logout').classList.remove('hidden');
      document.getElementById('btn-change-pass').classList.remove('hidden');
      await loadCloudSettings();
      loadPlaces();
      loadPriceList();
      if (r.role === 'manager') startManagerSession();
      else startWorkerSession(r.role);
    }

    function initCloudStatusMonitor() {
      const badge = document.getElementById('firebase-status-badge');
      const text = document.getElementById('firebase-status-text');
      const dot = document.getElementById('firebase-dot');

      rtdb.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
          if(badge) badge.className = "px-2.5 py-1 bg-emerald-500 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 transition-all";
          if(text) text.innerText = "🟢 Cloud Đang Kết Nối";
          if(dot) dot.style.display = 'block';
        } else {
          if(badge) badge.className = "px-2.5 py-1 bg-rose-600 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 animate-pulse transition-all";
          if(text) text.innerText = "🔴 Mất Kết Nối Cloud";
          if(dot) dot.style.display = 'none';
        }
      });
    }

    // Tải danh mục cấu hình. Trả về Promise xong khi đã nhận lần đầu (để màn hình nhập có đủ danh mục).
    function loadCloudSettings() {
      const toArr = v => Array.isArray(v) ? v.filter(x => x !== null && x !== undefined) : Object.values(v);
      const defs = [
        ['sources', () => sourceOptions, v => { sourceOptions = toArr(v); }, () => renderSourcesTable()],
        ['staff', () => staffOptions, v => { staffOptions = toArr(v); }, () => renderStaffTable()],
        ['carTypes', () => carTypeOptions, v => { carTypeOptions = toArr(v); }, () => renderCarTypesTable()],
        ['payments', () => paymentOptions, v => { paymentOptions = toArr(v); }, () => renderPaymentsTable()],
        ['planPayments', () => planPaymentOptions, v => { planPaymentOptions = toArr(v); }, () => renderPlanPaymentsTable()],
        ['plan2Payments', () => plan2PaymentOptions, v => { plan2PaymentOptions = toArr(v); }, () => renderPlanPaymentsTable('plan2')],
        ['lockHour', () => lockHourSetting, v => {
          lockHourSetting = parseInt(v, 10);
          const inp = document.getElementById('lock-hour-input');
          if (inp) inp.value = lockHourSetting;
        }, null]
      ];
      if (isManager()) {
        dbRef('accounts').on('value', snap => {
          accountsMap = snap.val() || {};
          accountsLoaded = true;
          renderAccountsTable();
        }, () => {});
        dbRef('settings/accounts').on('value', snap => {
          const val = snap.val();
          legacyAccounts = val ? toArr(val).filter(a => a && a.user) : [];
          renderAccountsTable();
        }, () => {});
      }
      return Promise.all(defs.map(([key, getDefault, apply, rerender]) => new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        dbRef('settings/' + key).on('value', snap => {
          const val = snap.val();
          if (val !== null && val !== undefined) {
            apply(val);
            if (rerender && isManager()) rerender();
          } else if (isManager()) {
            dbRef('settings/' + key).set(getDefault()).catch(() => {});
          }
          finish();
        }, () => finish());
        setTimeout(finish, 8000);
      })));
    }
    function saveLockHour() {
      const inp = document.getElementById('lock-hour-input');
      if (!inp) return;
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val < 0 || val > 23) { alert("Vui lòng nhập giờ hợp lệ từ 0 đến 23!"); return; }
      lockHourSetting = val;
      dbRef('settings/lockHour').set(lockHourSetting).then(() => {
        alert(`Đã cập nhật giờ khóa đơn thành ${lockHourSetting}:00 ngày hôm sau!`);
      });
    }

    function showFloatingWarning(msg) {
      const banner = document.getElementById('floating-warning-banner');
      const text = document.getElementById('floating-warning-text');
      if (banner && text) {
        text.innerText = "⚠️ " + msg;
        banner.classList.remove('hidden');
        setTimeout(() => { banner.classList.add('hidden'); }, 6000);
      }
    }

    function renderHomeSelection() {
      loggedInUser = null;
      document.getElementById('header-status').innerText = "Chọn phân vùng đăng nhập";
      document.getElementById('btn-logout').classList.add('hidden');
      
      document.getElementById('main-container').innerHTML = `
        <div class="flex flex-col items-center justify-center text-center space-y-6 my-auto py-10">
          <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white w-24 h-24 rounded-3xl flex items-center justify-center text-4xl font-extrabold shadow-2xl">
            ✈️
          </div>
          <div class="space-y-2">
            <h1 class="text-2xl font-extrabold text-slate-900">HỆ THỐNG ĐIỀU XE SÂN BAY TSS</h1>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">Chọn phân vùng làm việc của bạn bên dưới:</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 w-full max-w-3xl">
            <button onclick="promptLogin('pos')" class="p-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg">🚖 Bán Vé (Quầy)</button>
            <button onclick="promptLogin('driver')" class="p-4 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-2xl shadow-lg">🚗 Cổng Chủ Xe</button>
            <button onclick="promptLogin('plan')" class="p-4 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-2xl shadow-lg">📋 Team Kế Hoạch</button>
            <button onclick="promptLogin('plan2')" class="p-4 bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs rounded-2xl shadow-lg">📋 Team Kế Hoạch 2</button>
            <button onclick="promptLogin('manager')" class="p-4 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-2xl shadow-lg">📊 Trang Quản Lý</button>
          </div>
        </div>
      `;
    }

    function loginModalHtml(id, iconBg, icon, title, bodyHtml, okLabel, okAction, okClass) {
      return `
        <div id="${id}" class="login-modal fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
          <div class="bg-white rounded-3xl shadow-2xl max-w-xs w-full p-6 text-center space-y-4">
            <div class="${iconBg} text-white w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">${icon}</div>
            <h3 class="text-sm font-bold text-slate-900">${title}</h3>
            <div class="space-y-2 text-left">${bodyHtml}</div>
            <div id="${id}-msg" class="text-[11px] font-bold text-rose-600 min-h-[14px]"></div>
            <div class="flex space-x-2 pt-1">
              <button id="${id}-ok" onclick="${okAction}" class="w-full py-2.5 ${okClass || 'bg-blue-600 hover:bg-blue-700'} text-white rounded-xl text-xs font-bold">${okLabel}</button>
              <button onclick="closeLoginModals()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Hủy</button>
            </div>
          </div>
        </div>`;
    }
    function closeLoginModals() { document.querySelectorAll('.login-modal').forEach(m => m.remove()); }
    function setModalBusy(id, busy, msg) {
      const ok = document.getElementById(id + '-ok');
      const m = document.getElementById(id + '-msg');
      if (ok) { ok.disabled = busy; ok.style.opacity = busy ? '0.6' : '1'; }
      if (m) { m.className = 'text-[11px] font-bold min-h-[14px] ' + (busy ? 'text-blue-600' : 'text-rose-600'); m.innerText = msg || ''; }
    }
    const inputCls = 'w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold';

    async function promptLogin(role) {
      closeLoginModals();
      if (role === 'manager') {
        // Chưa có tài khoản nào trong hệ thống mới -> thiết lập quản lý lần đầu
        let isEmpty = false;
        try { isEmpty = !(await dbRef('login_index').limitToFirst(1).once('value')).exists(); } catch (e) {}
        if (isEmpty) { promptBootstrapManager(); return; }
      }
      const titles = { pos: 'Đăng Nhập Bán Vé', driver: 'Đăng Nhập Chủ Xe / Tài Xế', plan: 'Đăng Nhập Team Kế Hoạch', plan2: 'Đăng Nhập Team Kế Hoạch 2', manager: 'Đăng Nhập Quản Lý' };
      const body = `
        <input type="text" id="modal-user" autocomplete="username" placeholder="Tài khoản..." class="${inputCls}">
        <input type="password" id="modal-pwd" autocomplete="current-password" placeholder="Mật khẩu..." class="${inputCls}" onkeydown="if(event.key==='Enter') executeUserLogin('${role}')">`;
      const icon = role === 'manager' ? '📊' : '🔐';
      const bg = role === 'manager' ? 'bg-slate-900' : 'bg-blue-600';
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('login-modal', bg, icon, titles[role] || 'Đăng Nhập', body, 'Xác Nhận', `executeUserLogin('${role}')`));
      setTimeout(() => { const i = document.getElementById('modal-user'); if (i) i.focus(); }, 50);
    }
    function promptUserLoginModal(role) { promptLogin(role); }

    async function executeUserLogin(role) {
      const u = document.getElementById('modal-user').value.trim().toUpperCase();
      const p = document.getElementById('modal-pwd').value.trim();
      if (!u || !p) { setModalBusy('login-modal', false, 'Vui lòng nhập tài khoản và mật khẩu!'); return; }
      setModalBusy('login-modal', true, 'Đang đăng nhập...');
      try {
        const idxSnap = await dbRef('login_index/' + u).once('value');
        const idx = idxSnap.val();
        if (!idx) throw { code: 'app/no-account' };
        const cred = await fbAuth.signInWithEmailAndPassword(accountEmail(u, idx.ver || 0), authPassword(p));
        try {
          await enterSessionForUid(cred.user.uid, role);
        } catch (e) {
          loggedInUser = null; myUid = null;
          try { await fbAuth.signOut(); } catch (e2) {}
          throw e;
        }
        closeLoginModals();
      } catch (e) {
        let msg = authErrorText(e);
        if (e && e.code === 'app/no-account') msg = 'Tài khoản không tồn tại! (Nếu là tài khoản cũ, báo quản lý bấm "Chuyển Đổi Tài Khoản Cũ")';
        if (e && e.code === 'app/inactive') msg = 'Tài khoản đã bị khóa. Vui lòng liên hệ quản lý!';
        if (e && e.code === 'app/wrong-role') msg = 'Tài khoản này không thuộc phân vùng bạn chọn!';
        setModalBusy('login-modal', false, msg);
        const pw = document.getElementById('modal-pwd'); if (pw) { pw.value = ''; pw.focus(); }
      }
    }

    async function executeBootstrapManager() {
      const oldP = document.getElementById('boot-old').value.trim();
      const u = document.getElementById('boot-user').value.trim().toUpperCase();
      const p = document.getElementById('boot-pass').value.trim();
      const p2 = document.getElementById('boot-pass2').value.trim();
      if (oldP !== '999') { setModalBusy('boot-modal', false, 'Mật khẩu quản lý cũ không đúng!'); return; }
      if (!/^[A-Z0-9_.-]{2,30}$/.test(u)) { setModalBusy('boot-modal', false, 'Tên tài khoản chỉ gồm chữ không dấu, số (2-30 ký tự)!'); return; }
      if (!p) { setModalBusy('boot-modal', false, 'Vui lòng nhập mật khẩu mới!'); return; }
      if (p !== p2) { setModalBusy('boot-modal', false, 'Hai lần nhập mật khẩu không giống nhau!'); return; }
      setModalBusy('boot-modal', true, 'Đang tạo tài khoản...');
      try {
        const { uid, ver } = await createAuthUserFor(u, p, 0);
        await fbAuth.signInWithEmailAndPassword(accountEmail(u, ver), authPassword(p));
        const now = Date.now();
        const updates = {};
        updates[`roles/${uid}`] = { user: u, role: 'manager', active: true };
        updates[`accounts/${u}`] = { role: 'manager', active: true, uid, ver, createdAt: now };
        updates[`login_index/${u}`] = { ver };
        await dbRoot().update(updates);
        await enterSessionForUid(uid, 'manager');
        closeLoginModals();
        alert(`Đã tạo tài khoản quản lý ${u}. Từ nay đăng nhập Trang Quản Lý bằng tài khoản này!`);
      } catch (e) {
        try { await fbAuth.signOut(); } catch (e2) {}
        loggedInUser = null;
        setModalBusy('boot-modal', false, authErrorText(e));
      }
    }

    // ===== TẢI DỮ LIỆU THEO KHOẢNG NGÀY (tiết kiệm dung lượng) =====
    // Mỗi đơn có trường dateKey (yyyy-mm-dd). Khi dữ liệu đã được nâng cấp (meta/dateKeyV1 = true) và quy tắc mới đã dán,
    // Quản lý chỉ tải đơn trong khoảng ngày đang xem; nhân viên chỉ tải đơn từ đầu tháng trước. Nếu chưa -> tải toàn bộ như cũ.
    async function checkDataMeta() {
      try { const s = await dbRef('meta/dateKeyV1').once('value'); return s.val() === true; }
      catch (e) { return null; } // null = quy tắc cũ, chưa cho đọc meta
    }
    async function writeInChunks(updates) {
      const keys = Object.keys(updates);
      for (let i = 0; i < keys.length; i += 400) {
        const part = {};
        keys.slice(i, i + 400).forEach(k => { part[k] = updates[k]; });
        await dbRoot().update(part);
      }
    }
    function showTopNotice(msg) {
      let el = document.getElementById('top-notice');
      if (!msg) { if (el) el.remove(); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'top-notice';
        el.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold';
        document.body.appendChild(el);
      }
      el.innerText = msg;
    }

    // Nâng cấp 1 lần (Quản lý): thêm dateKey cho mọi đơn cũ + tạo danh sách địa chỉ hay đi
    async function runDateKeyBackfill() {
      try {
        showTopNotice('⏳ Đang nâng cấp dữ liệu lần đầu (chỉ 1 lần, khoảng vài giây)...');
        const trips = (await dbRef('trips').once('value')).val() || {};
        const users = new Set(Object.keys(accountsMap));
        Object.values(trips).forEach(t => { if (t && t.createdBy) users.add(t.createdBy); });
        const updates = {};
        Object.entries(trips).forEach(([id, t]) => {
          if (t && !t.dateKey) updates[`trips/${id}/dateKey`] = tripDateKey(t) || fallbackDateKey(t);
        });
        for (const u of users) {
          const ut = (await dbRef('users_trips/' + u).once('value')).val() || {};
          Object.entries(ut).forEach(([id, t]) => {
            if (t && !t.dateKey) updates[`users_trips/${u}/${id}/dateKey`] = tripDateKey(t) || fallbackDateKey(t);
          });
        }
        // Danh sách địa chỉ từ các đơn đã có
        const places = {};
        Object.values(trips).forEach(t => {
          const name = String((t && t.destination) || '').trim();
          const k = placeSlug(name);
          if (!k) return;
          if (!places[k]) places[k] = { name, n: 0 };
          places[k].n++;
        });
        Object.entries(places).forEach(([k, v]) => { updates[`places/${k}`] = v; });
        await writeInChunks(updates);
        await dbRef('meta/dateKeyV1').set(true);
        showTopNotice('');
        return true;
      } catch (e) {
        console.warn('Chưa nâng cấp được dữ liệu (có thể chưa dán quy tắc mới):', e);
        showTopNotice('');
        return false;
      }
    }
    function fallbackDateKey(t) { return t && t.timestamp ? localDateKey(new Date(Number(t.timestamp))) : '0000-00-00'; }

    // Đơn do máy còn mở bản app cũ ghi (thiếu dateKey) -> bổ sung, để không bị "mất" khỏi bảng
    async function fixMissingDateKeys(basePath, mirror) {
      try {
        const snap = await dbRef(basePath).orderByChild('dateKey').endAt(null).once('value');
        const v = snap.val() || {};
        const updates = {};
        Object.entries(v).forEach(([id, t]) => {
          if (!t || t.dateKey) return;
          const dk = tripDateKey(t) || fallbackDateKey(t);
          updates[`${basePath}/${id}/dateKey`] = dk;
          const other = mirror(t, id);
          if (other) updates[`${other}/dateKey`] = dk;
        });
        if (Object.keys(updates).length) await writeInChunks(updates);
      } catch (e) { console.warn('fixMissingDateKeys', e); }
    }

    let mgrMode = null, mgrWinKey = null, mgrWinRef = null, mgrWinCb = null;
    async function startManagerSession() {
      document.getElementById('header-status').innerText = `Quản Lý: ${loggedInUser.user}`;
      renderManagerDashboard();
      let ok = await checkDataMeta();
      if (ok === false) ok = await runDateKeyBackfill();
      if (ok === true) {
        await fixMissingDateKeys('trips', t => t.createdBy ? `users_trips/${t.createdBy}/${t.id}` : null);
        mgrMode = 'window';
      } else {
        mgrMode = 'full';
      }
      refreshManagerWindow(true);
    }

    // Quản lý: chọn khoảng ngày cần tải = hợp của (bảng đối soát, doanh thu ngày, nhắc báo cáo)
    function refreshManagerWindow(force) {
      if (!isManager() || !mgrMode) return;
      let from = '', to = '';
      if (mgrMode === 'window') {
        const v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
        const today = localDateKey(new Date());
        const aS = v('audit-start-date'), aE = v('audit-end-date');
        if (aS) {
          const rev = v('revenue-date-picker') || today;
          const starts = [aS, rev, remindFrom].filter(Boolean).sort();
          const ends = [aE || '9999-12-31', rev, remindTo].filter(Boolean).sort();
          from = shiftDateKey(starts[0], -1);   // tải thêm 1 ngày trước/sau để ghép đơn tài xế ghi lệch ngày
          to = ends[ends.length - 1] === '9999-12-31' ? '9999-12-31' : shiftDateKey(ends[ends.length - 1], 1);
        }
      }
      const key = from + '|' + to;
      if (!force && key === mgrWinKey) return;
      if (mgrWinRef && mgrWinCb) mgrWinRef.off('value', mgrWinCb);
      mgrWinKey = key;
      let q = dbRef('trips');
      if (from) q = q.orderByChild('dateKey').startAt(from).endAt(to);
      mgrWinRef = q;
      mgrWinCb = s => {
        const dataVal = s.val();
        allCompanyTrips = dataVal ? Object.values(dataVal) : [];
        updateManagerAuditTable();
        updateManagerRevenueSummary();
      };
      q.on('value', mgrWinCb, err => console.warn('trips', err));
    }

    let staffMode = null, staffWinFrom = null, staffRef = null, staffCb = null, staffRole = null;
    function monthStartKey(dateKey) { return dateKey.slice(0, 8) + '01'; }
    function startWorkerSession(role) {
      const roleLabels = { 'pos': 'Bán Vé', 'driver': 'Tài Xế', 'plan': 'Team Kế Hoạch', 'plan2': 'Team Kế Hoạch 2' };
      document.getElementById('header-status').innerText = `${roleLabels[role] || role}: ${loggedInUser.user}`;

    function setStaffWindow(from, force) {
      if (!loggedInUser || !staffMode) return;
      if (staffMode === 'full') { if (staffRef && !force) return; from = ''; }
      else if (!force && staffWinFrom && from >= staffWinFrom) return;

      staffWinFrom = from;

      if (from) q = q.orderByChild('dateKey').startAt(from);

      staffCb = s => {

        updatePersonalSummary(staffRole);

    // Nhân viên chọn xem ngày cũ hơn khoảng đã tải -> tải thêm
    function ensureStaffDate(dateKey) {
      if (staffMode === 'window' && dateKey && staffWinFrom && dateKey < staffWinFrom) setStaffWindow(monthStartKey(dateKey));
    }

    // ===== GỢI Ý ĐỊA CHỈ (từ các điểm đến công ty đã từng nhập) =====
    let placesMap = {};
    function removeAccents(str) {
      return String(str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
    }
    function placeSlug(name) {
      return removeAccents(name).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80);
    }
    function loadPlaces() {
      dbRef('places').orderByChild('n').limitToLast(3000).on('value', s => { placesMap = s.val() || {}; }, () => {});
    }
    function recordPlaces(dests) {
      const upd = {};
      dests.forEach(d => {
        const name = String(d || '').trim();
        const k = placeSlug(name);
        if (!k || name.length > 200) return;
        upd[`places/${k}/name`] = name;
        upd[`places/${k}/n`] = firebase.database.ServerValue.increment(1);
      });
      if (Object.keys(upd).length) dbRoot().update(upd).catch(() => {});
    }
    function placeCandidates() {
      const m = {};
      Object.entries(placesMap).forEach(([k, v]) => { if (v && v.name) m[k] = { name: v.name, n: Number(v.n) || 1 }; });
      [...personalTrips, ...allCompanyTrips].forEach(t => {
        const name = String((t && t.destination) || '').trim();
        const k = placeSlug(name);
        if (!k) return;
        if (!m[k]) m[k] = { name, n: 0 };
        if (!placesMap[k]) m[k].n++;
      });
      return Object.values(m);
    }

    // Ô gợi ý dùng chung: chọn bằng chuột hoặc phím ↑ ↓ Enter
    function renderSuggestBox(input, dropId, items, icon) {
      const drop = document.getElementById(dropId);
      if (!drop) return;
      if (!items.length) { drop.innerHTML = ''; return; }
      drop.innerHTML = `<div class="local-dropdown">${items.map((v, i) => `
        <div class="local-item${i === 0 ? ' bg-blue-50' : ''}" data-target="${escHtml(input.id)}" data-drop="${escHtml(dropId)}" data-v="${escHtml(v)}" onmousedown="event.preventDefault(); pickSuggest(this)">${icon} ${escHtml(v)}</div>
      `).join('')}</div>`;
    }
    function pickSuggest(el) {
      const inp = document.getElementById(el.dataset.target);
      if (inp) {
        inp.value = el.dataset.v;
        if (el.dataset.pid !== undefined) attachPriceToInput(inp, el.dataset.pid ? priceById[el.dataset.pid] : null);
        inp.dispatchEvent(new Event('change'));
        if (el.dataset.row !== undefined && el.dataset.row !== '') applyRowPrice(Number(el.dataset.row));
        if (inp.id === 'edit-modal-dest') applyEditModalPrice();
      }
      const drop = document.getElementById(el.dataset.drop);
      if (drop) drop.innerHTML = '';
    }
    function suggestKeydown(e, dropId) {
      const drop = document.getElementById(dropId);
      const items = drop ? [...drop.querySelectorAll('.local-item')] : [];
      if (!items.length) return;
      let idx = items.findIndex(x => x.classList.contains('bg-blue-50'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (idx >= 0) items[idx].classList.remove('bg-blue-50');
        idx = e.key === 'ArrowDown' ? Math.min(items.length - 1, idx + 1) : Math.max(0, idx - 1);
        items[idx].classList.add('bg-blue-50');
        items[idx].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && idx >= 0) {
        e.preventDefault();
        pickSuggest(items[idx]);
      } else if (e.key === 'Escape') {
        drop.innerHTML = '';
      }
    }
    function hideSuggestLater(dropId) { setTimeout(() => { const d = document.getElementById(dropId); if (d) d.innerHTML = ''; }, 150); }

    // ===== BẢNG GIÁ CÔNG TY: tự nhảy giá khi Bán vé chọn điểm đến + kiểm tra mức giảm =====
    // Dữ liệu: file bang-gia.json (tạo từ Excel bằng bang-gia/tao-bang-gia.js). Nội thành (trang DON SB) / ngoại thành (trang TOUR đi tỉnh).
    // Mức giảm tối đa: mặc định 10% nội thành, 15% ngoại thành. Quản lý chỉnh ở bảng "Nhắc Báo Cáo & Giảm Giá Vượt Mức" (lưu meta/discountLimit = {noi: 10, ngoai: 15} tính bằng %).
    const DISCOUNT_LIMIT_DEFAULT = { noi: 0.10, ngoai: 0.15 };
    const DISCOUNT_LIMIT = Object.assign({}, DISCOUNT_LIMIT_DEFAULT);
    function pctText(f) { return String(Math.round(f * 1000) / 10).replace('.', ',') + '%'; }
    const ZONE_LABEL = { noi: 'nội thành', ngoai: 'ngoại thành' };
    // THEO DÕI ÂM THẦM (người dùng chọn): nhân viên KHÔNG thấy cảnh báo giảm giá; giá vẫn tự điền; chỉ Quản lý thấy & lọc.
    const SILENT_DISCOUNT_WATCH = true;
    // 2 bảng giá: MỚI (bang-gia.json) và CŨ (bang-gia-cu.json). Quản lý chọn bảng đang áp dụng (lưu ở meta/priceSet, áp cho cả công ty).
    const PRICE_SETS = { moi: { file: 'bang-gia.json', label: 'Giá MỚI' }, cu: { file: 'bang-gia-cu.json', label: 'Giá CŨ' } };
    let activePriceSet = 'moi', priceSetsData = {};
    let priceItems = [], priceById = {};
    function preparePriceItems(d) {
      if (!d || !Array.isArray(d.items)) return [];
      return d.items.map(it => {
        const extra = [];
        const m = /^Quận\s+(\d+)$/i.exec(it.district || '');
        if (m) extra.push(`q${m[1]}`, `q ${m[1]}`, `quan ${m[1]}`);
        if (it.kind === 'tinh') extra.push('tinh', 'di tinh');
        return Object.assign({}, it, { label: priceLabelOf(it), search: removeAccents([it.district, it.ward, it.area, ...extra].join(' ')).replace(/[.,;()]/g, ' ') });
      });
    }
    let priceSetWatched = false;
    function loadPriceList() {
      return Promise.all(Object.entries(PRICE_SETS).map(([k, v]) =>
        fetch(v.file, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null).then(d => { priceSetsData[k] = preparePriceItems(d); })
      )).then(() => {
        priceById = {};
        Object.values(priceSetsData).forEach(list => list.forEach(it => { priceById[it.id] = it; }));
        applyPriceSet();
        if (!priceSetWatched) {
          priceSetWatched = true;
          dbRef('meta/priceSet').on('value', s => { activePriceSet = s.val() === 'cu' ? 'cu' : 'moi'; applyPriceSet(); }, () => {});
          dbRef('meta/discountLimit').on('value', s => {
            const v = s.val() || {};
            ['noi', 'ngoai'].forEach(z => { const n = Number(v[z]); DISCOUNT_LIMIT[z] = (isFinite(n) && n >= 0 && n <= 100 && v[z] !== null && v[z] !== undefined && v[z] !== '') ? n / 100 : DISCOUNT_LIMIT_DEFAULT[z]; });
            applyPriceSet();
          }, () => {});
        }
      });
    }
    function applyPriceSet() {
      priceItems = (priceSetsData[activePriceSet] && priceSetsData[activePriceSet].length) ? priceSetsData[activePriceSet] : (priceSetsData.moi || []);
      inferCache.clear();
      renderPriceSetSwitch();
      if (isManager()) { updateManagerAuditTable(); renderReminderBox(); }
    }
    // Nút chọn bảng giá (Trang Quản Lý)
    function renderPriceSetSwitch() {
      const el = document.getElementById('price-set-switch');
      if (!el) return;
      const b = (k) => `<button onclick="choosePriceSet('${k}')" class="px-3 py-1.5 rounded-lg font-extrabold ${activePriceSet === k ? 'bg-blue-600 text-white shadow' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-100'}">${activePriceSet === k ? '✔ ' : ''}${PRICE_SETS[k].label}</button>`;
      el.innerHTML = `<span class="font-extrabold text-slate-700">💲 Bảng giá đang áp dụng:</span> ${b('moi')} ${b('cu')}
        <span class="text-[11px] text-slate-500">(${(priceSetsData[activePriceSet] || []).length} mục — áp cho cả công ty: tự điền giá & lọc giảm giá vượt mức)</span>
        <span class="basis-full h-0"></span>
        <span class="font-extrabold text-slate-700">✂️ Mức giảm tối đa cho phép:</span>
        <label class="flex items-center gap-1 font-bold text-slate-600">Nội thành <input id="dl-noi" type="number" min="0" max="100" step="0.5" value="${Math.round(DISCOUNT_LIMIT.noi * 1000) / 10}" class="w-16 p-1 border border-slate-300 rounded-lg text-center font-extrabold text-blue-700"> %</label>
        <label class="flex items-center gap-1 font-bold text-slate-600">Ngoại thành <input id="dl-ngoai" type="number" min="0" max="100" step="0.5" value="${Math.round(DISCOUNT_LIMIT.ngoai * 1000) / 10}" class="w-16 p-1 border border-slate-300 rounded-lg text-center font-extrabold text-blue-700"> %</label>
        <button onclick="saveDiscountLimit()" class="px-3 py-1.5 rounded-lg font-extrabold bg-emerald-600 text-white hover:bg-emerald-700 shadow">💾 Lưu mức %</button>
        <span class="text-[11px] text-slate-500">(áp cho cả công ty, tính lại ngay cả đơn cũ khi lọc; không đổi tiền đơn)</span>`;
    }
    function saveDiscountLimit() {
      if (!isManager()) return;

    // Tìm mục bảng giá theo chữ gõ: so từng từ (số phải khớp nguyên số: "10" không khớp "100");
    // "quận 10" / "q10" thì chỉ lấy đúng Quận 10.
    function findPriceMatches(text, limit) {
      let q = removeAccents(String(text || '').trim()).replace(/[.,;()\-–]/g, ' ');
      if (q.replace(/\s/g, '').length < 2) return [];
      let wantDistrict = null;
      q = q.replace(/\b(?:quan|q)\s*(\d{1,2})\b/g, (m, n) => { wantDistrict = 'quận ' + Number(n); return ' '; });
      q = q.replace(/\b(?:phuong|p|f)\s*(\d{1,2})\b/g, (m, n) => ` phuong ${Number(n)} `);
      // Bỏ chữ chung ("phường", "xã", "quận", "đường"...) nếu không kèm số -> "phường hiệp bình" khớp "P. Hiệp Bình"
      const STOP = ['phuong', 'p', 'xa', 'quan', 'q', 'huyen', 'tp', 'tt'];
      const tokens = q.replace(/\bphuong (\d+)\b/g, 'phuong_$1').split(/\s+/).filter(Boolean)
        .filter(tk => !STOP.includes(tk)).map(tk => tk.startsWith('phuong_') ? tk.slice(7) : tk);
      if (!tokens.length && !wantDistrict) return [];
      const hits = priceItems.filter(it => {
        if (wantDistrict && removeAccents(it.district) !== removeAccents(wantDistrict)) return false;
        const words = it.search.split(/\s+/);
        return tokens.every(tk => /^\d+$/.test(tk) ? words.includes(tk) : words.some(w => w.startsWith(tk)));
      });
      // Chữ gõ trùng đúng tên quận/huyện/tỉnh (vd "Bình Thạnh", "Bình Dương") -> chỉ lấy khu vực đó
      const inDistrict = hits.filter(it => { const dw = removeAccents(it.district).split(/\s+/); return tokens.length && tokens.every(tk => dw.includes(tk)); });
      return (inDistrict.length ? inDistrict : hits).slice(0, limit || 6);
    }

    function destKeys() {
      if (destKeyCache && destKeySrc === priceItems) return destKeyCache;
      const list = HCM_DISTRICT_NAMES.concat(PROVINCE_EXTRA, LANDMARKS, VN_PLACES.split('|'),
        priceItems.filter(it => it.kind === 'tinh').flatMap(it => String(it.district).split(/\s*-\s*/)));
      destKeyCache = [...new Set(list.map(canonWords).filter(k => k.trim().length >= 2 && !PLACE_EXCLUDE.includes(k)))];

    function destHasDistrict(dest, priceId, payMethod) {
      if (priceId) return true;   // chọn từ bảng giá -> đã có Quận/tỉnh
      if (payMethod && paymentCategory({ paymentMethod: payMethod, role: 'pos' }) === 'FREE') return true;   // Free nội bộ: không bắt
      const t = canonWords(dest).replace(/ xa lo ha noi /g, ' ');   // đường Xa lộ Hà Nội không phải đi Hà Nội
      if (/ (?:q|quan|district) ?(?:0?[1-9]|1[0-2]) /.test(t)) return true;   // Q1, Q.01, Quận 3, District 7
      if (/(^|[\s,.;(-])huế($|[\s,.;)-])/i.test(String(dest || '').normalize('NFC'))) return true;   // Huế (phải có dấu, tránh "Nguyễn Huệ")
      const words = t.trim().split(' ');
      if (words.some(w => DISTRICT_ABBR.includes(w))) return true;
      if (DEST_EXEMPT.some(k => t.startsWith(' ' + k + ' '))) return true;   // chỉ khi đứng đầu (vd: Hủy chuyến, Về bãi) — tránh tên đường như Hà Huy Giáp

    // Áp bảng giá cho Bán vé (quầy) và Team Kế hoạch (kể cả đơn đối tác). Không xét: đơn Chủ xe, đơn Free nội bộ, đơn không có giá bảng.
    const PRICE_ROLES = ['pos', 'plan', 'plan2'];
    function usesPriceList() { return !!(loggedInUser && PRICE_ROLES.includes(loggedInUser.role)); }
    // Đơn cũ (nhập trước khi có bảng giá) hoặc gõ tay không chọn gợi ý: suy ra giá bảng từ điểm đến + loại xe.
    // Khớp 1 khu vực -> giá đó; khớp nhiều khu vực -> lấy GIÁ THẤP NHẤT (không bắt lỗi oan). Không khớp -> không xét.
    const inferCache = new Map();
    function inferListPrice(t) {
      if (!priceItems.length || !t.destination) return null;
      const key = `${t.destination}|${t.carType}`;
      if (inferCache.has(key)) return inferCache.get(key);
      let hits = findPriceMatches(t.destination, 60);
      if (!hits.length) hits = wardPriceMatches(t.destination);   // địa chỉ kiểu mới: "số nhà, đường, Phường mới"

      let res = null;
      const priced = hits.map(it => ({ it, p: priceForItem(it, t.carType) })).filter(x => x.p);
      if (priced.length) {
        const min = priced.reduce((a, b) => (b.p < a.p ? b : a));
        const anyNgoai = priced.some(x => x.it.zone === 'ngoai');
        res = { listPrice: min.p, priceZone: anyNgoai ? 'ngoai' : min.it.zone, priceLabel: priced.length === 1 ? min.it.label : `${min.it.label} (thấp nhất trong ${priced.length} khu vực khớp)`, inferred: true };
      }
      inferCache.set(key, res);
      return res;
    }
    function discountInfo(t0) {
      let t = t0;
      if (!Number(t.listPrice || 0) && PRICE_ROLES.includes(t.role)) {
        const inf = inferListPrice(t);
        if (inf) t = Object.assign({}, t0, inf);
      }
      const list = Number(t.listPrice || 0);
      if (!list || !PRICE_ROLES.includes(t.role)) return null;
      if (paymentCategory(Object.assign({}, t, { role: 'pos' })) === 'FREE') return null;
      const fare = Number(t.originalTotalFare != null ? t.originalTotalFare : t.totalFare) || 0;
      const zone = t.priceZone === 'ngoai' ? 'ngoai' : 'noi';
      const limit = DISCOUNT_LIMIT[zone];
      const pct = (list - fare) / list;
      return { list, fare, zone, limit, pct, over: pct > limit + 1e-9, inferred: !!t.inferred, label: t.priceLabel || '' };
    }
    function discountText(d) {
      if (!d) return '';
      const est = d.inferred ? ' (ước tính)' : '';
      if (d.pct <= 0) return `Giá bảng${est} ${fmtMoney(d.list)}`;
      return `Giá bảng${est} ${fmtMoney(d.list)} • giảm ${(d.pct * 100).toFixed(1).replace('.0', '')}%` + (d.over ? ` > ${pctText(d.limit)} ${ZONE_LABEL[d.zone]}` : '');
    }

    // --- Ô nhập hàng loạt: gắn mục bảng giá cho dòng i, tự điền giá theo loại xe ---
    function rowPriceItem(i) {
      const d = document.getElementById(`d-${i}`);
      if (!d) return null;
      if (d.dataset.priceId && ((d.dataset.priceLabel && !d.value.includes(d.dataset.priceLabel)) || (d.dataset.priceAuto && d.value !== d.dataset.priceAuto))) {
        delete d.dataset.priceId; delete d.dataset.priceLabel; delete d.dataset.priceAuto;
      }
      return d.dataset.priceId ? priceById[d.dataset.priceId] || null : null;
    }
    function applyRowPrice(i) {
      if (!usesPriceList()) return;
      const it = rowPriceItem(i);
      const f = document.getElementById(`f-${i}`);
      const c = document.getElementById(`c-${i}`);
      if (it && f && c) {
        const p = priceForItem(it, c.value);
        if (p && (!f.value.trim() || f.dataset.auto === '1')) { f.value = fmtMoney(p); f.dataset.auto = '1'; }
      }
      updateRowPriceHint(i);
    }
    function updateRowPriceHint(i) {
      const h = document.getElementById(`fh-${i}`);
      if (!h) return;
      if (!usesPriceList() || SILENT_DISCOUNT_WATCH) { h.innerHTML = ''; return; }
      const it = rowPriceItem(i);
      const c = document.getElementById(`c-${i}`), f = document.getElementById(`f-${i}`), m = document.getElementById(`m-${i}`);
      if (!it) { h.innerHTML = ''; return; }
      const list = priceForItem(it, c ? c.value : '');
      if (!list) { h.innerHTML = `<span class="text-amber-700">Bảng giá chưa có giá cho ${escHtml(c ? c.value : '')}</span>`; return; }
      const fare = parseFloat((f ? f.value : '').replace(/[^0-9]/g, '')) || 0;
      const d = discountInfo({ role: loggedInUser.role, listPrice: list, totalFare: fare, priceZone: it.zone, paymentMethod: m ? m.value : '' });
      if (!d) { h.innerHTML = `<span class="text-slate-500">Giá bảng ${fmtMoney(list)}</span>`; return; }
      h.innerHTML = d.over
        ? `<span class="text-rose-600 font-extrabold">⚠️ ${escHtml(discountText(d))} — vượt mức, Quản lý sẽ thấy</span>`
        : `<span class="${d.pct > 0 ? 'text-amber-700' : 'text-emerald-700'} font-bold">${escHtml(discountText(d))}</span>`;
    }
    // Gõ tay (không bấm chọn gợi ý) mà chỉ khớp đúng 1 mục bảng giá -> tự gắn
    function autoMatchRowPrice(i) {
      if (!usesPriceList()) return;
      const d = document.getElementById(`d-${i}`);
      if (!d || !d.value.trim() || rowPriceItem(i)) { updateRowPriceHint(i); return; }
      let hits = findPriceMatches(d.value, 2);
      if (!hits.length) hits = wardPriceMatches(d.value);   // địa chỉ kiểu mới -> nhận theo phường (chỉ khi đúng 1 mục)
      if (hits.length === 1) { attachPriceToInput(d, hits[0]); d.dataset.priceLabel = ''; d.dataset.priceAuto = d.value; }
      applyRowPrice(i);
    }
    // Ô sửa đơn (nhân viên Bán vé): hiện giá bảng và mức giảm
    function applyEditModalPrice() {
      const h = document.getElementById('edit-modal-price-hint');

      const fare = editModalFullFare();

    }
    // Đơn chia tiền (vd "-1/2"): so giá bảng với tổng tiền cả đơn
    function splitCountOf(ticket) { const m = /-(\d+)\/(\d+)$/.exec(String(ticket || '')); return m ? Number(m[2]) : 1; }
    function editModalFullFare() {
      const f = parseFloat(((document.getElementById('edit-modal-fare') || {}).value || '').replace(/[^0-9]/g, '')) || 0;
      return f * splitCountOf((document.getElementById('edit-modal-ticket') || {}).value);
    }

    function onRowFareInput(i) { const f = document.getElementById(`f-${i}`); if (f) f.dataset.auto = '0'; }

    // Gợi ý điểm đến: Bán vé thấy mục BẢNG GIÁ (📋, có giá) trước, sau đó là địa chỉ hay đi (📍)
    function showDestSuggestions(input, dropId, rowIdx) {
      const drop = document.getElementById(dropId);
      if (!drop) return;
      if (rowIdx != null) { rowPriceItem(rowIdx); updateRowPriceHint(rowIdx); }
      const priceHits = usesPriceList() ? findPriceMatches(input.value, 6) : [];
      if (!priceHits.length) { showPlaceSuggestions(input, dropId); return; }
      const carSel = rowIdx != null ? document.getElementById(`c-${rowIdx}`) : document.getElementById('edit-modal-cartype');
      const car = carSel ? carSel.value : '';
      const raw = input.value.trim();
      const q = removeAccents(raw);
      const tokens = q.split(/[\s,]+/).filter(Boolean);
      const places = q.length < 2 ? [] : placeCandidates().filter(p => tokens.every(tk => removeAccents(p.name).includes(tk)))
        .sort((a, b) => b.n - a.n).slice(0, 4).map(p => p.name).filter(n => n !== raw);
      const items = [
        ...priceHits.map(it => ({ v: it.label, pid: it.id, html: `📋 ${escHtml(it.label)} <span class="text-emerald-700 font-extrabold">${priceForItem(it, car) ? fmtMoney(priceForItem(it, car)) : '(chưa có giá xe này)'}</span>` })),
        ...places.map(n => ({ v: n, pid: '', html: `📍 ${escHtml(n)}` }))
      ];
      drop.innerHTML = `<div class="local-dropdown" style="max-height:260px">${items.map((x, k) => `
        <div class="local-item${k === 0 ? ' bg-blue-50' : ''}" data-target="${escHtml(input.id)}" data-drop="${escHtml(dropId)}" data-v="${escHtml(x.v)}" data-pid="${escHtml(x.pid)}" data-row="${rowIdx == null ? '' : rowIdx}" onmousedown="event.preventDefault(); pickSuggest(this)">${x.html}</div>
      `).join('')}</div>`;
    }
    function attachPriceToInput(inp, it) {
      if (!inp) return;
      if (it) { inp.dataset.priceId = it.id; inp.dataset.priceLabel = it.label; }
      else { delete inp.dataset.priceId; delete inp.dataset.priceLabel; }
    }

    function showStaffSuggestions(input, dropId) {
      const q = removeAccents(input.value.trim());
      if (!q) { renderSuggestBox(input, dropId, [], ''); return; }
      const matches = staffOptions.filter(name => removeAccents(name).includes(q)).slice(0, 10);
      renderSuggestBox(input, dropId, matches, '👤');
    }

    function showPlaceSuggestions(input, dropId) {
      const raw = input.value.trim();
      const q = removeAccents(raw);
      if (q.length < 2) { renderSuggestBox(input, dropId, [], ''); return; }
      const tokens = q.split(/[\s,]+/).filter(Boolean);
      const scored = placeCandidates().map(p => {
        const n = removeAccents(p.name);
        if (!tokens.every(tk => n.includes(tk))) return null;
        const starts = n.startsWith(q) ? 2 : (n.includes(q) ? 1 : 0);
        return { name: p.name, score: starts * 100000 + p.n };
      }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 8).map(x => x.name);
      renderSuggestBox(input, dropId, scored.filter(nm => nm !== raw), '📍');
    }

    async function executeChangeOwnPassword() {
      const o = document.getElementById('own-old').value.trim();

      if (!n) { setModalBusy('ownpw-modal', false, 'Vui lòng nhập mật khẩu mới!'); return; }

    function canDeleteTrip(tripTimestamp) {
      if (!tripTimestamp) return true;
      const now = Date.now();
      const tripDate = new Date(tripTimestamp);
      const limitDate = new Date(tripDate.getFullYear(), tripDate.getMonth(), tripDate.getDate() + 1, lockHourSetting, 0, 0);
      return now < limitDate.getTime();
    }

    function normalizeDateInput(rawDate) {
      if (!rawDate) return '';
      rawDate = String(rawDate).trim();
      // Ngày gõ thiếu dấu "/" (vd "01/112026", "01112026") -> "01/11/2026"
      const digits = rawDate.replace(/\D/g, '');
      if (digits.length === 8 && !/^\d{4}-/.test(rawDate) && (rawDate.split('/').length !== 3 || rawDate.split('/')[2].length !== 4)) {
        return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      }
      if (rawDate.includes('-')) {
        const p = rawDate.split('-');
        if (p.length === 3) {
          return `${String(p[2]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${p[0]}`;
        }
      } else if (rawDate.includes('/')) {
        const p = rawDate.split('/');
        if (p.length === 3) {
          return `${String(p[0]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${p[2]}`;
        }
      }
      return rawDate;
    }

    function isValidDateStr(d) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d || '');
      if (!m) return false;
      const dt = new Date(+m[3], +m[2] - 1, +m[1]);
      return dt.getFullYear() === +m[3] && dt.getMonth() === +m[2] - 1 && dt.getDate() === +m[1] && +m[3] >= 2020 && +m[3] <= 2100;
    }

    // ĐẾM SỐ ĐƠN (BILL): đơn chia tiền cho nhiều nhân sự ("105282-1/2", "105282-2/2") vẫn là 1 bill.
    // Một bill = cùng số phiếu gốc + biển số + ngày + cùng phía (Bán vé/KH hoặc Chủ xe).
    function billKey(t) {
      const side = t.role === 'driver' ? 'D' : 'P';
      const tk = String(t.originalTicket || baseTicketOf(t.ticketNumber) || t.id || '').replace(/\s+/g, '').toUpperCase();
      return `${side}|${tk}|${normalizePlate(t.plateNumber)}|${tripDateKey(t)}`;
    }
    function countBills(trips) { return new Set(trips.map(billKey)).size; }
    // "1 đơn (2 dòng chia tiền)" khi có đơn chia đôi, ngược lại "3 đơn"
    function billCountText(trips) {
      const b = countBills(trips);
      return b === trips.length ? `${b} đơn` : `${b} đơn (${trips.length} dòng chia tiền)`;
    }

    // Số phiếu hiển thị (10/11, người dùng yêu cầu): đơn 1 người -> "113625-1/1"; đơn chia tiền giữ "113625-1/2", "113625-2/2".
    // Chỉ đổi cách HIỂN THỊ / XUẤT EXCEL, không đổi dữ liệu đã lưu (ghép cặp vẫn theo số phiếu gốc).
    function formatDisplayTicket(ticketStr) {
      const s = String(ticketStr == null ? '' : ticketStr).trim();
      if (!s) return '';
      return /-\d+[\/-]\d+$/.test(s) ? s : s + '-1/1';
    }

    function sortTripsByDateAndTime(trips) {
      return trips.sort((a, b) => {
        let normA = normalizeDateInput(a.dateStr);
        let normB = normalizeDateInput(b.dateStr);
        let dateA_parts = normA.split('/');
        let dateB_parts = normB.split('/');

        if (dateA_parts.length === 3 && dateB_parts.length === 3) {
          let numA = parseInt(dateA_parts[2] + dateA_parts[1] + dateA_parts[0], 10);
          let numB = parseInt(dateB_parts[2] + dateB_parts[1] + dateB_parts[0], 10);
          
          if (numA !== numB) {
            return numB - numA;
          }
        }

        let tA = (a.timeStr || '').replace(':', '');
        let tB = (b.timeStr || '').replace(':', '');
        let numTA = parseInt(tA, 10) || 0;
        let numTB = parseInt(tB, 10) || 0;

        if (numTA !== numTB) {
          return numTB - numTA; 
        }

        return (b.timestamp || 0) - (a.timestamp || 0);
      });
    }

    function updatePersonalSummary(role) {
      if (!loggedInUser || loggedInUser.role === 'manager') return;

      const sumDateInp = document.getElementById('summary-date-picker');
      let targetDateStr = '';
      if (sumDateInp && sumDateInp.value) {
        const parts = sumDateInp.value.split('-');
        if (parts.length === 3) {
          targetDateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

      if (sumDateInp && sumDateInp.value) ensureStaffDate(sumDateInp.value);
      const selectedItems = personalTrips.filter(t => {
        if (!targetDateStr) return true;
        return normalizeDateInput(t.dateStr) === normalizeDateInput(targetDateStr);
      });

      const totalSum = selectedItems.reduce((acc, t) => acc + (Number(t.totalFare) || 0), 0);

      // KIỂM TRA MỐC 2.ỆU TRIỆU CHO TỪNG NHÂN SỰ TRONG NGÀY
      if (targetDateStr && totalSum > 2000000) {
        // Gom nhóm doanh thu theo từng tên nhân sự đầy đủ xuất hiện trong ngày
        let staffRevenueMap = {};
        selectedItems.forEach(t => {
          const sName = (t.staff || '').trim();
          if (sName) {
            staffRevenueMap[sName] = (staffRevenueMap[sName] || 0) + (Number(t.totalFare) || 0);
          }
        });

        Object.entries(staffRevenueMap).forEach(([staffName, sTotal]) => {
          if (sTotal > 2000000) {
            const celebKey = `${staffName}_${targetDateStr}`;
            if (!celebratedStaffToday[celebKey]) {
              celebratedStaffToday[celebKey] = true;
              showStaffCelebrationModal(staffName, sTotal, targetDateStr);
            }
          }
        });
      }

      const activePayments = payListFor(role);
      
      let methodSums = {};
      activePayments.forEach(opt => methodSums[opt] = 0);

      selectedItems.forEach(t => {
        const fare = Number(t.totalFare || 0);
        const method = t.paymentMethod || activePayments[0];
        if (methodSums[method] !== undefined) {
          methodSums[method] += fare;
        } else {
          methodSums[activePayments[0]] = (methodSums[activePayments[0]] || 0) + fare;
        }
      });

      const container = document.getElementById('summary-cards-container');
      if (!container) return;

      let cardsHtml = `
        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl shadow-sm sm:col-span-1">
          <div class="text-[10px] font-bold uppercase text-emerald-600">Tổng Tiền Ngày Này</div>
          <div id="personal-sum" class="text-lg sm:text-xl font-extrabold text-emerald-800 mt-1">${totalSum.toLocaleString('vi-VN')} ₫</div>
          <div id="personal-count" class="text-[11px] text-slate-500 mt-0.5">${billCountText(selectedItems)}</div>
        </div>
      `;

      const colors = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-indigo-50 border-indigo-200 text-indigo-800', 'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800', 'bg-rose-50 border-rose-200 text-rose-800'];
      activePayments.forEach((opt, idx) => {
        const cls = colors[idx % colors.length];
        cardsHtml += `
          <div class="${cls} border p-3.5 rounded-2xl shadow-sm">
            <div class="text-[10px] font-bold uppercase opacity-80">${escHtml(opt)}</div>
            <div class="text-base font-extrabold mt-1">${(methodSums[opt] || 0).toLocaleString('vi-VN')} ₫</div>
          </div>
        `;
      });

      container.innerHTML = cardsHtml;
    }

    function renderActiveWorksheetTrips(role) {
      const tb = document.getElementById('tbody-personal-trips');
      if (!tb || !loggedInUser) return;

      const dateInp = document.getElementById('filter-history-date');
      let targetDateStr = '';
      if (dateInp && dateInp.value) {
        const parts = dateInp.value.split('-');
        if (parts.length === 3) {
          targetDateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

      if (dateInp && dateInp.value) ensureStaffDate(dateInp.value);
      const filteredTrips = personalTrips.filter(t => {
        if (!targetDateStr) return true;
        return normalizeDateInput(t.dateStr) === normalizeDateInput(targetDateStr);
      });

      if (filteredTrips.length === 0) {
        tb.innerHTML = `<tr><td colspan="14" class="p-4 text-center text-slate-400">Không có đơn hàng nào vào ngày ${targetDateStr || 'này'}.</td></tr>`;

    function saveEditedTrip(id, role) {
      const trip = personalTrips.find(x => x.id === id);
      if (!trip) return;
      const before = Object.assign({}, trip);   // để ghi nhật ký sửa

      const rawDate = document.getElementById('edit-modal-date').value;
      const formattedDate = normalizeDateInput(rawDate);
      const ticket = document.getElementById('edit-modal-ticket').value.trim();
      const plate = document.getElementById('edit-modal-plate').value.trim().toUpperCase();
      const staff = document.getElementById('edit-modal-staff').value.trim();
      const carType = document.getElementById('edit-modal-cartype').value;
      const source = document.getElementById('edit-modal-source').value;
      const pickup = document.getElementById('edit-modal-pickup').value;
      const destination = document.getElementById('edit-modal-dest').value.trim();
      const totalFare = parseFloat(document.getElementById('edit-modal-fare').value.replace(/[^0-9]/g, '')) || 0;
      const paymentMethod = document.getElementById('edit-modal-payment').value;
      const note = document.getElementById('edit-modal-note').value.trim();

      if (!ticket || (!plate && !plateOptional(trip.role)) || !destination || !staff) {
        alert(plateOptional(trip.role) ? "Vui lòng điền đầy đủ Số Phiếu, Nhân Sự và Điểm Đến!" : "Vui lòng điền đầy đủ Số Phiếu, Biển Số, Nhân Sự và Điểm Đến!");
        return;
      }
      if (usesPriceList() && destination !== String(trip.destination || '').trim()) {
        const dEl = document.getElementById('edit-modal-dest');
        if (!destHasDistrict(destination, dEl && dEl.dataset.priceId && priceById[dEl.dataset.priceId] ? dEl.dataset.priceId : '', paymentMethod)) {
          showDestFixModal([{ label: 'đơn đang sửa', dest: destination }]);
          return;
        }
      }

      trip.dateStr = formattedDate;
      trip.dateKey = tripDateKey({ dateStr: formattedDate });
      trip.ticketNumber = ticket;
      trip.originalTicket = baseTicketOf(ticket);
      trip.plateNumber = plate;
      trip.staff = staff;
      trip.carType = carType;
      trip.source = source;
      trip.pickup = pickup;
      trip.destination = destination;
      trip.totalFare = totalFare;
      trip.paymentMethod = paymentMethod;
      trip.note = note;
      // Giá bảng theo điểm đến + loại xe hiện tại (Bán vé / Kế hoạch)
      if (usesPriceList()) {
        const dEl = document.getElementById('edit-modal-dest');
        const it = dEl && dEl.dataset.priceId ? priceById[dEl.dataset.priceId] : null;
        const list = priceForItem(it, carType);
        if (it && list) Object.assign(trip, { priceId: it.id, priceLabel: it.label, listPrice: list, priceZone: it.zone, priceSet: it.id.startsWith('BGC') ? 'cu' : 'moi' });
        else { delete trip.priceId; delete trip.priceLabel; delete trip.listPrice; delete trip.priceZone; delete trip.priceSet; }
        const n = splitCountOf(ticket);
        if (n > 1 && trip.originalTotalFare != null) trip.originalTotalFare = totalFare * n;
      }

      let updates = {};
      updates[`users_trips/${loggedInUser.user}/${id}`] = trip;
      updates[`trips/${id}`] = trip;

      dbRoot().update(updates).then(() => {
        const ch = changeText(before, trip);
        if (ch) logTrips('edit', [trip], () => ch);
        alert("Đã cập nhật đơn hàng thành công!");
        document.getElementById('edit-trip-modal').remove();
        updatePersonalSummary(role);
        renderActiveWorksheetTrips(role);
      }).catch(err => {
        alert("Lỗi khi cập nhật: " + err.message);
      });
    }

    function toggleSelectAllPersonal(masterCheckbox) {
      const checkboxes = document.querySelectorAll('.personal-trip-checkbox');
      checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
    }

    function deleteSelectedPersonalTrips() {
      const checkboxes = document.querySelectorAll('.personal-trip-checkbox:checked');
      if (checkboxes.length === 0) { alert("Vui lòng tích chọn ít nhất một đơn hàng để xóa!"); return; }

      if (confirm(`Bạn có chắc chắn muốn xóa ${checkboxes.length} đơn hàng đã chọn không?`)) {
        let updates = {};
        let deletedList = [];
        checkboxes.forEach(cb => {
          const id = cb.value;
          const trip = personalTrips.find(x => x.id === id);
          if (trip && canDeleteTrip(trip.timestamp)) {
            deletedList.push(trip);
          }
        });
        if (!deletedList.length) { alert('Các đơn đã chọn đã bị khóa, không xóa được.'); return; }

        deleteTripsSafe(deletedList).then(() => {
          lastDeletedTripBackup = deletedList;
          showUndoButton(`Đã xóa ${deletedList.length} đơn hàng!`);
        }).catch(err => alert("Lỗi khi xóa: " + err.message));
      }
    }

    function deletePersonalTrip(id) {
      if (!loggedInUser) return;
      
      dbRef(`users_trips/${loggedInUser.user}/${id}`).once('value', snap => {
        const trip = snap.val();
        
        if (trip && !canDeleteTrip(trip.timestamp)) {
          alert(`Đã quá giờ quy định của ngày hôm sau, đơn hàng đã bị khóa và không thể xóa!`);
          return;
        }

        if (confirm("Vui lòng xác nhận xóa đơn hàng này?")) {
          deleteTripsSafe([trip || { id, createdBy: loggedInUser.user }]).then(() => {
            lastDeletedTripBackup = [trip || { id }];
            showUndoButton("Đã xóa đơn hàng!");
          }).catch(err => {
            alert("Lỗi khi xóa: " + err.message);
          });
        }
      });
    }

    // ===== NHẬT KÝ & THÙNG RÁC (11/11) =====
    // trip_log/<pushId> = {at, by, action, tripId, owner, ticket, plate, dateStr, detail}: chỉ THÊM, không ai sửa/xóa được (quy tắc).
    // trash/<id>_<ms> = bản sao đầy đủ của đơn bị xóa + deletedAt, deletedBy. Quản lý xem & khôi phục.
    function tripLogEntry(action, t, detail) {
      return { at: firebase.database.ServerValue.TIMESTAMP, by: loggedInUser ? loggedInUser.user : '', action,
        tripId: t.id || '', owner: t.createdBy || '', ticket: String(t.ticketNumber || ''), plate: String(t.plateNumber || ''),
        dateStr: String(t.dateStr || ''), fare: Number(t.totalFare || 0), detail: String(detail || '').slice(0, 500) };
    }
    // Ghi nhật ký riêng (không chặn việc chính nếu lỗi)
    function logTrips(action, trips, detailFn) {
      if (!loggedInUser || !trips || !trips.length) return;
      const upd = {};
      trips.forEach(t => { upd['trip_log/' + dbRef('trip_log').push().key] = tripLogEntry(action, t, detailFn ? detailFn(t) : ''); });
      dbRoot().update(upd).catch(e => console.warn('trip_log', e && e.message));
    }
    // Mô tả thay đổi: "Ngày: 10/11/2026 → 11/11/2026; Tiền: 300.000 → 350.000"
    const LOG_FIELDS = { dateStr: 'Ngày', timeStr: 'Giờ', ticketNumber: 'Số phiếu', plateNumber: 'Biển số', staff: 'Nhân sự', carType: 'Loại xe', source: 'Nguồn', pickup: 'Điểm đón', destination: 'Điểm đến', paymentMethod: 'Thanh toán', note: 'Ghi chú', totalFare: 'Tiền' };
    function changeText(before, after) {
      const fmt = (k, v) => k === 'totalFare' ? Number(v || 0).toLocaleString('vi-VN') : String(v == null || v === '' ? '(trống)' : v);
      return Object.keys(LOG_FIELDS).filter(k => k in after && String(before[k] == null ? '' : before[k]) !== String(after[k] == null ? '' : after[k]))
        .map(k => `${LOG_FIELDS[k]}: ${fmt(k, before[k])} → ${fmt(k, after[k])}`).join('; ');
    }
    // XÓA ĐƠN: cùng 1 lần ghi -> xóa ở trips + users_trips, chép vào thùng rác, ghi nhật ký.
    // Nếu quy tắc Firebase chưa cập nhật (chưa có trash/trip_log) -> xóa như cũ để không chặn công việc.
    async function deleteTripsSafe(trips) {
      const by = loggedInUser.user, at = firebase.database.ServerValue.TIMESTAMP, now = Date.now();
      const base = {}, extra = {};
      trips.forEach((t, i) => {
        base[`trips/${t.id}`] = null;
        const owner = t.createdBy || (isManager() ? '' : by);
        if (owner) base[`users_trips/${owner}/${t.id}`] = null;
        extra[`trash/${t.id}_${now + i}`] = Object.assign({}, t, { deletedAt: at, deletedBy: by });
        extra['trip_log/' + dbRef('trip_log').push().key] = tripLogEntry('delete', t, `Xóa đơn ${formatDisplayTicket(t.ticketNumber)} • ${t.destination || ''} • ${Number(t.totalFare || 0).toLocaleString('vi-VN')}đ`);
      });
      try {
        await dbRoot().update(Object.assign({}, base, extra));
        return true;
      } catch (e) {
        console.warn('Thùng rác chưa sẵn sàng (quy tắc cũ?)', e && e.message);
        await dbRoot().update(base);
        return false;
      }
    }

    // ----- Màn hình Quản lý: Nhật ký & Thùng rác -----
    let logTrashTab = 'log', logItems = [], trashItems = [], logLimit = 1500;
    const LOG_ACTION = {
      create: ['➕ Nhập mới', 'bg-emerald-100 text-emerald-800'],
      edit: ['✏️ Sửa', 'bg-blue-100 text-blue-800'],
      delete: ['🗑️ Xóa', 'bg-rose-100 text-rose-800'],
      restore: ['♻️ Khôi phục', 'bg-purple-100 text-purple-800']
    };
    function fmtTs(ms) {
      if (!ms) return '';
      const d = new Date(ms), p = n => String(n).padStart(2, '0');
      return `${p(d.getHours())}:${p(d.getMinutes())} ${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
    }
    function openLogTrashModal() {
      const old = document.getElementById('log-trash-modal'); if (old) old.remove();
      document.getElementById('main-container').insertAdjacentHTML('beforeend', `
        <div id="log-trash-modal" class="fixed inset-0 bg-slate-900/85 z-50 flex items-center justify-center p-2 sm:p-3 backdrop-blur-sm">
          <div class="bg-white rounded-3xl shadow-2xl max-w-6xl w-full p-4 sm:p-5 space-y-3 max-h-[94vh] flex flex-col">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b pb-3">
              <h3 class="text-sm font-extrabold text-slate-900 uppercase">🗂️ Nhật Ký Đơn Hàng & Thùng Rác</h3>
              <button onclick="document.getElementById('log-trash-modal').remove()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Đóng</button>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button id="lt-tab-log" onclick="setLogTrashTab('log')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold">📜 Nhật Ký (ai nhập / sửa / xóa)</button>
              <button id="lt-tab-trash" onclick="setLogTrashTab('trash')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold">🗑️ Thùng Rác (đơn đã xóa)</button>
              <input id="lt-search" type="text" autocomplete="off" oninput="renderLogTrash()" placeholder="🔍 Tìm số phiếu, tài khoản, biển số, ngày..." class="px-3 py-1.5 bg-slate-50 border rounded-xl font-bold text-xs flex-1 min-w-[180px]">
            </div>
            <div id="lt-info" class="text-[11px] text-slate-500 font-bold"></div>
            <div class="overflow-auto custom-scrollbar flex-1 border rounded-2xl">
              <table class="w-full text-left border-collapse text-xs">
                <thead id="lt-head" class="bg-slate-800 text-white sticky top-0"></thead>
                <tbody id="lt-body" class="divide-y divide-slate-200"><tr><td class="p-4 text-center text-slate-400">Đang tải...</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>`);
      setLogTrashTab(logTrashTab);
      loadLogTrash();
    }
    function setLogTrashTab(tab) {
      logTrashTab = tab;
      ['log', 'trash'].forEach(t => {
        const b = document.getElementById('lt-tab-' + t);
        if (b) b.className = 'px-3 py-1.5 rounded-xl text-xs font-extrabold ' + (t === tab ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200');
      });
      renderLogTrash();
    }
    async function loadLogTrash() {
      const info = document.getElementById('lt-info');
      try {
        const [ls, ts] = await Promise.all([
          dbRef('trip_log').orderByKey().limitToLast(logLimit).once('value'),
          dbRef('trash').orderByChild('deletedAt').startAt(Date.now() - 90 * 86400000).once('value')
        ]);
        logItems = []; ls.forEach(c => { logItems.push(Object.assign({ _k: c.key }, c.val())); });
        logItems.reverse();
        trashItems = []; ts.forEach(c => { trashItems.push(Object.assign({ _k: c.key }, c.val())); });
        trashItems.reverse();
        renderLogTrash();
      } catch (e) {
        if (info) info.innerHTML = `<span class="text-rose-600">Chưa đọc được nhật ký/thùng rác: ${escHtml(authErrorText(e))}. Có thể quy tắc Firebase chưa được cập nhật (cần dán quy tắc mới và bấm Publish).</span>`;
        const tb = document.getElementById('lt-body'); if (tb) tb.innerHTML = '';
      }
    }
    function logTrashMatch(o, kw) {
      if (!kw) return true;
      const txt = removeAccents([o.ticket, o.ticketNumber, o.plate, o.plateNumber, o.by, o.owner, o.createdBy, o.deletedBy, o.staff, o.dateStr, o.detail, o.destination].join(' '));
      return removeAccents(kw).split(/\s+/).filter(Boolean).every(w => txt.includes(w));
    }
    function renderLogTrash() {
      const head = document.getElementById('lt-head'), tb = document.getElementById('lt-body'), info = document.getElementById('lt-info');
      if (!head || !tb) return;

    async function restoreFromTrash(key) {
      const o = trashItems.find(x => x._k === key);
      if (!o) return;
      if (!confirm(`Khôi phục đơn ${formatDisplayTicket(o.ticketNumber)} (${o.dateStr}, TK ${o.createdBy || '?'})?`)) return;
      try {
        const cur = await dbRef(`trips/${o.id}`).once('value');
        const trip = Object.assign({}, o); delete trip._k; delete trip.deletedAt; delete trip.deletedBy;
        if (!trip.dateKey) trip.dateKey = tripDateKey(trip) || fallbackDateKey(trip);
        const upd = {};
        upd[`trash/${key}`] = null;
        if (!cur.exists()) {
          upd[`trips/${trip.id}`] = trip;
          if (trip.createdBy) upd[`users_trips/${trip.createdBy}/${trip.id}`] = trip;
          upd['trip_log/' + dbRef('trip_log').push().key] = tripLogEntry('restore', trip, `Khôi phục từ thùng rác (xóa bởi ${o.deletedBy || '?'} lúc ${fmtTs(o.deletedAt)})`);
        }
        await dbRoot().update(upd);
        alert(cur.exists() ? 'Đơn này đang có sẵn (đã được khôi phục trước đó) — đã bỏ khỏi thùng rác.' : 'Đã khôi phục đơn!');
        trashItems = trashItems.filter(x => x._k !== key);
        renderLogTrash();
        loadLogTrash();
      } catch (e) { alert('Lỗi khôi phục: ' + authErrorText(e)); }
    }
