<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSS POS - Hệ Thống Điều Xe Sân Bay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: pan-x pan-y; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .local-dropdown { position: absolute; z-index: 999999; background: white; border: 2px solid #2563eb; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto; width: 100%; margin-top: 4px; left: 0; }
    .local-item { padding: 8px 12px; font-size: 11px; font-weight: 700; color: #1e293b; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .local-item:hover { background: #eff6ff; color: #1d4ed8; }
    .inline-edit-input { background: #fff; border: 1px solid #3b82f6; border-radius: 6px; padding: 2px 6px; font-size: 11px; width: 100%; font-weight: 700; }
    
    @keyframes rainbow-border {
      0% { border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }
      33% { border-color: #3b82f6; box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
      66% { border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
      100% { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
    }
    @keyframes bounce-gentle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    .popup-vinh-danh {
      animation: rainbow-border 3s infinite alternate, bounce-gentle 2s infinite ease-in-out;
      border: 3px solid #3b82f6;
    }
  </style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="bg-blue-600 text-white px-4 py-3 flex items-center justify-between shadow-md flex-none z-30">
    <div class="flex items-center space-x-3">
      <span class="font-extrabold text-sm">✈️ TSS POS</span>
      <span id="test-env-badge" class="hidden text-[10px] bg-amber-400 text-slate-900 px-2 py-1 rounded-lg font-extrabold" title="Dữ liệu ở vùng thử nghiệm riêng, không ảnh hưởng dữ liệu thật">🧪 BẢN THỬ</span>
      <span id="header-status" class="text-xs bg-blue-700 px-2.5 py-1 rounded-lg">Màn hình đăng nhập</span>
      <div id="firebase-status-badge" class="px-2.5 py-1 bg-emerald-500 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 transition-all">
        <span id="firebase-dot" class="w-2 h-2 rounded-full bg-white animate-ping"></span>
        <span id="firebase-status-text">🟢 Cloud Đang Kết Nối</span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="logoutSession()" id="btn-logout" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg text-xs font-bold hidden">Đăng Xuất</button>
      <button onclick="openChangeOwnPasswordModal()" id="btn-change-pass" class="px-2.5 py-1.5 bg-blue-500 hover:bg-blue-700 text-white rounded-lg text-xs font-bold hidden">🔑 Đổi Mật Khẩu</button>
      <button onclick="logoutSession()" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-800 text-white rounded-lg text-xs font-bold">Thoát App</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="main-container" class="flex-1 overflow-y-auto p-3 sm:p-6 max-w-7xl mx-auto w-full flex flex-col">
    <!-- Nội dung render động -->
  </main>

  <!-- FLOATING WARNING NOTIFICATION BANNER -->
  <div id="floating-warning-banner" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-amber-500 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-extrabold flex items-center space-x-3 hidden transition-all duration-300">
    <span id="floating-warning-text">⚠️ Cảnh báo trùng lặp đơn hàng!</span>
    <button onclick="document.getElementById('floating-warning-banner').classList.add('hidden')" class="bg-amber-600 hover:bg-amber-700 text-white px-2 py-1 rounded-xl text-[10px]">Đóng</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB9rTrGArG5WUfUMfznab5YjblCv4Amg4M",
      authDomain: "taxi-tss-df1a5.firebaseapp.com",
      databaseURL: "https://taxi-tss-df1a5-default-rtdb.firebaseio.com",
      projectId: "taxi-tss-df1a5",
      storageBucket: "taxi-tss-df1a5.firebasestorage.app",
      messagingSenderId: "487347280845",
      appId: "1:487347280845:web:90ee3c994ae250918ec284"
    };
    firebase.initializeApp(firebaseConfig);
    const rtdb = firebase.database();
    const fbAuth = firebase.auth();

    // ===== MÔI TRƯỜNG: BẢN THỬ dùng vùng dữ liệu riêng "test_env/", BẢN CHÍNH dùng gốc =====
    // Trên nhánh thử nghiệm đặt FORCE_TEST_ENV = true. Trước khi đưa lên bản chính (main) đặt lại = false.
    const FORCE_TEST_ENV = true;
    const IS_TEST_ENV = FORCE_TEST_ENV || /-git-|localhost|127\.0\.0\.1/.test(location.hostname) || location.protocol === 'file:';
    const DB_PREFIX = IS_TEST_ENV ? 'test_env' : '';
    const EMAIL_DOMAIN = IS_TEST_ENV ? 'test.taxi-tss.local' : 'taxi-tss.local';
    function dbRef(path) { return DB_PREFIX ? rtdb.ref(DB_PREFIX + '/' + path) : rtdb.ref(path); }
    function dbRoot() { return DB_PREFIX ? rtdb.ref(DB_PREFIX) : rtdb.ref(); }

    // Tài khoản app (vd TSS01) <-> tài khoản đăng nhập Firebase (email nội bộ, không phải email thật)
    function accountEmail(user, ver) { return `${String(user).toLowerCase()}${ver ? '.v' + ver : ''}@${EMAIL_DOMAIN}`; }
    // Firebase yêu cầu mật khẩu >= 6 ký tự, nên thêm tiền tố cố định để mật khẩu cũ ngắn (vd "123") vẫn dùng được
    function authPassword(pass) { return 'tss-pw:' + pass; }
    function escHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // Tạo tài khoản Firebase mới mà KHÔNG làm người đang đăng nhập (quản lý) bị đăng xuất
    let secondaryApp = null;
    async function createAuthUserFor(user, pass, startVer) {
      if (!secondaryApp) secondaryApp = firebase.initializeApp(firebaseConfig, 'tao-tai-khoan');
      const secAuth = secondaryApp.auth();
      if (secAuth.setPersistence) { try { await secAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {} }
      let ver = startVer || 0;
      for (let tries = 0; tries < 30; tries++, ver++) {
        try {
          const cred = await secAuth.createUserWithEmailAndPassword(accountEmail(user, ver), authPassword(pass));
          const uid = cred.user.uid;
          await secAuth.signOut();
          return { uid, ver };
        } catch (e) {
          if (e && e.code === 'auth/email-already-in-use') continue;
          throw e;
        }
      }
      throw new Error('Không tạo được tài khoản (quá nhiều phiên bản).');
    }

    function authErrorText(e) {
      const c = (e && e.code) || '';
      if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'Tài khoản hoặc mật khẩu không đúng!';
      if (c === 'auth/too-many-requests') return 'Nhập sai quá nhiều lần. Vui lòng đợi vài phút rồi thử lại!';
      if (c === 'auth/network-request-failed') return 'Mất kết nối mạng. Vui lòng kiểm tra Internet!';
      if (c === 'auth/operation-not-allowed') return 'Firebase chưa bật đăng nhập Email/Password. Báo quản trị viên bật trong Firebase > Authentication.';
      if (c === 'auth/weak-password') return 'Mật khẩu quá yếu!';
      if (c === 'PERMISSION_DENIED' || /permission/i.test((e && e.message) || '')) return 'Không có quyền thực hiện thao tác này.';
      return 'Lỗi: ' + ((e && e.message) || e);
    }

    let loggedInUser = null;
    let myUid = null;
    let accountsMap = {};       // accounts/<USER> = {role, active, uid, ver}
    let accountsLoaded = false;
    let legacyAccounts = [];    // settings/accounts cũ (mật khẩu dạng chữ) - chỉ dùng để chuyển đổi 1 lần
    let personalTrips = []; 
    let allCompanyTrips = []; 
    let lastDeletedTripBackup = null;
    let celebratedStaffToday = {}; // Lưu lại nhân viên đã được chúc mừng trong ngày để chỉ hiện 1 lần/ngày
    
    let sourceOptions = ["SQ", "G1", "VTO", "Khách Quầy", "City Tour", "ThanhLong", "JOVIA", "VDT", "MONICA", "NOVEMBER", "STELLAR", "SANNA", "LA SIESTA"];
    let staffOptions = ["Mai Tuấn Khanh", "Nguyễn Văn An", "Trần Thị Tâm", "Lê Văn Liên", "Hoàng Đức Tài", "Lê Chí Bình", "Mẫn"];
    let carTypeOptions = ["Xe 4 Chỗ", "Xe 7 Chỗ", "Xe 16 Chỗ"];
    let paymentOptions = ["Nhân Viên Quầy Thu", "Thẻ", "Kế Hoạch", "Tài Xế Thu"];
    let planPaymentOptions = ["Chuyển Khoản", "Công Nợ", "Tiền Mặt"];
    
    let lockHourSetting = 8; 
    const TERMINAL_OPTIONS = ["T2", "T1", "T3"];
    const ROLE_LABELS = { 'pos': 'Bán Vé (Quầy)', 'driver': 'Cổng Chủ Xe', 'plan': 'Team Kế Hoạch', 'manager': 'Quản Lý' };

    window.addEventListener('DOMContentLoaded', async () => {
      initCloudStatusMonitor();
      if (IS_TEST_ENV) {
        const b = document.getElementById('test-env-badge');
        if (b) b.classList.remove('hidden');
      }
      try { await fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch (e) {}
      let firstCheck = true;
      fbAuth.onAuthStateChanged(async (u) => {
        if (!firstCheck) return;
        firstCheck = false;
        if (u) {
          // Tải lại trang (F5) trong cùng tab: giữ phiên đăng nhập
          try { await enterSessionForUid(u.uid, null); return; } catch (e) { try { await fbAuth.signOut(); } catch (e2) {} }
        }
        renderHomeSelection();
      });
    });

    function isManager() { return !!(loggedInUser && loggedInUser.role === 'manager'); }

    // Sau khi đăng nhập Firebase: kiểm tra quyền trong roles/<uid>, rồi mở đúng màn hình
    async function enterSessionForUid(uid, expectedRole) {
      const snap = await dbRef('roles/' + uid).once('value');
      const r = snap.val();
      if (!r || r.active !== true) throw { code: 'app/inactive' };
      if (expectedRole && r.role !== expectedRole) throw { code: 'app/wrong-role' };
      myUid = uid;
      loggedInUser = { user: r.user, role: r.role };
      // Bị quản lý khóa/xóa tài khoản trong lúc đang dùng -> tự đăng xuất
      dbRef('roles/' + uid).on('value', s => {
        const v = s.val();
        if (loggedInUser && (!v || v.active !== true)) {
          alert('Tài khoản của bạn đã bị khóa hoặc thay đổi. Vui lòng đăng nhập lại!');
          logoutSession();
        }
      }, () => {});
      document.getElementById('btn-logout').classList.remove('hidden');
      document.getElementById('btn-change-pass').classList.remove('hidden');
      await loadCloudSettings();
      if (r.role === 'manager') startManagerSession();
      else startWorkerSession(r.role);
    }

    function initCloudStatusMonitor() {
      const badge = document.getElementById('firebase-status-badge');
      const text = document.getElementById('firebase-status-text');
      const dot = document.getElementById('firebase-dot');

      rtdb.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
          if(badge) badge.className = "px-2.5 py-1 bg-emerald-500 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 transition-all";
          if(text) text.innerText = "🟢 Cloud Đang Kết Nối";
          if(dot) dot.style.display = 'block';
        } else {
          if(badge) badge.className = "px-2.5 py-1 bg-rose-600 text-white text-[10px] font-extrabold rounded-lg shadow-sm flex items-center space-x-1.5 animate-pulse transition-all";
          if(text) text.innerText = "🔴 Mất Kết Nối Cloud";
          if(dot) dot.style.display = 'none';
        }
      });
    }

    // Tải danh mục cấu hình. Trả về Promise xong khi đã nhận lần đầu (để màn hình nhập có đủ danh mục).
    function loadCloudSettings() {
      const toArr = v => Array.isArray(v) ? v.filter(x => x !== null && x !== undefined) : Object.values(v);
      const defs = [
        ['sources', () => sourceOptions, v => { sourceOptions = toArr(v); }, () => renderSourcesTable()],
        ['staff', () => staffOptions, v => { staffOptions = toArr(v); }, () => renderStaffTable()],
        ['carTypes', () => carTypeOptions, v => { carTypeOptions = toArr(v); }, () => renderCarTypesTable()],
        ['payments', () => paymentOptions, v => { paymentOptions = toArr(v); }, () => renderPaymentsTable()],
        ['planPayments', () => planPaymentOptions, v => { planPaymentOptions = toArr(v); }, () => renderPlanPaymentsTable()],
        ['lockHour', () => lockHourSetting, v => {
          lockHourSetting = parseInt(v, 10);
          const inp = document.getElementById('lock-hour-input');
          if (inp) inp.value = lockHourSetting;
        }, null]
      ];
      if (isManager()) {
        dbRef('accounts').on('value', snap => {
          accountsMap = snap.val() || {};
          accountsLoaded = true;
          renderAccountsTable();
        }, () => {});
        dbRef('settings/accounts').on('value', snap => {
          const val = snap.val();
          legacyAccounts = val ? toArr(val).filter(a => a && a.user) : [];
          renderAccountsTable();
        }, () => {});
      }
      return Promise.all(defs.map(([key, getDefault, apply, rerender]) => new Promise(resolve => {
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        dbRef('settings/' + key).on('value', snap => {
          const val = snap.val();
          if (val !== null && val !== undefined) {
            apply(val);
            if (rerender && isManager()) rerender();
          } else if (isManager()) {
            dbRef('settings/' + key).set(getDefault()).catch(() => {});
          }
          finish();
        }, () => finish());
        setTimeout(finish, 8000);
      })));
    }
    function saveLockHour() {
      const inp = document.getElementById('lock-hour-input');
      if (!inp) return;
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val < 0 || val > 23) { alert("Vui lòng nhập giờ hợp lệ từ 0 đến 23!"); return; }
      lockHourSetting = val;
      dbRef('settings/lockHour').set(lockHourSetting).then(() => {
        alert(`Đã cập nhật giờ khóa đơn thành ${lockHourSetting}:00 sáng hôm sau!`);
      });
    }

    function showFloatingWarning(msg) {
      const banner = document.getElementById('floating-warning-banner');
      const text = document.getElementById('floating-warning-text');
      if (banner && text) {
        text.innerText = "⚠️ " + msg;
        banner.classList.remove('hidden');
        setTimeout(() => { banner.classList.add('hidden'); }, 6000);
      }
    }

    function checkAndShowMilestoneCongratModal(staffName, todayTotalAmount, dateStr) {
      if (todayTotalAmount > 2000000) {
        const key = `${staffName}_${dateStr}`;
        if (!notifiedMilestoneStaffs[key]) {
          notifiedMilestoneStaffs[key] = true;
          showMilestoneCongratModal(staffName, todayTotalAmount, dateStr);
        }
      }
    }

    function showMilestoneCongratModal(staffName, amount, dateStr) {
      const existing = document.getElementById('congrat-milestone-modal');
      if (existing) existing.remove();

      const modalHtml = `
        <div id="congrat-milestone-modal" class="fixed inset-0 bg-slate-950/85 z-50 flex items-center justify-center p-4 backdrop-blur-md animate-fadeIn">
          <div class="vinh-danh-card rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl relative">
            <div class="flex items-center justify-center space-x-2 text-2xl">
              <span>🏆</span>
              <span>🎉</span>
              <span>⭐</span>
            </div>
            
            <div class="space-y-1.5">
              <div class="text-[11px] font-extrabold tracking-widest uppercase text-amber-400">✨ VINH DANH XUẤT SẮC ✨</div>
              <h3 class="text-sm font-bold text-slate-300">CHÚNG MỪNG NHÂN SỰ</h3>
              <div class="text-xl sm:text-2xl font-extrabold text-amber-300 tracking-tight">${staffName}</div>
            </div>

            <div class="bg-zinc-900/90 border border-zinc-800 p-4 rounded-2xl space-y-1">
              <div class="text-[11px] font-bold text-slate-400">Đã xuất sắc đạt doanh thu ngày ${dateStr}:</div>
              <div class="text-2xl font-extrabold text-emerald-400">${amount.toLocaleString('vi-VN')} ₫</div>
              <div class="text-[10px] font-bold text-amber-400 pt-0.5">🚀 Vượt mốc 2.000.000 ₫ thành công rực rỡ!</div>
            </div>

            <button onclick="document.getElementById('congrat-milestone-modal').remove()" class="w-full py-3 bg-gradient-to-r from-amber-500 via-rose-500 to-pink-600 hover:opacity-95 text-white font-extrabold text-xs rounded-xl shadow-lg transition-all uppercase tracking-wider">
              🔥 TUYỆT VỜI QUÁ, TIẾP TỤC PHÁT HUY! 🔥
            </button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function renderHomeSelection() {
      loggedInUser = null;
      document.getElementById('header-status').innerText = "Chọn phân vùng đăng nhập";
      document.getElementById('btn-logout').classList.add('hidden');
      
      document.getElementById('main-container').innerHTML = `
        <div class="flex flex-col items-center justify-center text-center space-y-6 my-auto py-10">
          <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white w-24 h-24 rounded-3xl flex items-center justify-center text-4xl font-extrabold shadow-2xl">
            ✈️
          </div>
          <div class="space-y-2">
            <h1 class="text-2xl font-extrabold text-slate-900">HỆ THỐNG ĐIỀU XE SÂN BAY TSS</h1>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">Chọn phân vùng làm việc của bạn bên dưới:</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 w-full max-w-2xl">
            <button onclick="promptLogin('pos')" class="p-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg">🚖 Bán Vé (Quầy)</button>
            <button onclick="promptLogin('driver')" class="p-4 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-2xl shadow-lg">🚗 Cổng Chủ Xe</button>
            <button onclick="promptLogin('plan')" class="p-4 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-2xl shadow-lg">📋 Team Kế Hoạch</button>
            <button onclick="promptLogin('manager')" class="p-4 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-2xl shadow-lg">📊 Trang Quản Lý</button>
          </div>
        </div>
      `;
    }

    function loginModalHtml(id, iconBg, icon, title, bodyHtml, okLabel, okAction, okClass) {
      return `
        <div id="${id}" class="login-modal fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
          <div class="bg-white rounded-3xl shadow-2xl max-w-xs w-full p-6 text-center space-y-4">
            <div class="${iconBg} text-white w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">${icon}</div>
            <h3 class="text-sm font-bold text-slate-900">${title}</h3>
            <div class="space-y-2 text-left">${bodyHtml}</div>
            <div id="${id}-msg" class="text-[11px] font-bold text-rose-600 min-h-[14px]"></div>
            <div class="flex space-x-2 pt-1">
              <button id="${id}-ok" onclick="${okAction}" class="w-full py-2.5 ${okClass || 'bg-blue-600 hover:bg-blue-700'} text-white rounded-xl text-xs font-bold">${okLabel}</button>
              <button onclick="closeLoginModals()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">Hủy</button>
            </div>
          </div>
        </div>`;
    }
    function closeLoginModals() { document.querySelectorAll('.login-modal').forEach(m => m.remove()); }
    function setModalBusy(id, busy, msg) {
      const ok = document.getElementById(id + '-ok');
      const m = document.getElementById(id + '-msg');
      if (ok) { ok.disabled = busy; ok.style.opacity = busy ? '0.6' : '1'; }
      if (m) { m.className = 'text-[11px] font-bold min-h-[14px] ' + (busy ? 'text-blue-600' : 'text-rose-600'); m.innerText = msg || ''; }
    }
    const inputCls = 'w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold';

    async function promptLogin(role) {
      closeLoginModals();
      if (role === 'manager') {

    async function executeBootstrapManager() {
      const oldP = document.getElementById('boot-old').value.trim();
      const u = document.getElementById('boot-user').value.trim().toUpperCase();

      if (p.length < 6) { setModalBusy('boot-modal', false, 'Mật khẩu mới phải có ít nhất 6 ký tự!'); return; }
      if (p !== p2) { setModalBusy('boot-modal', false, 'Hai lần nhập mật khẩu không giống nhau!'); return; }
      setModalBusy('boot-modal', true, 'Đang tạo tài khoản...');
      try {

        await fbAuth.signInWithEmailAndPassword(accountEmail(u, ver), authPassword(p));

        const updates = {};

        updates[`accounts/${u}`] = { role: 'manager', active: true, uid, ver, createdAt: now };

      } catch (e) {
        try { await fbAuth.signOut(); } catch (e2) {}

        setModalBusy('boot-modal', false, authErrorText(e));

    function canDeleteTrip(tripTimestamp) {
      if (!tripTimestamp) return true;
      const now = Date.now();
      const tripDate = new Date(tripTimestamp);
      const limitDate = new Date(tripDate.getFullYear(), tripDate.getMonth(), tripDate.getDate() + 1, lockHourSetting, 0, 0);
      return now < limitDate.getTime();
    }

    function normalizeDateInput(rawDate) {
      if (!rawDate) return '';
      rawDate = String(rawDate).trim();
      // Ngày gõ thiếu dấu "/" (vd "01/112026", "01112026") -> "01/11/2026"
      const digits = rawDate.replace(/\D/g, '');
      if (digits.length === 8 && !/^\d{4}-/.test(rawDate) && (rawDate.split('/').length !== 3 || rawDate.split('/')[2].length !== 4)) {
        return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      }
      if (rawDate.includes('-')) {
        const p = rawDate.split('-');
        if (p.length === 3) {
          return `${String(p[2]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${p[0]}`;
        }
      } else if (rawDate.includes('/')) {
        const p = rawDate.split('/');
        if (p.length === 3) {
          return `${String(p[0]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${p[2]}`;
        }
      }
      return rawDate;
    }

    function isValidDateStr(d) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d || '');
      if (!m) return false;
      const dt = new Date(+m[3], +m[2] - 1, +m[1]);
      return dt.getFullYear() === +m[3] && dt.getMonth() === +m[2] - 1 && dt.getDate() === +m[1] && +m[3] >= 2020 && +m[3] <= 2100;
    }

    function formatDisplayTicket(ticketStr) {
      if (!ticketStr) return '';
      let clean = ticketStr.replace('/', '-');
      return clean;
    }

    function sortTripsByDateAndTime(trips) {
      return trips.sort((a, b) => {
        let normA = normalizeDateInput(a.dateStr);
        let normB = normalizeDateInput(b.dateStr);
        let dateA_parts = normA.split('/');
        let dateB_parts = normB.split('/');

        if (dateA_parts.length === 3 && dateB_parts.length === 3) {
          let numA = parseInt(dateA_parts[2] + dateA_parts[1] + dateA_parts[0], 10);
          let numB = parseInt(dateB_parts[2] + dateB_parts[1] + dateB_parts[0], 10);
          
          if (numA !== numB) {
            return numB - numA;
          }
        }

        let tA = (a.timeStr || '').replace(':', '');
        let tB = (b.timeStr || '').replace(':', '');
        let numTA = parseInt(tA, 10) || 0;
        let numTB = parseInt(tB, 10) || 0;

        if (numTA !== numTB) {
          return numTB - numTA; 
        }

        return (b.timestamp || 0) - (a.timestamp || 0);
      });
    }

    function updatePersonalSummary(role) {
      if (!loggedInUser || loggedInUser.role === 'manager') return;

      const sumDateInp = document.getElementById('summary-date-picker');
      let targetDateStr = '';
      if (sumDateInp && sumDateInp.value) {
        const parts = sumDateInp.value.split('-');
        if (parts.length === 3) {
          targetDateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

      const selectedItems = personalTrips.filter(t => {
        if (!targetDateStr) return true;
        return normalizeDateInput(t.dateStr) === normalizeDateInput(targetDateStr);
      });

      const totalSum = selectedItems.reduce((acc, t) => acc + (Number(t.totalFare) || 0), 0);

      // KIỂM TRA MỐC 2.ỆU TRIỆU CHO TỪNG NHÂN SỰ TRONG NGÀY
      if (targetDateStr && totalSum > 2000000) {
        // Gom nhóm doanh thu theo từng tên nhân sự đầy đủ xuất hiện trong ngày
        let staffRevenueMap = {};
        selectedItems.forEach(t => {
          const sName = (t.staff || '').trim();
          if (sName) {
            staffRevenueMap[sName] = (staffRevenueMap[sName] || 0) + (Number(t.totalFare) || 0);
          }
        });

        Object.entries(staffRevenueMap).forEach(([staffName, sTotal]) => {
          if (sTotal > 2000000) {
            const celebKey = `${staffName}_${targetDateStr}`;
            if (!celebratedStaffToday[celebKey]) {
              celebratedStaffToday[celebKey] = true;
              showStaffCelebrationModal(staffName, sTotal, targetDateStr);
            }
          }
        });
      }

      const activePayments = (role === 'plan') ? planPaymentOptions : paymentOptions;
      
      let methodSums = {};
      activePayments.forEach(opt => methodSums[opt] = 0);

      selectedItems.forEach(t => {
        const fare = Number(t.totalFare || 0);
        const method = t.paymentMethod || activePayments[0];
        if (methodSums[method] !== undefined) {
          methodSums[method] += fare;
        } else {
          methodSums[activePayments[0]] = (methodSums[activePayments[0]] || 0) + fare;
        }
      });

      const container = document.getElementById('summary-cards-container');
      if (!container) return;

      let cardsHtml = `
        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl shadow-sm sm:col-span-1">
          <div class="text-[10px] font-bold uppercase text-emerald-600">Tổng Tiền Ngày Này</div>
          <div id="personal-sum" class="text-lg sm:text-xl font-extrabold text-emerald-800 mt-1">${totalSum.toLocaleString('vi-VN')} ₫</div>
          <div id="personal-count" class="text-[11px] text-slate-500 mt-0.5">${selectedItems.length} đơn</div>
        </div>
      `;

      const colors = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-indigo-50 border-indigo-200 text-indigo-800', 'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800', 'bg-rose-50 border-rose-200 text-rose-800'];
      activePayments.forEach((opt, idx) => {
        const cls = colors[idx % colors.length];
        cardsHtml += `
          <div class="${cls} border p-3.5 rounded-2xl shadow-sm">
            <div class="text-[10px] font-bold uppercase opacity-80">${opt}</div>
            <div class="text-base font-extrabold mt-1">${(methodSums[opt] || 0).toLocaleString('vi-VN')} ₫</div>
          </div>
        `;
      });

      container.innerHTML = cardsHtml;
    }

    function renderActiveWorksheetTrips(role) {

        if (parts.length === 3) {

      const filteredTrips = personalTrips.filter(t => {
        if (!targetDateStr) return true;

      if (filteredTrips.length === 0) {
        tb.innerHTML = `<tr><td colspan="14" class="p-4 text-center text-slate-400">Không có đơn hàng nào vào ngày ${targetDateStr || 'này'}.</td></tr>`;

    function saveEditedTrip(id, role) {
      const trip = personalTrips.find(x => x.id === id);
      if (!trip) return;

      const rawDate = document.getElementById('edit-modal-date').value;
      const formattedDate = normalizeDateInput(rawDate);
      const ticket = document.getElementById('edit-modal-ticket').value.trim();
      const plate = document.getElementById('edit-modal-plate').value.trim().toUpperCase();
      const staff = document.getElementById('edit-modal-staff').value.trim();
      const carType = document.getElementById('edit-modal-cartype').value;
      const source = document.getElementById('edit-modal-source').value;
      const pickup = document.getElementById('edit-modal-pickup').value;
      const destination = document.getElementById('edit-modal-dest').value.trim();
      const totalFare = parseFloat(document.getElementById('edit-modal-fare').value.replace(/[^0-9]/g, '')) || 0;
      const paymentMethod = document.getElementById('edit-modal-payment').value;
      const note = document.getElementById('edit-modal-note').value.trim();

      if (!ticket || !plate || !destination || !staff) {
        alert("Vui lòng điền đầy đủ Số Phiếu, Biển Số, Nhân Sự và Điểm Đến!");
        return;
      }

      trip.dateStr = formattedDate;
      trip.ticketNumber = ticket;
      trip.plateNumber = plate;
      trip.staff = staff;
      trip.carType = carType;
      trip.source = source;
      trip.pickup = pickup;
      trip.destination = destination;
      trip.totalFare = totalFare;
      trip.paymentMethod = paymentMethod;
      trip.note = note;

      let updates = {};
      updates[`users_trips/${loggedInUser.user}/${id}`] = trip;
      updates[`trips/${id}`] = trip;

      dbRoot().update(updates).then(() => {
        alert("Đã cập nhật đơn hàng thành công!");
        document.getElementById('edit-trip-modal').remove();
        updatePersonalSummary(role);
        renderActiveWorksheetTrips(role);
      }).catch(err => {
        alert("Lỗi khi cập nhật: " + err.message);
      });
    }

    function deleteSelectedPersonalTrips() {
      const checkboxes = document.querySelectorAll('.personal-trip-checkbox:checked');
      if (checkboxes.length === 0) { alert("Vui lòng tích chọn ít nhất một đơn hàng để xóa!"); return; }

      if (confirm(`Bạn có chắc chắn muốn xóa ${checkboxes.length} đơn hàng đã chọn không?`)) {
        let updates = {};
        let deletedList = [];
        checkboxes.forEach(cb => {
          const id = cb.value;
          const trip = personalTrips.find(x => x.id === id);
          if (trip && canDeleteTrip(trip.timestamp)) {
            updates[`users_trips/${loggedInUser.user}/${id}`] = null;
            updates[`trips/${id}`] = null;
            deletedList.push(trip);
          }
        });

        dbRoot().update(updates).then(() => {
          lastDeletedTripBackup = deletedList;
          showUndoButton(`Đã xóa ${deletedList.length} đơn hàng!`);
        });
      }
    }

    function deletePersonalTrip(id) {
      if (!loggedInUser) return;
      
      dbRef(`users_trips/${loggedInUser.user}/${id}`).once('value', snap => {
        const trip = snap.val();
        
        if (trip && !canDeleteTrip(trip.timestamp)) {
          alert(`Đã quá giờ quy định của ngày hôm sau, đơn hàng đã bị khóa và không thể xóa!`);
          return;
        }

        if (confirm("Vui lòng xác nhận xóa đơn hàng này?")) {
          let updates = {};
          updates[`users_trips/${loggedInUser.user}/${id}`] = null;
          updates[`trips/${id}`] = null;

          dbRoot().update(updates).then(() => {
            lastDeletedTripBackup = [trip || { id }];

    function showUndoButton(message) {
      const existingBtn = document.getElementById('floating-undo-container');
      if (existingBtn) existingBtn.remove();

      const container = document.createElement('div');
      container.id = 'floating-undo-container';
      container.className = 'fixed bottom-5 right-5 z-50 flex items-center space-x-2 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold animate-bounce';
      container.innerHTML = `

    function restoreDeletedTrips() {
      if (!lastDeletedTripBackup || lastDeletedTripBackup.length === 0) { alert("Không có đơn hàng nào để khôi phục!"); return; }
      let updates = {};
      lastDeletedTripBackup.forEach(trip => {
        updates[`trips/${trip.id}`] = trip;
        if (trip.createdBy) {
          updates[`users_trips/${trip.createdBy}/${trip.id}`] = trip;
        }
      });
      dbRoot().update(updates).then(() => {
        alert("Đã khôi phục đơn hàng thành công!");
        lastDeletedTripBackup = null;
        const container = document.getElementById('floating-undo-container');
        if (container) container.remove();
      });
    }

      if (!drop) return;
      if (!q) { drop.innerHTML = ''; return; }

      const matches = staffOptions.filter(name => name.toLowerCase().includes(q));
      if (matches.length === 0) { drop.innerHTML = ''; return; }

      drop.innerHTML = `<div class="local-dropdown">${matches.map(name => `

      `).join('')}</div>`;

    function handleSmartTicketFocus(currentIndex) {
      const currentInput = document.getElementById(`t-${currentIndex}`);
      if (currentInput && !currentInput.value.trim() && currentIndex > 0) {
        for (let j = currentIndex - 1; j >= 0; j--) {
          const prevInput = document.getElementById(`t-${j}`);
          if (prevInput && prevInput.value.trim()) {
            const prevVal = prevInput.value.trim();
            const match = prevVal.match(/^(.*?)(\d+)$/);
            if (match) {
              const prefix = match[1];
              const numStr = match[2];
              const numLength = numStr.length;
              const nextNum = parseInt(numStr, 10) + (currentIndex - j);
              const formattedNum = String(nextNum).padStart(numLength, '0');
              currentInput.value = prefix + formattedNum;
            }
            break;
          }
        }
      }
    }

    function submitBatch(role) {
      if (!loggedInUser) return;
      const timeStr = new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
      let count = 0;
      let updates = {};
      let duplicateDetails = [];
      let lastFormattedDate = '';

      // Mảng lưu trữ các đơn chuẩn bị đưa lên để check trùng ngay trong nội bộ lô nhập hàng loạt này
      let batchEntriesToCheck = [];
      let invalidDateRows = [];

      for (let i = 0; i < 20; i++) {
        let rawDate = document.getElementById(`date-${i}`).value.trim();
        let formattedDate = normalizeDateInput(rawDate);
        if (formattedDate) lastFormattedDate = formattedDate;

        const rawStaff = document.getElementById(`staff-${i}`).value.trim();
        const ticket = document.getElementById(`t-${i}`).value.trim();
        const plate = document.getElementById(`p-${i}`).value.trim().toUpperCase();
        const dest = document.getElementById(`d-${i}`).value.trim();
        const totalFare = parseFloat(document.getElementById(`f-${i}`).value.replace(/[^0-9]/g, '')) || 0;
        const carType = document.getElementById(`c-${i}`).value;
        const source = document.getElementById(`src-${i}`).value;
        const pickup = document.getElementById(`pick-${i}`).value;
        const pay = document.getElementById(`m-${i}`).value;
        const note = document.getElementById(`note-${i}`).value.trim();

        if (rawStaff && ticket && plate && dest && !isValidDateStr(formattedDate)) {
          invalidDateRows.push(`Dòng ${i+1} ("${rawDate}")`);
          continue;
        }

        if (rawStaff && ticket && plate && dest) {
          const cleanTicket = ticket.trim().toUpperCase();
          const cleanPlate = plate.trim().toUpperCase();

          // 1. Kiểm tra trùng ngay trong nội bộ các dòng đang nhập hàng loạt
          const isDuplicateInBatch = batchEntriesToCheck.some(item => 
            item.ticket === cleanTicket && item.plate === cleanPlate && item.date === formattedDate
          );

          // 2. Kiểm tra trùng với lịch sử đã lưu trước đó trên Cloud của tài khoản này
          const isDuplicateInCloud = personalTrips.some(t => {
            const existingTicket = (t.originalTicket || t.ticketNumber || '').trim().toUpperCase();
            const existingPlate = (t.plateNumber || '').trim().toUpperCase();
            const existingDate = normalizeDateInput(t.dateStr);
            return existingTicket === cleanTicket && existingPlate === cleanPlate && existingDate === formattedDate;
          });

          if (isDuplicateInBatch || isDuplicateInCloud) {
            duplicateDetails.push(`Dòng ${i+1} (Phiếu: ${ticket} - Biển số: ${plate})`);
            continue;
          }

          // Đưa vào mảng kiểm tra nội bộ tiếp theo
          batchEntriesToCheck.push({ ticket: cleanTicket, plate: cleanPlate, date: formattedDate });

          const baseTimestamp = Date.now() + i;

          const staffNames = rawStaff.split(/[+,]+/).map(s => s.trim()).filter(Boolean);
          const splitCount = staffNames.length > 1 ? staffNames.length : 1;
          const splitFare = Math.round(totalFare / splitCount);

          staffNames.forEach((staffName, sIdx) => {
            const subId = 'X' + baseTimestamp + '_' + sIdx;
            const subTicket = splitCount > 1 ? `${ticket}-${sIdx + 1}/${splitCount}` : ticket;

            const tripData = {
              id: subId, dateStr: formattedDate, timeStr, ticketNumber: subTicket, originalTicket: ticket, plateNumber: plate,
              carType, source, pickup, destination: dest, totalFare: splitFare, originalTotalFare: totalFare, paymentMethod: pay,
              note: note, staff: staffName, role: loggedInUser.role, createdBy: loggedInUser.user, timestamp: baseTimestamp + sIdx
            };

            updates[`users_trips/${loggedInUser.user}/${subId}`] = tripData;
            updates[`trips/${subId}`] = tripData;
          });
          count++;
        }
      }

      if (invalidDateRows.length > 0) {
        alert(`Ngày tháng không đúng dạng ngày/tháng/năm (vd 07/11/2026) ở: ${invalidDateRows.join(', ')}.\nCác dòng này CHƯA được lưu, vui lòng sửa lại ngày.`);
      }

      if (duplicateDetails.length > 0) {
        showFloatingWarning(`Đã chặn ${duplicateDetails.length} đơn trùng lặp (trùng trong danh sách nhập hoặc đã có trên Cloud): ${duplicateDetails.join(', ')}`);
      }

      if (count > 0) {
        dbRoot().update(updates).then(() => {
          alert(`Đã lưu thành công và phân tách hoa hồng cho ${count} đơn!`);
          renderBatchRows(role);
          const histInput = document.getElementById('filter-history-date');
          if (histInput && lastFormattedDate) {
            const parts = formatDateForInput(lastFormattedDate);
            if (parts) histInput.value = parts;
            renderActiveWorksheetTrips(role);
          }
        }).catch(err => {
          alert("Lỗi lưu dữ liệu: " + err.message);
        });
      } else if (duplicateDetails.length === 0 && invalidDateRows.length === 0) {
        alert("Vui lòng điền đầy đủ Tên Nhân Sự, Số Phiếu, Biển Số và Điểm Đến!");
      }
    }

    function formatDateForInput(dateStr) {
      const p = dateStr.split('/');
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return '';
    }

    function updateManagerRevenueSummary() {
      const revContainer = document.getElementById('revenue-cards-container');
      if (!revContainer) return;

      const revDateInp = document.getElementById('revenue-date-picker');
      let targetDateStr = '';
      if (revDateInp && revDateInp.value) {
        const parts = revDateInp.value.split('-');
        if (parts.length === 3) {
          targetDateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

      const selectedTrips = allCompanyTrips.filter(t => {
        if (!targetDateStr) return true;
        return normalizeDateInput(t.dateStr) === normalizeDateInput(targetDateStr);
      });

      const totalSum = selectedTrips.reduce((acc, t) => acc + (Number(t.totalFare) || 0), 0);

      let allCategories = [...new Set([...paymentOptions, ...planPaymentOptions, ...sourceOptions])];
      let methodSums = {};
      allCategories.forEach(opt => methodSums[opt] = 0);

      selectedTrips.forEach(t => {
        const fare = Number(t.totalFare || 0);
        const method = t.paymentMethod || paymentOptions[0];
        const source = t.source;

        if (methodSums[method] !== undefined) {
          methodSums[method] += fare;
        } else {
          methodSums[method] = (methodSums[method] || 0) + fare;
        }

        if (source && methodSums[source] !== undefined && source !== method) {
          methodSums[source] += fare;
        }
      });

      let cardsHtml = `
        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl shadow-sm sm:col-span-1">
          <div class="text-[10px] font-bold uppercase text-emerald-600">Tổng Doanh Thu Ngày</div>
          <div class="text-lg sm:text-xl font-extrabold text-emerald-800 mt-1">${totalSum.toLocaleString('vi-VN')} ₫</div>
          <div class="text-[11px] text-slate-500 mt-0.5">${selectedTrips.length} tổng đơn</div>
        </div>
      `;

      const colors = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-indigo-50 border-indigo-200 text-indigo-800', 'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800', 'bg-rose-50 border-rose-200 text-rose-800', 'bg-teal-50 border-teal-200 text-teal-800'];
      
      paymentOptions.concat(planPaymentOptions).forEach((opt, idx) => {
        const cls = colors[idx % colors.length];
        const amt = methodSums[opt] || 0;
        if (amt > 0 || paymentOptions.includes(opt)) {
          cardsHtml += `
            <div class="${cls} border p-3.5 rounded-2xl shadow-sm">
              <div class="text-[10px] font-bold uppercase opacity-80">${opt}</div>
              <div class="text-base font-extrabold mt-1">${amt.toLocaleString('vi-VN')} ₫</div>
            </div>
          `;
        }
      });

      revContainer.innerHTML = cardsHtml;
    }

    // Xác nhận xóa đơn bằng chính mật khẩu của quản lý đang đăng nhập
    function verifyAndDelete(callback) {
      closeLoginModals();
      const body = `
        <p class="text-xs text-slate-500 text-center">Nhập mật khẩu tài khoản quản lý của bạn để xóa:</p>
        <input type="password" id="custom-pwd-input" autocomplete="current-password" placeholder="Mật khẩu..." class="${inputCls} text-center" onkeydown="if(event.key==='Enter') submitCustomPwd()">`;
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('custom-pwd-modal', 'bg-rose-600', '🔒', 'Xác Nhận Xóa Đơn Hàng', body, 'Xác Nhận Xóa', 'submitCustomPwd()', 'bg-rose-600 hover:bg-rose-700'));
      setTimeout(() => { const inp = document.getElementById('custom-pwd-input'); if (inp) inp.focus(); }, 100);

      window.submitCustomPwd = async function() {
        const inp = document.getElementById('custom-pwd-input');
        const val = inp ? inp.value.trim() : '';
        if (!val) { setModalBusy('custom-pwd-modal', false, 'Vui lòng nhập mật khẩu!'); return; }
        setModalBusy('custom-pwd-modal', true, 'Đang kiểm tra...');
        try {
          const cu = fbAuth.currentUser;
          await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, authPassword(val)));
          closeLoginModals();
          callback();
        } catch (e) {
          setModalBusy('custom-pwd-modal', false, (e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials')) ? 'Mật khẩu không chính xác! Hủy thao tác xóa.' : authErrorText(e));
        }
      };
    }

    function deleteSelectedManagerTrips() {
      const checkboxes = document.querySelectorAll('.manager-trip-checkbox:checked');
      if (checkboxes.length === 0) { alert("Vui lòng tích chọn ít nhất một đơn hàng để xóa!"); return; }

      verifyAndDelete(() => {
        let updates = {};
        let deletedList = [];
        checkboxes.forEach(cb => {
          const id = cb.value;
          const trip = allCompanyTrips.find(x => x.id === id);
          if (trip) {
            updates[`trips/${id}`] = null;
            if (trip.createdBy) {
              updates[`users_trips/${trip.createdBy}/${id}`] = null;
            }
            deletedList.push(trip);
          }
        });

        dbRoot().update(updates).then(() => {
          lastDeletedTripBackup = deletedList;
          showUndoButton(`Đã xóa ${deletedList.length} đơn hàng!`);
        });
      });
    }

    function adminDeleteTrip(id, createdBy) {
      verifyAndDelete(() => {
        let trip = allCompanyTrips.find(x => x.id === id);
        if (!trip) return;

        let updates = {};
        updates[`trips/${id}`] = null;
        if (createdBy) {
          updates[`users_trips/${createdBy}/${id}`] = null;
        }

        dbRoot().update(updates).then(() => {
          lastDeletedTripBackup = [trip];
          showUndoButton("Đã xóa đơn hàng!");
        });
      });
    }

    function updateInlineTripField(tripId, field, value) {
      let trip = allCompanyTrips.find(x => x.id === tripId);
      if (!trip) return;

      if (field === 'totalFare') {
        value = parseFloat(value.replace(/[^0-9]/g, '')) || 0;

      updates[`trips/${tripId}`] = trip;
      if (trip.createdBy) {

      }

    // ===== ĐỐI SOÁT: một hàm dùng chung cho màn hình và file Excel (để 2 nơi luôn ra cùng kết quả) =====
    const AUDIT_STATUS = {
      match: { label: '🟢 Trùng Khớp', text: 'Trùng Khớp' },
      mismatch: { label: '🔴 Đơn Lệch', text: 'Đơn Lệch' },
      unmatched: { label: '⏳ Đơn Chưa Khớp (Thiếu 1 bên)', text: 'Chưa Khớp (Thiếu 1 bên)' }
    };
    const PARTNER_KEYWORDS = ['kế hoạch', 'sq', 'g1', 'vto', 'công nợ', 'sanna', 'stella', 'jovia', 'vdt', 'monica', 'november', 'thanhlong', 'fast track'];

    function tripDateKey(t) {
      // dd/mm/yyyy -> yyyy-mm-dd (để so sánh / sắp xếp); '' nếu ngày không hợp lệ
      const p = normalizeDateInput(t.dateStr).split('/');
      return (p.length === 3 && p[2].length === 4) ? `${p[2]}-${p[1]}-${p[0]}` : '';
    }

    // Hạn báo cáo của đơn ngày D = D+1 lúc lockHourSetting giờ (giống giờ khóa đơn)
    function reportDeadline(dateKey) {
      if (!dateKey) return null;
      const p = dateKey.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2] + 1, lockHourSetting, 0, 0);
    }
    // Thông tin chi tiết: bên nào còn thiếu, đã quá hạn chưa
    function auditDetail(trips, status, dateKey) {
      if (status !== 'unmatched') return { missing: null, overdue: false };
      const hasPos = trips.some(t => t.role === 'pos' || t.role === 'plan');
      const missing = hasPos ? 'driver' : 'pos';
      const dl = reportDeadline(dateKey);
      return { missing, overdue: !!(dl && Date.now() >= dl.getTime()) };
    }
    function auditStatusText(g) {
      if (g.status !== 'unmatched') return AUDIT_STATUS[g.status].text;
      const who = g.missing === 'driver' ? 'Tài xế' : 'Bán vé/KH';
      return g.overdue ? `Quá hạn: ${who} chưa báo` : `Chờ ${who} báo`;
    }

    function getAuditStatus(group) {
      const posTrips = group.filter(x => x.role === 'pos' || x.role === 'plan');
      const driverTrips = group.filter(x => x.role === 'driver');
      if (posTrips.length === 0 || driverTrips.length === 0) return 'unmatched';
      const sumPos = posTrips.reduce((acc, x) => acc + Number(x.totalFare || 0), 0);
      const sumDriver = driverTrips.reduce((acc, x) => acc + Number(x.totalFare || 0), 0);
      const posPay = (posTrips[0].paymentMethod || posTrips[0].source || '').toLowerCase();
      const driverPay = (driverTrips[0].paymentMethod || driverTrips[0].source || '').toLowerCase();
      // Cả hai bên thuộc nhóm Kế Hoạch / Đối tác thì không so tên hình thức thanh toán, chỉ xét tổng tiền
      const isBothPlanOrPartner = PARTNER_KEYWORDS.some(k => posPay.includes(k) || driverPay.includes(k));
      return (Math.abs(sumPos - sumDriver) < 1000 && (posPay === driverPay || isBothPlanOrPartner)) ? 'match' : 'mismatch';
    }

    function getAuditFilters() {
      const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      return {
        startDateVal: val('audit-start-date') || '',
        endDateVal: val('audit-end-date') || '',
        roleFilter: val('audit-role-filter') || 'all',
        matchStatusFilter: val('audit-match-status-filter') || 'all',
        keyword: (val('audit-search-input') || '').trim().toLowerCase()
      };
    }

    // Trả về danh sách nhóm [{trips, status, dateKey}] đã lọc theo bộ lọc trên màn hình
    function computeAuditGroups(f) {
      const pairMap = {};
      allCompanyTrips.forEach(t => {
        if (f.roleFilter !== 'all' && t.role !== f.roleFilter) return;
        if (f.startDateVal || f.endDateVal) {
          const k = tripDateKey(t);
          if (k) {
            if (f.startDateVal && k < f.startDateVal) return;
            if (f.endDateVal && k > f.endDateVal) return;
          }
        }
        const ticketKey = (t.originalTicket || t.ticketNumber || '').trim().toUpperCase();
        const plate = (t.plateNumber || '').trim().toUpperCase();
        if (ticketKey && plate) {
          const baseTicket = ticketKey.split('-')[0].split('/')[0];
          // Gom chung một nhóm theo Số phiếu + Biển số + Ngày
          const key = `${baseTicket}_${plate}_${normalizeDateInput(t.dateStr)}`;
          if (!pairMap[key]) pairMap[key] = [];
          pairMap[key].push(t);
        } else {
          pairMap['single_' + t.id] = [t];
        }
      });

      const defaultPay = paymentOptions[0] || 'Nhân Viên Quầy Thu';
      const groups = [];
      Object.values(pairMap).forEach(trips => {
        trips.sort((a, b) => ((a.role === 'pos' || a.role === 'plan') ? 0 : 1) - ((b.role === 'pos' || b.role === 'plan') ? 0 : 1) || (a.timestamp || 0) - (b.timestamp || 0));
        const status = getAuditStatus(trips);
        const dateKey = tripDateKey(trips[0]);
        const det = auditDetail(trips, status, dateKey);
        const sf = f.matchStatusFilter;
        if (sf.startsWith('overdue')) {
          if (!det.overdue) return;
          if (sf === 'overdue_driver' && det.missing !== 'driver') return;
          if (sf === 'overdue_pos' && det.missing !== 'pos') return;
        } else if (sf !== 'all' && status !== sf) return;
        const kw = f.keyword;
        if (kw) {
          let pass;
          if (kw === 'khớp' || kw === 'trùng khớp') pass = status === 'match';
          else if (kw === 'lệch' || kw === 'đơn lệch') pass = status === 'mismatch';
          else if (kw === 'chưa khớp' || kw === 'đơn lẻ' || kw === 'thiếu') pass = status === 'unmatched';
          else if (kw === 'chưa báo' || kw === 'quá hạn') pass = det.overdue;
          else pass = trips.some(t => `${t.dateStr} ${t.timeStr} ${t.role} ${t.staff} ${t.ticketNumber} ${t.plateNumber} ${t.carType || ''} ${t.source || ''} ${t.destination} ${t.paymentMethod || defaultPay} ${t.note || ''} ${t.totalFare}`.toLowerCase().includes(kw));
          if (!pass) return;
        }
        groups.push({ trips, status, dateKey, missing: det.missing, overdue: det.overdue, ts: Math.min(...trips.map(t => t.timestamp || 0)) });
      });
      return groups;
    }

                <select class="inline-edit-input w-32 font-bold" onchange="updateInlineTripField('${t.id}', 'paymentMethod', this.value)">

                </select>

    // Khung nhắc: đơn quá hạn mà 1 bên chưa báo cáo (14 ngày gần nhất, không phụ thuộc bộ lọc ngày)
    const OVERDUE_DAYS = 14;
    function localDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function renderOverdueBox() {
      const box = document.getElementById('overdue-box');
      if (!box) return;
      const from = new Date(); from.setDate(from.getDate() - OVERDUE_DAYS);
      const fromKey = localDateKey(from);
      const gs = computeAuditGroups({ startDateVal: fromKey, endDateVal: '', roleFilter: 'all', matchStatusFilter: 'overdue', keyword: '' });
      if (gs.length === 0) {
        box.innerHTML = `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl px-3 py-2 text-xs font-bold text-emerald-800">✅ ${OVERDUE_DAYS} ngày gần nhất: không có đơn nào quá hạn chưa báo cáo.</div>`;
        return;
      }
      const drv = gs.filter(g => g.missing === 'driver'), pos = gs.filter(g => g.missing === 'pos');
      // Tài xế chưa báo: nhóm theo biển số xe. Bán vé chưa báo: nhóm theo tên tài xế/chủ xe đã báo.
      const list = (arr, keyFn) => {
        const m = {};
        arr.forEach(g => { const t = g.trips[0]; const k = keyFn(t); (m[k] = m[k] || []).push(`${formatDisplayTicket(t.originalTicket || t.ticketNumber)} (${fmtDateKeyVN(g.dateKey).slice(0, 5)})`); });
        return Object.entries(m).sort((a, b) => b[1].length - a[1].length).map(([k, v]) =>
          `<span class="inline-block bg-white border border-orange-200 rounded-lg px-2 py-0.5 mr-1 mb-1"><b>${escHtml(k)}</b>: ${v.length} đơn <span class="text-slate-500 font-normal">${escHtml(v.slice(0, 4).join(', '))}${v.length > 4 ? '…' : ''}</span></span>`).join('');
      };
      box.innerHTML = `
        <div class="bg-orange-50 border-2 border-orange-300 rounded-2xl p-3 space-y-2 text-xs">
          <div class="font-extrabold text-orange-800">⏰ QUÁ HẠN CHƯA BÁO CÁO (${OVERDUE_DAYS} ngày gần nhất, hạn ${lockHourSetting}:00 sáng hôm sau): ${gs.length} đơn</div>
          ${drv.length ? `<div><button onclick="showOverdue('overdue_driver')" class="px-2.5 py-1 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-bold mr-2 mb-1">🚗 Tài xế chưa báo: ${drv.length} đơn → Xem</button>${list(drv, t => 'Xe ' + (t.plateNumber || '?'))}</div>` : ''}
          ${pos.length ? `<div><button onclick="showOverdue('overdue_pos')" class="px-2.5 py-1 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-bold mr-2 mb-1">🚖 Bán vé/KH chưa báo: ${pos.length} đơn → Xem</button>${list(pos, t => (t.staff || '?') + ' – xe ' + (t.plateNumber || '?'))}</div>` : ''}
        </div>`;
    }
    function showOverdue(kind) {
      const from = new Date(); from.setDate(from.getDate() - OVERDUE_DAYS);
      const s = document.getElementById('audit-start-date'), e = document.getElementById('audit-end-date');
      if (s) s.value = localDateKey(from);
      if (e) e.value = '';
      const st = document.getElementById('audit-match-status-filter');
      if (st) st.value = kind;
      const kw = document.getElementById('audit-search-input');
      if (kw) kw.value = '';
      updateManagerAuditTable();
    }

    // ===== XUẤT EXCEL CÓ ĐỊNH DẠNG (ExcelJS, tải khi cần) =====
    let excelJsPromise = null;
    function loadExcelJS() {
      if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
      if (excelJsPromise) return excelJsPromise;
      const urls = [
        'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
        'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
      ];
      excelJsPromise = new Promise((resolve, reject) => {
        const tryLoad = i => {
          if (i >= urls.length) { excelJsPromise = null; reject(new Error('Không tải được thư viện Excel. Kiểm tra mạng rồi thử lại.')); return; }
          const s = document.createElement('script');
          s.src = urls[i];
          s.onload = () => window.ExcelJS ? resolve(window.ExcelJS) : tryLoad(i + 1);
          s.onerror = () => { s.remove(); tryLoad(i + 1); };
          document.head.appendChild(s);
        };
        tryLoad(0);
      });
      return excelJsPromise;
    }

    function fmtDateKeyVN(k) { if (!k) return ''; const p = k.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

    async function exportCustomExcel() {
      if (allCompanyTrips.length === 0) { alert("Không có dữ liệu xuất đi!"); return; }
      const f = getAuditFilters();
      const groups = computeAuditGroups(f);
      if (groups.length === 0) { alert("Không có dữ liệu khớp với khoảng thời gian và bộ lọc để xuất!"); return; }
      // File Excel: ngày cũ trước, trong ngày theo thời gian nộp
      groups.sort((a, b) => (a.dateKey || '9999').localeCompare(b.dateKey || '9999') || a.ts - b.ts);

      const btn = document.getElementById('btn-export-excel');
      const oldTxt = btn ? btn.innerText : '';
      if (btn) { btn.disabled = true; btn.innerText = '⏳ Đang tạo file Excel...'; }
      try {
        const ExcelJS = await loadExcelJS();
        const wb = new ExcelJS.Workbook();
        wb.creator = 'TSS POS';
        wb.created = new Date();
        buildAuditSheet(wb, groups, f);
        buildSummarySheet(wb, groups, f);
        const buf = await wb.xlsx.writeBuffer();
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const range = f.startDateVal || f.endDateVal
          ? `${(f.startDateVal || 'dau').replace(/-/g, '')}-${(f.endDateVal || 'nay').replace(/-/g, '')}`
          : 'TatCa';
        const fileName = `Bao_Cao_Doi_Soat_TSS_${range}_${pad(now.getHours())}h${pad(now.getMinutes())}.xlsx`;
        const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      } catch (e) {

    const XL = {

    function filterDescription(f) {
      const roleTxt = { all: 'Tất cả', pos: 'Bán vé', driver: 'Tài xế', plan: 'Kế hoạch' }[f.roleFilter] || f.roleFilter;
      const stTxt = { all: 'Tất cả', match: 'Trùng khớp', mismatch: 'Đơn lệch', unmatched: 'Chưa khớp', overdue: 'Quá hạn chưa báo cáo', overdue_driver: 'Tài xế chưa báo cáo', overdue_pos: 'Bán vé/KH chưa báo cáo' }[f.matchStatusFilter] || f.matchStatusFilter;
      return `Phân vùng: ${roleTxt}  •  Trạng thái: ${stTxt}` + (f.keyword ? `  •  Từ khóa: "${f.keyword}"` : '');
    }
    function periodDescription(f) {
      if (!f.startDateVal && !f.endDateVal) return 'Tất cả thời gian';
      if (f.startDateVal && f.startDateVal === f.endDateVal) return `Ngày ${fmtDateKeyVN(f.startDateVal)}`;
      return `Từ ngày ${f.startDateVal ? fmtDateKeyVN(f.startDateVal) : '...'} đến ngày ${f.endDateVal ? fmtDateKeyVN(f.endDateVal) : '...'}`;
    }
    function sideSums(trips) {
      let pos = 0, drv = 0, posN = 0, drvN = 0;
      trips.forEach(t => {
        const v = Number(t.totalFare || 0);
        if (t.role === 'driver') { drv += v; drvN++; } else { pos += v; posN++; }
      });
      return { pos, drv, posN, drvN };
    }

    function buildAuditSheet(wb, groups, f) {
      const ws = wb.addWorksheet('Đối Soát', {
        views: [{ state: 'frozen', ySplit: 8, showGridLines: false }],
        pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 }, printTitlesRow: '8:8' },
        headerFooter: { oddFooter: '&LBáo cáo đối soát TSS&RTrang &P / &N' }
      });
      const cols = [
        ['STT', 6], ['Ngày', 11], ['Giờ Nộp', 8], ['Phân Vùng', 15], ['Nhân Sự', 24], ['Số Phiếu', 12], ['Biển Số', 11],
        ['Loại Xe', 11], ['Nguồn Đơn', 14], ['Điểm Đón', 9], ['Điểm Đến', 26], ['Thanh Toán', 18], ['Ghi Chú', 20], ['Tổng Tiền', 14], ['Trạng Thái', 17]

        [1, 3, `Trùng khớp: ${cnt.match} nhóm`, 'match'],
        [4, 6, `Đơn lệch: ${cnt.mismatch} nhóm`, 'mismatch'],
        [7, 9, `Chưa khớp: ${cnt.unmatched} nhóm`, 'unmatched'],
        [10, 12, `Tiền Quầy + Kế hoạch: ${totPos.toLocaleString('vi-VN')} ₫`, null],

      // Dòng tiêu đề bảng (dòng 8)

        xlFont(c, { bold: true, color: { argb: 'FFFFFFFF' } });
        c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        c.border = XL.border;
      });
      hr.height = 22;

      let r = 9, stt = 0;
      const writeTotalRow = (label, sums, fillArgb, bold) => {
        ws.mergeCells(r, 1, r, 11);
        const l = ws.getCell(r, 1);
        l.value = label;
        xlFont(l, { bold: true, color: { argb: 'FF0F172A' } });
        l.alignment = { horizontal: 'right', vertical: 'middle' };
        ws.mergeCells(r, 12, r, 13);
        const info = ws.getCell(r, 12);
        info.value = `Quầy+KH: ${sums.posN} đơn | Chủ xe: ${sums.drvN} đơn`;
        xlFont(info, { size: 9, color: { argb: 'FF334155' } });
        info.alignment = { horizontal: 'center', vertical: 'middle' };
        const m = ws.getCell(r, 14);
        m.value = sums.pos;
        m.numFmt = XL.money;
        xlFont(m, { bold: true, color: { argb: 'FF065F46' } });
        const d = ws.getCell(r, 15);
        d.value = sums.drv;
        d.numFmt = '"Chủ xe: "#,##0';
        xlFont(d, { bold: bold, size: 9, color: { argb: 'FF92400E' } });
        for (let c = 1; c <= N; c++) { const cell = ws.getCell(r, c); xlFill(cell, fillArgb); cell.border = XL.border; }
        ws.getRow(r).height = 20;
        r++;
      };

      // Nhóm theo ngày
      const byDay = [];
      groups.forEach(g => {
        const last = byDay[byDay.length - 1];
        if (last && last.dateKey === g.dateKey) last.groups.push(g);
        else byDay.push({ dateKey: g.dateKey, groups: [g] });
      });
      const grand = { pos: 0, drv: 0, posN: 0, drvN: 0 };

      byDay.forEach(day => {
        // Dòng tiêu đề ngày
        ws.mergeCells(r, 1, r, N);
        const dc = ws.getCell(r, 1);
        const dayTxt = day.dateKey ? fmtDateKeyVN(day.dateKey) : 'Ngày không hợp lệ';
        dc.value = `📅  NGÀY ${dayTxt}  —  ${day.groups.length} nhóm đơn`;
        xlFill(dc, 'FFCBD5E1');
        xlFont(dc, { bold: true, size: 11, color: { argb: 'FF0F172A' } });
        dc.alignment = { vertical: 'middle' };
        dc.border = XL.border;
        ws.getRow(r).height = 20;
        r++;

        const daySum = { pos: 0, drv: 0, posN: 0, drvN: 0 };
        day.groups.forEach(g => {
          stt++;
          const st = XL.status[g.status];
          const first = r;
          g.trips.forEach(t => {
            const role = XL.role[t.role] || { label: t.role || '', color: 'FF334155' };
            const vals = [stt, normalizeDateInput(t.dateStr) || '',t.timeStr || '', role.label, t.staff || '', t.ticketNumber || '', t.plateNumber || '',
              t.carType || '', t.source || '', t.pickup ? 'Ga ' + t.pickup : '', t.destination || '', t.paymentMethod || (paymentOptions[0] || ''), t.note || '',
              Number(t.totalFare || 0), auditStatusText(g)];
            const row = ws.getRow(r);
            vals.forEach((v, i) => {
              const c = row.getCell(i + 1);
              c.value = v;
              xlFill(c, st.fill);
              c.border = XL.border;
              xlFont(c, {});
              c.alignment = { vertical: 'middle', wrapText: i === 4 || i === 10 || i === 12 };
            });
            xlFont(row.getCell(4), { bold: true, color: { argb: role.color } });
            xlFont(row.getCell(6), { bold: true, color: { argb: 'FF1D4ED8' } });
            row.getCell(14).numFmt = XL.money;
            xlFont(row.getCell(14), { bold: true });
            [1, 2, 3, 6, 7, 10].forEach(i => { row.getCell(i).alignment = { horizontal: 'center', vertical: 'middle' }; });
            r++;
          });
          const last = r - 1;
          // STT và Trạng thái gộp ô theo nhóm
          if (last > first) { ws.mergeCells(first, 1, last, 1); ws.mergeCells(first, 15, last, 15); }
          const sc = ws.getCell(first, 15);
          xlFill(sc, g.overdue ? 'FFC2410C' : st.badge);
          xlFont(sc, { bold: true, color: { argb: 'FFFFFFFF' } });
          sc.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          const sn = ws.getCell(first, 1);
          xlFont(sn, { bold: true });
          sn.alignment = { horizontal: 'center', vertical: 'middle' };
          // Viền dưới đậm ngăn cách các nhóm
          for (let c = 1; c <= N; c++) {
            const cell = ws.getCell(last, c);
            cell.border = Object.assign({}, XL.border, { bottom: { style: 'medium', color: { argb: 'FF475569' } } });
          }
          const s = sideSums(g.trips);
          ['pos', 'drv', 'posN', 'drvN'].forEach(k => { daySum[k] += s[k]; grand[k] += s[k]; });
        });
        writeTotalRow(`CỘNG NGÀY ${dayTxt}`, daySum, 'FFF1F5F9', false);
      });

      r++;
      writeTotalRow('TỔNG CỘNG', grand, 'FFFDE68A', true);
      const totLabel = ws.getCell(r - 1, 1);
      xlFont(totLabel, { bold: true, size: 12, color: { argb: 'FF7C2D12' } });
      xlFont(ws.getCell(r - 1, 14), { bold: true, size: 12, color: { argb: 'FF065F46' } });

      // Ghi chú cách đọc
      r++;
      ws.mergeCells(r, 1, r, N);
      const note = ws.getCell(r, 1);
      note.value = 'Ghi chú: Tiền "Quầy + Kế hoạch" là doanh thu bán vé; tiền "Chủ xe" là số chủ xe/tài xế báo lại để đối chiếu (không cộng dồn hai bên). Màu xanh = trùng khớp, đỏ = lệch, vàng = chưa đủ 2 bên.';
      xlFont(note, { italic: true, size: 9, color: { argb: 'FF475569' } });
      note.alignment = { wrapText: true, vertical: 'top' };
      ws.getRow(r).height = 28;

      ws.autoFilter = { from: { row: 8, column: 1 }, to: { row: 8, column: N } };
      xlSignature(ws, r + 2, N);
    }

    function buildSummarySheet(wb, groups, f) {
      const ws = wb.addWorksheet('Tổng Hợp', {
        views: [{ showGridLines: false }],
        pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
      });
      ws.columns = [{ width: 30 }, { width: 18 }, { width: 14 }, { width: 18 }, { width: 14 }, { width: 18 }];
      xlTitle(ws, 6, f, 'TỔNG HỢP ĐỐI SOÁT');
      let r = 6;
      const header = (cells) => {
        cells.filter(v => v !== '').forEach((v, i) => {
          const c = ws.getCell(r, i + 1);
          c.value = v;
          xlFill(c, 'FF0F172A');
          xlFont(c, { bold: true, color: { argb: 'FFFFFFFF' } });
          c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          c.border = XL.border;
        });
        ws.getRow(r).height = 30;
        r++;
      };
      const line = (cells, fill, bold) => {
        cells.filter(v => v !== '').forEach((v, i) => {
          const c = ws.getCell(r, i + 1);
          c.value = v;
          if (fill) xlFill(c, fill);
          xlFont(c, { bold: !!bold });
          c.border = XL.border;
          if (typeof v === 'number') { c.numFmt = '#,##0'; c.alignment = { horizontal: 'right' }; }
        });
        r++;
      };
      const section = title => {
        ws.mergeCells(r, 1, r, 6);
        const c = ws.getCell(r, 1);
        c.value = title;
        xlFont(c, { bold: true, size: 12, color: { argb: 'FF1E40AF' } });
        r++;
      };
      const moneyCols = (row, idxs) => idxs.forEach(i => { ws.getCell(row, i).numFmt = XL.money; });

      // 1. Theo trạng thái
      section('1. Theo trạng thái đối soát');
      header(['Trạng thái', 'Số nhóm đơn', 'Số đơn Quầy + KH', 'Tiền Quầy + KH', 'Số đơn Chủ xe', 'Tiền Chủ xe']);
      const tot = { n: 0, posN: 0, pos: 0, drvN: 0, drv: 0 };
      ['match', 'mismatch', 'unmatched'].forEach(st => {
        const gs = groups.filter(g => g.status === st);
        const s = { posN: 0, pos: 0, drvN: 0, drv: 0 };
        gs.forEach(g => { const x = sideSums(g.trips); s.posN += x.posN; s.pos += x.pos; s.drvN += x.drvN; s.drv += x.drv; });
        tot.n += gs.length; tot.posN += s.posN; tot.pos += s.pos; tot.drvN += s.drvN; tot.drv += s.drv;
        line([AUDIT_STATUS[st].text, gs.length, s.posN, s.pos, s.drvN, s.drv], XL.status[st].fill);
        moneyCols(r - 1, [4, 6]);
      });
      line(['TỔNG CỘNG', tot.n, tot.posN, tot.pos, tot.drvN, tot.drv], 'FFFDE68A', true);
      moneyCols(r - 1, [4, 6]);
      r++;

      // 2. Theo hình thức thanh toán
      const allTrips = groups.flatMap(g => g.trips);
      section('2. Theo hình thức thanh toán');
      header(['Hình thức thanh toán', 'Số đơn Quầy + KH', 'Tiền Quầy + KH', 'Số đơn Chủ xe', 'Tiền Chủ xe', '']);
      const payMap = {};
      allTrips.forEach(t => {
        const k = t.paymentMethod || paymentOptions[0] || '(Không ghi)';
        if (!payMap[k]) payMap[k] = { posN: 0, pos: 0, drvN: 0, drv: 0 };
        const v = Number(t.totalFare || 0);
        if (t.role === 'driver') { payMap[k].drvN++; payMap[k].drv += v; } else { payMap[k].posN++; payMap[k].pos += v; }
      });
      Object.keys(payMap).sort().forEach(k => {
        const s = payMap[k];
        line([k, s.posN, s.pos, s.drvN, s.drv, ''], null);
        moneyCols(r - 1, [3, 5]);
      });
      r++;

      // 3. Theo nhân sự
      section('3. Theo nhân sự');
      header(['Nhân sự', 'Phân vùng', 'Số đơn', 'Tổng tiền', '', '']);
      const staffMap = {};
      allTrips.forEach(t => {
        const k = `${t.staff || '(Không tên)'}|${t.role}`;
        if (!staffMap[k]) staffMap[k] = { name: t.staff || '(Không tên)', role: (XL.role[t.role] || { label: t.role }).label, n: 0, v: 0 };
        staffMap[k].n++;
        staffMap[k].v += Number(t.totalFare || 0);
      });
      Object.values(staffMap).sort((a, b) => a.role.localeCompare(b.role) || b.v - a.v).forEach(s => {
        line([s.name, s.role, s.n, s.v, '', ''], null);
        moneyCols(r - 1, [4]);
      });
      xlSignature(ws, r + 2, 6);
    }

    function formatCurrSmartInput(el) {
      let raw = el.value.replace(/[^0-9]/g, '');
      if (!raw) { el.value = ''; return; }
      let num = parseInt(raw, 10);
      if (num < 10000) { num = num * 1000; }
      el.value = num.toLocaleString('vi-VN');
    }

    // ===== QUẢN LÝ TÀI KHOẢN (accounts/<USER>, roles/<uid>, login_index/<USER>) =====
    const USER_RE = /^[A-Z0-9_.-]{2,30}$/;
