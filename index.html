    function buildAuditSheet(wb, groups, f) {
      const ws = wb.addWorksheet('Đối Soát', {
        views: [{ state: 'frozen', ySplit: 8, showGridLines: false }],
        pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 }, printTitlesRow: '8:8' },
        headerFooter: { oddFooter: '&LBáo cáo đối soát TSS&RTrang &P / &N' }
      });
      const cols = [
        ['STT', 6], ['Ngày', 11], ['Giờ Nộp', 8], ['Phân Vùng', 15], ['Nhân Sự', 24], ['Số Phiếu', 12], ['Biển Số', 11],
        ['Loại Xe', 11], ['Nguồn Đơn', 14], ['Điểm Đón', 9], ['Điểm Đến', 26], ['Thanh Toán', 18], ['Ghi Chú', 20], ['Tổng Tiền', 14], ['Trạng Thái', 24]
      ];
      const N = cols.length;
      ws.columns = cols.map(([, w]) => ({ width: w }));
      xlTitle(ws, N, f, 'BÁO CÁO ĐỐI SOÁT ĐƠN HÀNG');

      // Ô tổng hợp nhanh (dòng 6)
      const cnt = { match: 0, dateoff: 0, mismatch: 0, unmatched: 0 };
      let totPos = 0, totDrv = 0;
      groups.forEach(g => { cnt[g.status]++; const s = sideSums(g.trips); totPos += s.pos; totDrv += s.drv; });
      const boxes = [
        [1, 3, `Trùng khớp: ${cnt.match + cnt.dateoff} nhóm` + (cnt.dateoff ? ` (lệch ngày: ${cnt.dateoff})` : ''), 'match'],
        [4, 6, `Đơn lệch: ${cnt.mismatch} nhóm`, 'mismatch'],
        [7, 9, `Chưa khớp: ${cnt.unmatched} nhóm`, 'unmatched'],
        [10, 12, `Tiền Quầy + Kế hoạch: ${totPos.toLocaleString('vi-VN')}`, null],
        [13, 15, `Tiền Chủ xe báo: ${totDrv.toLocaleString('vi-VN')}`, null]
      ];
      ws.getRow(6).height = 24;
      boxes.forEach(([c1, c2, text, st]) => {
        ws.mergeCells(6, c1, 6, c2);
        const c = ws.getCell(6, c1);
        c.value = text;
        const color = st ? XL.status[st] : { fill: 'FFE0E7FF', text: 'FF1E3A8A' };
        xlFill(c, color.fill);
        xlFont(c, { bold: true, size: 10, color: { argb: color.text } });
        c.alignment = { horizontal: 'center', vertical: 'middle' };
        c.border = XL.border;
      });

      // Dòng tiêu đề bảng (dòng 8)
      const hr = ws.getRow(8);
      cols.forEach(([name], i) => {
        const c = hr.getCell(i + 1);
        c.value = name;
        xlFill(c, 'FF0F172A');
        xlFont(c, { bold: true, color: { argb: 'FFFFFFFF' } });
        c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        c.border = XL.border;
      });
      hr.height = 22;

      let r = 9, stt = 0;
      // Xuất riêng phía Tài xế/Chủ xe (lọc Phân vùng = Tài xế, hoặc chỉ có đơn chủ xe): cột Tổng Tiền cộng tiền CHỦ XE,
      // tiền Quầy+KH ghi phụ bên cạnh. Trước đây cột Tổng Tiền luôn cộng Quầy+KH nên ra 0.
      const driverView = f.roleFilter === 'driver' || (totPos === 0 && totDrv > 0);
      const writeTotalRow = (label, sums, fillArgb, bold) => {
        ws.mergeCells(r, 1, r, 11);
        const l = ws.getCell(r, 1);
        l.value = label;
        xlFont(l, { bold: true, color: { argb: 'FF0F172A' } });
        l.alignment = { horizontal: 'right', vertical: 'middle' };
        ws.mergeCells(r, 12, r, 13);
        const info = ws.getCell(r, 12);
        info.value = `Quầy+KH: ${sums.posN} đơn | Chủ xe: ${sums.drvN} đơn`;
        xlFont(info, { size: 9, color: { argb: 'FF334155' } });
        info.alignment = { horizontal: 'center', vertical: 'middle' };
        const m = ws.getCell(r, 14);
        m.value = driverView ? sums.drv : sums.pos;
        m.numFmt = XL.money;
        xlFont(m, { bold: true, color: { argb: 'FF065F46' } });
        const d = ws.getCell(r, 15);
        d.value = driverView ? sums.pos : sums.drv;
        d.numFmt = driverView ? '"Quầy+KH: "#,##0' : '"Chủ xe: "#,##0';
        xlFont(d, { bold: bold, size: 9, color: { argb: 'FF92400E' } });
        for (let c = 1; c <= N; c++) { const cell = ws.getCell(r, c); xlFill(cell, fillArgb); cell.border = XL.border; }
        ws.getRow(r).height = 20;
        r++;
      };

      // Nhóm theo ngày
      const byDay = [];
      groups.forEach(g => {
        const last = byDay[byDay.length - 1];
        if (last && last.dateKey === g.dateKey) last.groups.push(g);
        else byDay.push({ dateKey: g.dateKey, groups: [g] });
      });
      const grand = { pos: 0, drv: 0, posN: 0, drvN: 0 };

      byDay.forEach(day => {
        // Dòng tiêu đề ngày
        ws.mergeCells(r, 1, r, N);
        const dc = ws.getCell(r, 1);
        const dayTxt = day.dateKey ? fmtDateKeyVN(day.dateKey) : 'Ngày không hợp lệ';
        dc.value = `📅  NGÀY ${dayTxt}  —  ${day.groups.length} nhóm đơn`;
        xlFill(dc, 'FFCBD5E1');
        xlFont(dc, { bold: true, size: 11, color: { argb: 'FF0F172A' } });
        dc.alignment = { vertical: 'middle' };
        dc.border = XL.border;
        ws.getRow(r).height = 20;
        r++;

        const daySum = { pos: 0, drv: 0, posN: 0, drvN: 0 };
        day.groups.forEach(g => {
          stt++;
          const st = XL.status[g.status];
          const first = r;
          g.trips.forEach(t => {
            const role = XL.role[t.role] || { label: t.role || '', color: 'FF334155' };
            const vals = [stt, normalizeDateInput(t.dateStr) || '',t.timeStr || '', role.label, t.staff || '', formatDisplayTicket(t.ticketNumber), plateCell(t.plateNumber),
              t.carType || '', t.source || '', t.pickup ? 'Ga ' + t.pickup : '', t.destination || '', t.paymentMethod || '(Chưa ghi)',
              [t.note || '', (di => di && di.over ? `💸 ${discountText(di)}` : '')(discountInfo(t))].filter(Boolean).join(' | '),
              Number(t.totalFare || 0), auditStatusText(g)];
            const row = ws.getRow(r);
            vals.forEach((v, i) => {
              const c = row.getCell(i + 1);
              c.value = v;
              xlFill(c, st.fill);
              c.border = XL.border;
              xlFont(c, {});
              c.alignment = { vertical: 'middle', wrapText: i === 4 || i === 10 || i === 12 };
            });
            xlFont(row.getCell(4), { bold: true, color: { argb: role.color } });
            xlFont(row.getCell(6), { bold: true, color: { argb: 'FF1D4ED8' } });
            row.getCell(14).numFmt = XL.money;
            xlFont(row.getCell(14), { bold: true });
            [1, 2, 3, 6, 7, 10].forEach(i => { row.getCell(i).alignment = { horizontal: 'center', vertical: 'middle' }; });
            r++;
          });
          const last = r - 1;
          // STT và Trạng thái gộp ô theo nhóm
          if (last > first) { ws.mergeCells(first, 1, last, 1); ws.mergeCells(first, 15, last, 15); }
          const sc = ws.getCell(first, 15);
          xlFill(sc, g.overdue ? 'FFC2410C' : st.badge);
          xlFont(sc, { bold: true, color: { argb: 'FFFFFFFF' } });
          sc.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          const sn = ws.getCell(first, 1);
          xlFont(sn, { bold: true });
          sn.alignment = { horizontal: 'center', vertical: 'middle' };
          // Viền dưới đậm ngăn cách các nhóm
          for (let c = 1; c <= N; c++) {
            const cell = ws.getCell(last, c);
            cell.border = Object.assign({}, XL.border, { bottom: { style: 'medium', color: { argb: 'FF475569' } } });
          }
          const s = sideSums(g.trips);
          ['pos', 'drv', 'posN', 'drvN'].forEach(k => { daySum[k] += s[k]; grand[k] += s[k]; });
        });
        writeTotalRow(`CỘNG NGÀY ${dayTxt}`, daySum, 'FFF1F5F9', false);
      });

      r++;
      writeTotalRow('TỔNG CỘNG', grand, 'FFFDE68A', true);
      const totLabel = ws.getCell(r - 1, 1);
      xlFont(totLabel, { bold: true, size: 12, color: { argb: 'FF7C2D12' } });
      xlFont(ws.getCell(r - 1, 14), { bold: true, size: 12, color: { argb: 'FF065F46' } });

      // Ghi chú cách đọc
      r++;
      ws.mergeCells(r, 1, r, N);
      const note = ws.getCell(r, 1);
      note.value = 'Ghi chú: Tiền "Quầy + Kế hoạch" là doanh thu bán vé; tiền "Chủ xe" là số chủ xe/tài xế báo lại để đối chiếu (không cộng dồn hai bên). Màu xanh lá = trùng khớp, xanh dương = khớp nhưng tài xế ghi lệch 1 ngày, đỏ = lệch, vàng = chưa đủ 2 bên.';
      xlFont(note, { italic: true, size: 9, color: { argb: 'FF475569' } });
      note.alignment = { wrapText: true, vertical: 'top' };
      ws.getRow(r).height = 28;

      ws.autoFilter = { from: { row: 8, column: 1 }, to: { row: 8, column: N } };
      xlSignature(ws, r + 2, N);
    }

    // Trang "Dữ Liệu MISA": dữ liệu PHẲNG để copy/nạp vào phần mềm kế toán.
    // Biển số cho Excel: chỉ có chữ số (vd "170") -> ghi kiểu SỐ, để file đẩy MISA (VLOOKUP theo số) nhận được.
    // Trước đây ghi kiểu chữ -> Excel báo "số lưu dạng văn bản" (tam giác xanh) và VLOOKUP ra #N/A.
    function plateCell(v) {
      const s = String(v == null ? '' : v).replace(/[\r\n\t]+/g, ' ').trim().toUpperCase();
      return /^\d{1,9}$/.test(s) ? Number(s) : s;
    }
    // 3 số cuối biển số dạng SỐ (giống công thức file đẩy: NUMBERVALUE(RIGHT(...,3))): "51H-880.93" -> 93, "170" -> 170
    function plate3Num(v) {
      const d = String(v == null ? '' : v).replace(/\D/g, '');
      return d ? Number(d.slice(-3)) : '';
    }
    // Trang "Dữ Liệu MISA" (10/11): cột A→R ĐÚNG THỨ TỰ mẫu nạp MISA của kế toán (file đẩy, trang MISA) -> copy dán thẳng.
    // Cột không có dữ liệu trong app thì để trống (Mã khách hàng). Sau 1 cột trống là các cột tham khảo thêm.
    // Tiền là SỐ có phân cách hàng nghìn (#,##0), ngày là kiểu Ngày, mã TK/ĐVT là chữ.
    function buildFlatSheet(wb, groups) {
      const ws = wb.addWorksheet('Dữ Liệu MISA', { views: [{ state: 'frozen', ySplit: 1 }] });
      const MISA_COLS = [
        ['Phương thức thanh toán', 18], ['Ngày hạch toán (*)', 13], ['Ngày chứng từ (*)', 13], ['Số chứng từ (*)', 14], ['Số hóa đơn', 14],
        ['Mã khách hàng', 16], ['Mã dịch vụ (*)', 10], ['TK Tiền/Chi phí/Nợ (*)', 12], ['TK Doanh thu/Có (*)', 12], ['ĐVT', 8], ['Số lượng', 8],
        ['Đơn giá', 13], ['Thành tiền', 13], ['Mã công trình', 16], ['Mã nhân viên bán hàng', 24], ['Mã thống kê', 12], ['Mã thống kê', 12], ['Mã thống kê', 30]
      ];
      const cols = MISA_COLS;   // người dùng yêu cầu bỏ các cột tham khảo phía sau (10/11)
      ws.columns = cols.map(([header, width]) => ({ header, width }));
      const hr = ws.getRow(1);
      hr.height = 30;
      cols.forEach((c, i) => {
        const cell = hr.getCell(i + 1);
        if (!c[0]) return;
        cell.font = { bold: true };
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: i < MISA_COLS.length ? 'FF92D050' : 'FFE2E8F0' } };
        cell.border = XL.border;
      });
      const clean = v => String(v == null ? '' : v).replace(/[\r\n\t]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
      const MONEY = '#,##0';
      groups.forEach(g => {
        // Mỗi cuốc chỉ ghi 1 lần: có bên Bán vé/Kế hoạch thì lấy bên đó; chỉ có bên Chủ xe thì mới lấy bên Chủ xe (tránh trùng doanh thu)
        const sale = g.trips.filter(t => t.role !== 'driver');
        (sale.length ? sale : g.trips).forEach(t => {
          const dk = tripDateKey(t);
          const p = dk ? dk.split('-').map(Number) : null;
          // Dùng giờ UTC để Excel không lệch sang ngày hôm trước
          const dateVal = p ? new Date(Date.UTC(p[0], p[1] - 1, p[2])) : clean(t.dateStr);
          const ticket = formatDisplayTicket(clean(t.ticketNumber));
          const fare = Number(t.totalFare || 0);
          const row = ws.addRow([
            'Chưa thu tiền', dateVal, dateVal, ticket, ticket,
            '', 'VC', '131', '5113', 'Chuyến', 1,
            fare, fare, clean(t.source), clean(t.staff),
            clean(t.paymentMethod), t.pickup ? 'Ga ' + clean(t.pickup) : '', clean(t.destination)
          ]);
          if (p) { row.getCell(2).numFmt = 'dd/mm/yyyy'; row.getCell(3).numFmt = 'dd/mm/yyyy'; }
          [4, 5, 6, 8, 9, 10, 14, 15, 16, 17, 18].forEach(i => { row.getCell(i).numFmt = '@'; });
          row.getCell(11).numFmt = '0';
          row.getCell(12).numFmt = MONEY; row.getCell(13).numFmt = MONEY;
        });
      });
      ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: MISA_COLS.length } };
    }


    function buildSummarySheet(wb, groups, f) {
      const ws = wb.addWorksheet('Tổng Hợp', {
        views: [{ showGridLines: false }],
        pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
      });
      ws.columns = [{ width: 30 }, { width: 18 }, { width: 14 }, { width: 18 }, { width: 14 }, { width: 18 }];
      xlTitle(ws, 6, f, 'TỔNG HỢP ĐỐI SOÁT');
      let r = 6;
      const header = (cells) => {
        cells.filter(v => v !== '').forEach((v, i) => {
          const c = ws.getCell(r, i + 1);
          c.value = v;
          xlFill(c, 'FF0F172A');
          xlFont(c, { bold: true, color: { argb: 'FFFFFFFF' } });
          c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          c.border = XL.border;
        });
        ws.getRow(r).height = 30;
        r++;
      };
      const line = (cells, fill, bold) => {
        cells.filter(v => v !== '').forEach((v, i) => {
          const c = ws.getCell(r, i + 1);
          c.value = v;
          if (fill) xlFill(c, fill);
          xlFont(c, { bold: !!bold });
          c.border = XL.border;
          if (typeof v === 'number') { c.numFmt = '#,##0'; c.alignment = { horizontal: 'right' }; }
        });
        r++;
      };
      const section = title => {
        ws.mergeCells(r, 1, r, 6);
        const c = ws.getCell(r, 1);
        c.value = title;
        xlFont(c, { bold: true, size: 12, color: { argb: 'FF1E40AF' } });
        r++;
      };
      const moneyCols = (row, idxs) => idxs.forEach(i => { ws.getCell(row, i).numFmt = XL.money; });

      // 1. Theo trạng thái
      section('1. Theo trạng thái đối soát');
      header(['Trạng thái', 'Số nhóm đơn', 'Số đơn Quầy + KH', 'Tiền Quầy + KH', 'Số đơn Chủ xe', 'Tiền Chủ xe']);
      const tot = { n: 0, posN: 0, pos: 0, drvN: 0, drv: 0 };
      ['match', 'dateoff', 'mismatch', 'unmatched'].forEach(st => {
        const gs = groups.filter(g => g.status === st);
        const s = { posN: 0, pos: 0, drvN: 0, drv: 0 };
        gs.forEach(g => { const x = sideSums(g.trips); s.posN += x.posN; s.pos += x.pos; s.drvN += x.drvN; s.drv += x.drv; });
        tot.n += gs.length; tot.posN += s.posN; tot.pos += s.pos; tot.drvN += s.drvN; tot.drv += s.drv;
        line([AUDIT_STATUS[st].text, gs.length, s.posN, s.pos, s.drvN, s.drv], XL.status[st].fill);
        moneyCols(r - 1, [4, 6]);
      });
      line(['TỔNG CỘNG', tot.n, tot.posN, tot.pos, tot.drvN, tot.drv], 'FFFDE68A', true);
      moneyCols(r - 1, [4, 6]);
      r++;

      // 2. Theo hình thức thanh toán
      const allTrips = groups.flatMap(g => g.trips);
      section('2. Theo hình thức thanh toán');
      header(['Hình thức thanh toán', 'Số đơn Quầy + KH', 'Tiền Quầy + KH', 'Số đơn Chủ xe', 'Tiền Chủ xe', '']);
      const payMap = {};
      allTrips.forEach(t => {
        const k = t.paymentMethod || '(Chưa ghi)';
        if (!payMap[k]) payMap[k] = { posB: new Set(), pos: 0, drvB: new Set(), drv: 0 };
        const v = Number(t.totalFare || 0);
        if (t.role === 'driver') { payMap[k].drvB.add(billKey(t)); payMap[k].drv += v; } else { payMap[k].posB.add(billKey(t)); payMap[k].pos += v; }
      });
      Object.keys(payMap).sort().forEach(k => {
        const s = payMap[k];
        s.posN = s.posB.size; s.drvN = s.drvB.size;
        line([k, s.posN, s.pos, s.drvN, s.drv, ''], null);
        moneyCols(r - 1, [3, 5]);
      });
      r++;

      // 3. Theo nhân sự
      section('3. Theo nhân sự');
      header(['Nhân sự', 'Phân vùng', 'Số đơn', 'Tổng tiền', '', '']);
      const staffMap = {};
      allTrips.forEach(t => {
        const k = `${t.staff || '(Không tên)'}|${t.role}`;
        if (!staffMap[k]) staffMap[k] = { name: t.staff || '(Không tên)', role: (XL.role[t.role] || { label: t.role }).label, n: 0, v: 0 };
        staffMap[k].n++;
        staffMap[k].v += Number(t.totalFare || 0);
      });
      Object.values(staffMap).sort((a, b) => a.role.localeCompare(b.role) || b.v - a.v).forEach(s => {
        line([s.name, s.role, s.n, s.v, '', ''], null);
        moneyCols(r - 1, [4]);
      });
      xlSignature(ws, r + 2, 6);
    }

    function formatCurrSmartInput(el) {
      let raw = el.value.replace(/[^0-9]/g, '');
      if (!raw) { el.value = ''; return; }
      let num = parseInt(raw, 10);
      if (num < 10000) { num = num * 1000; }
      el.value = num.toLocaleString('vi-VN');
    }

    // ===== QUẢN LÝ TÀI KHOẢN (accounts/<USER>, roles/<uid>, login_index/<USER>) =====
    const USER_RE = /^[A-Z0-9_.-]{2,30}$/;

    function renderAccountsTable() {
      renderLegacyMigrateBox();
      const tb = document.getElementById('tbody-acc');
      if (!tb) return;
      const qEl = document.getElementById('acc-search');
      const q = qEl ? qEl.value.trim().toLowerCase() : '';
      const allUsers = Object.keys(accountsMap).sort();
      if (allUsers.length === 0) {
        tb.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Chưa có tài khoản nào.</td></tr>`;
        return;
      }
      const users = !q ? allUsers : allUsers.filter(u => {
        const a = accountsMap[u] || {};
        return `${u} ${ROLE_LABELS[a.role] || ''} ${a.active === false ? 'đã khóa khóa' : 'hoạt động'}`.toLowerCase().includes(q);
      });
      if (users.length === 0) {
        tb.innerHTML = `<tr><td colspan="5" class="p-4 text-center font-bold text-rose-600">❌ Không có tài khoản nào khớp "${escHtml(q)}" — tài khoản này CHƯA được tạo.</td></tr>`;
        return;
      }
      tb.innerHTML = users.map(u => {
        const a = accountsMap[u] || {};
        const isMe = loggedInUser && loggedInUser.user === u;
        const ue = escHtml(u);
        const roleSel = `<select class="inline-edit-input w-36" ${isMe ? 'disabled' : ''} onchange="changeAccountRole('${ue}', this.value)">
            ${Object.keys(ROLE_LABELS).map(r => `<option value="${r}" ${a.role === r ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
          </select>`;
        const status = a.active === false
          ? `<span class="px-2 py-1 bg-rose-100 text-rose-700 rounded-lg font-bold text-[10px]">⛔ Đã Khóa</span>`
          : `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg font-bold text-[10px]">✅ Hoạt Động</span>`;
        const actions = isMe
          ? `<span class="text-[11px] text-slate-400 italic">(Tài khoản của bạn — dùng nút 🔑 Đổi Mật Khẩu ở trên)</span>`
          : `<button onclick="openResetPasswordModal('${ue}')" class="px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold">🔑 Đặt Lại MK</button>
             <button onclick="toggleAccountActive('${ue}')" class="px-2.5 py-1 ${a.active === false ? 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700' : 'bg-amber-50 hover:bg-amber-100 text-amber-700'} rounded-lg font-bold">${a.active === false ? '🔓 Mở Khóa' : '⛔ Khóa'}</button>
             <button onclick="deleteAccount('${ue}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg font-bold">🗑️ Xóa</button>`;
        return `
          <tr>
            <td class="p-3 font-mono font-bold text-blue-700">${ue}${isMe ? ' <span class="text-[10px] text-slate-400">(bạn)</span>' : ''}</td>
            <td class="p-3 font-mono font-bold text-slate-400">●●●●●●</td>
            <td class="p-3">${roleSel}</td>
            <td class="p-3">${status}</td>
            <td class="p-3 text-center space-x-1 whitespace-nowrap">${actions}</td>
          </tr>`;
      }).join('');
    }

    function pendingLegacyAccounts() {
      return legacyAccounts.filter(a => a && a.user && !accountsMap[String(a.user).trim().toUpperCase()]);
    }

    function renderLegacyMigrateBox() {
      const box = document.getElementById('legacy-migrate-box');
      if (!box) return;
      const pending = pendingLegacyAccounts();
      if (pending.length === 0) {
        box.innerHTML = '';
        // Tất cả tài khoản cũ đã chuyển xong mà vẫn còn mật khẩu dạng chữ (vd do máy còn mở bản app cũ ghi lại) -> xóa đi
        if (accountsLoaded && legacyAccounts.length > 0 && isManager()) dbRef('settings/accounts').set(null).catch(() => {});
        return;
      }
      box.innerHTML = `
        <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="text-xs text-amber-900">
            <div class="font-extrabold">⚠️ Còn ${pending.length} tài khoản cũ chưa chuyển sang hệ thống bảo mật mới</div>
            <div class="mt-0.5">${pending.map(a => escHtml(String(a.user).toUpperCase())).join(', ')} — nhân viên giữ nguyên tài khoản & mật khẩu cũ.</div>
          </div>
          <button id="btn-migrate" onclick="migrateLegacyAccounts()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 rounded-xl text-xs font-extrabold shadow whitespace-nowrap">🔄 Chuyển Đổi Tài Khoản Cũ</button>
        </div>`;
    }

    async function writeAccount(u, uid, ver, role, active, oldUid) {
      const updates = {};
      if (oldUid && oldUid !== uid) updates[`roles/${oldUid}`] = null;
      updates[`roles/${uid}`] = { user: u, role, active: active !== false };
      updates[`accounts/${u}`] = { role, active: active !== false, uid, ver, updatedAt: Date.now() };
      updates[`login_index/${u}`] = { ver };
      await dbRoot().update(updates);
    }

    async function migrateLegacyAccounts() {
      const pending = pendingLegacyAccounts();
      if (pending.length === 0) return;
      if (!confirm(`Chuyển ${pending.length} tài khoản cũ sang hệ thống bảo mật mới?\nNhân viên vẫn đăng nhập bằng tài khoản & mật khẩu cũ.`)) return;
      const btn = document.getElementById('btn-migrate');
      if (btn) { btn.disabled = true; btn.innerText = '⏳ Đang chuyển...'; }
      const ok = [], fail = [];
      for (const a of pending) {
        const u = String(a.user).trim().toUpperCase();
        const p = String(a.pass == null ? '' : a.pass).trim();
        const role = ['pos', 'driver', 'plan', 'plan2', 'manager'].includes(a.role) ? a.role : 'pos';
        try {
          if (!p) throw new Error('không có mật khẩu');
          if (accountsMap[u]) { ok.push(u); continue; }
          const { uid, ver } = await createAuthUserFor(u, p, 0);
          await writeAccount(u, uid, ver, role, true, null);
          accountsMap[u] = { role, active: true, uid, ver };
          ok.push(u);
        } catch (e) {
          fail.push({ a, u, why: authErrorText(e) });
        }
      }
      // Xóa mật khẩu dạng chữ của các tài khoản đã chuyển xong; chỉ giữ lại tài khoản bị lỗi
      try {
        await dbRef('settings/accounts').set(fail.length ? fail.map(f => f.a) : null);
      } catch (e) {}
      renderAccountsTable();
      alert(`Đã chuyển xong ${ok.length} tài khoản.` + (fail.length ? `\nLỗi ${fail.length} tài khoản:\n` + fail.map(f => `- ${f.u}: ${f.why}`).join('\n') : ''));
    }

    async function saveAccount() {
      const u = document.getElementById('new-user').value.trim().toUpperCase();
      const p = document.getElementById('new-pass').value.trim();
      const r = document.getElementById('new-role').value;
      if (!USER_RE.test(u)) { alert("Tên tài khoản chỉ gồm chữ không dấu, số, dấu . _ - (2-30 ký tự)!"); return; }
      if (!p) { alert("Vui lòng nhập mật khẩu!"); return; }
      if (accountsMap[u] || pendingLegacyAccounts().some(a => String(a.user).toUpperCase() === u)) {
        alert("Tài khoản này đã tồn tại trong hệ thống!");
        return;
      }
      const btn = document.getElementById('btn-save-acc');
      btn.disabled = true; btn.innerText = '⏳ Đang tạo...';
      try {
        const { uid, ver } = await createAuthUserFor(u, p, 0);
        await writeAccount(u, uid, ver, r, true, null);
        document.getElementById('new-user').value = '';
        document.getElementById('new-pass').value = '';
        alert(`Đã tạo tài khoản ${u} (${ROLE_LABELS[r]}). Nhân viên đăng nhập được ngay!`);
      } catch (e) {
        alert("Không tạo được tài khoản: " + authErrorText(e));
      } finally {
        btn.disabled = false; btn.innerText = '+ Thêm Tài Khoản';
      }
    }

    function openResetPasswordModal(u) {
      closeLoginModals();
      const body = `
        <input type="text" id="reset-pass" autocomplete="off" placeholder="Mật khẩu mới (ngắn cũng được, vd 123)..." class="${inputCls}" onkeydown="if(event.key==='Enter') executeResetPassword('${escHtml(u)}')">
        <p class="text-[11px] text-slate-500">Nhân viên đăng nhập bằng tài khoản <b>${escHtml(u)}</b> với mật khẩu mới. Đơn hàng cũ giữ nguyên.</p>`;
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('reset-modal', 'bg-blue-600', '🔑', `Đặt Lại Mật Khẩu: ${escHtml(u)}`, body, 'Lưu Mật Khẩu Mới', `executeResetPassword('${escHtml(u)}')`));
      setTimeout(() => { const i = document.getElementById('reset-pass'); if (i) i.focus(); }, 50);
    }

    // Firebase không cho đổi mật khẩu người khác từ trình duyệt -> tạo tài khoản đăng nhập phiên bản mới, giữ nguyên tên tài khoản
    async function executeResetPassword(u) {
      const a = accountsMap[u];
      const p = document.getElementById('reset-pass').value.trim();
      if (!a) return;
      if (!p) { setModalBusy('reset-modal', false, 'Vui lòng nhập mật khẩu mới!'); return; }
      setModalBusy('reset-modal', true, 'Đang lưu...');
      try {
        const { uid, ver } = await createAuthUserFor(u, p, (a.ver || 0) + 1);
        await writeAccount(u, uid, ver, a.role, a.active !== false, a.uid);
        closeLoginModals();
        alert(`Đã đặt lại mật khẩu cho ${u}!`);
      } catch (e) {
        setModalBusy('reset-modal', false, authErrorText(e));
      }
    }

    function activeManagerCount() {
      return Object.values(accountsMap).filter(a => a && a.role === 'manager' && a.active !== false).length;
    }

    async function toggleAccountActive(u) {
      const a = accountsMap[u];
      if (!a || !a.uid) return;
      const newActive = a.active === false;
      if (!newActive && a.role === 'manager' && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý hoạt động!"); return; }
      if (!newActive && !confirm(`Khóa tài khoản ${u}? Người này sẽ bị đăng xuất ngay.`)) return;
      const updates = {};
      updates[`roles/${a.uid}/active`] = newActive;
      updates[`accounts/${u}/active`] = newActive;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); }
    }

    async function changeAccountRole(u, role) {
      const a = accountsMap[u];
      if (!a || !a.uid) return;
      if (a.role === 'manager' && role !== 'manager' && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý!"); renderAccountsTable(); return; }
      const updates = {};
      updates[`roles/${a.uid}/role`] = role;
      updates[`accounts/${u}/role`] = role;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); renderAccountsTable(); }
    }

    async function deleteAccount(u) {
      const a = accountsMap[u];
      if (!a) return;
      if (a.role === 'manager' && a.active !== false && activeManagerCount() <= 1) { alert("Phải còn ít nhất 1 quản lý!"); return; }
      if (!confirm(`Bạn có chắc chắn muốn xóa tài khoản ${u} không?\n(Đơn hàng đã nhập của tài khoản này vẫn được giữ lại)`)) return;
      const updates = {};
      if (a.uid) updates[`roles/${a.uid}`] = null;
      updates[`accounts/${u}`] = null;
      updates[`login_index/${u}`] = null;
      try { await dbRoot().update(updates); } catch (e) { alert(authErrorText(e)); }
    }

    // CHỈ DÙNG Ở BẢN THỬ: chép danh mục + đơn hàng từ dữ liệu thật sang vùng thử (chỉ ĐỌC dữ liệu thật).
    // Dữ liệu thật đã khóa -> cần đăng nhập tài khoản QUẢN LÝ CỦA BẢN CHÍNH (dùng app Firebase phụ, không ảnh hưởng phiên hiện tại).
    function copyRealDataToTest() {
      if (!IS_TEST_ENV || !DB_PREFIX) return;
      closeLoginModals();
      const body = `
        <p class="text-[11px] text-slate-600 text-center">Nhập tài khoản <b>Quản Lý của BẢN CHÍNH</b> để đọc dữ liệu thật (chỉ đọc, không sửa).</p>
        <input type="text" id="copy-user" autocomplete="off" placeholder="Tài khoản quản lý bản chính..." class="${inputCls} uppercase">
        <input type="password" id="copy-pass" autocomplete="off" placeholder="Mật khẩu..." class="${inputCls}" onkeydown="if(event.key==='Enter') executeCopyRealData()">`;
      document.body.insertAdjacentHTML('beforeend', loginModalHtml('copy-modal', 'bg-amber-500', '🧪', 'Chép Dữ Liệu Thật Vào Bản Thử', body, 'Chép Dữ Liệu', 'executeCopyRealData()'));
    }
    async function executeCopyRealData() {
      const u = document.getElementById('copy-user').value.trim().toUpperCase();
      const p = document.getElementById('copy-pass').value.trim();
      if (!u || !p) { setModalBusy('copy-modal', false, 'Vui lòng nhập tài khoản và mật khẩu!'); return; }
      setModalBusy('copy-modal', true, 'Đang đọc dữ liệu thật...');
      if (!secondaryApp) secondaryApp = firebase.initializeApp(firebaseConfig, 'tao-tai-khoan');
      const secAuth = secondaryApp.auth();
      const secDb = secondaryApp.database();
      try {
        const idx = (await rtdb.ref('login_index/' + u).once('value')).val();
        if (!idx) throw { code: 'app/no-account' };
        await secAuth.signInWithEmailAndPassword(`${u.toLowerCase()}${idx.ver ? '.v' + idx.ver : ''}@taxi-tss.local`, authPassword(p));
        const trips = (await secDb.ref('trips').once('value')).val() || {};
        const users = new Set(Object.values(trips).map(t => t && t.createdBy).filter(Boolean));
        const updates = {};
        for (const k of ['sources', 'staff', 'carTypes', 'payments', 'planPayments', 'plan2Payments', 'lockHour']) {
          const v = (await secDb.ref('settings/' + k).once('value')).val();
          if (v !== null && v !== undefined) updates['settings/' + k] = v;
        }
        const pl = (await secDb.ref('places').once('value').catch(() => null));
        if (pl && pl.val()) Object.entries(pl.val()).forEach(([k, v]) => { updates['places/' + k] = v; });
        Object.keys(trips).forEach(id => { updates['trips/' + id] = trips[id]; });
        for (const usr of users) {
          const ut = (await secDb.ref('users_trips/' + usr).once('value')).val();
          if (ut) updates['users_trips/' + usr] = ut;
        }
        try { await secAuth.signOut(); } catch (e) {}
        setModalBusy('copy-modal', true, 'Đang ghi vào bản thử...');
        await writeInChunks(updates);
        closeLoginModals();
        alert(`Đã chép ${Object.keys(trips).length} đơn hàng và danh mục vào bản thử! (Tài khoản không chép — bản thử dùng tài khoản riêng)`);
      } catch (e) {
        try { await secAuth.signOut(); } catch (e2) {}
        setModalBusy('copy-modal', false, e && e.code === 'app/no-account' ? 'Tài khoản không có ở bản chính!' : authErrorText(e));
      }
    }
  </script>
</body>
</html>
